<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIZÚ MILITAR FÊNIX - ELITE</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --azul-marinho: #001233;
            --dourado-ouro: #D4AF37;
            --vermelho-tatico: #bc0000;
        }
        body { background-color: var(--azul-marinho); color: white; margin: 0; font-family: 'Segoe UI', sans-serif; }
        .militar-gradient { background: linear-gradient(135deg, #001233 0%, #000814 100%); }
        .text-ouro { color: var(--dourado-ouro); }
        .border-ouro { border: 2px solid var(--dourado-ouro); }
        .bg-ouro { background-color: var(--dourado-ouro); }
        
        .linha-vermelha { 
            height: 3px; 
            background: repeating-linear-gradient(45deg, var(--vermelho-tatico), var(--vermelho-tatico) 10px, #7b0000 10px, #7b0000 20px); 
        }

        .card-escola { 
            background: rgba(255,255,255,0.03); 
            border: 1px solid rgba(212, 175, 55, 0.1);
            border-bottom: 4px solid var(--dourado-ouro);
            transition: 0.3s;
        }
        .card-escola:hover { transform: translateY(-5px); background: rgba(212, 175, 55, 0.1); }
        
        .capa-apostila {
            width: 100%;
            height: 280px;
            object-fit: cover;
            border-bottom: 2px solid var(--dourado-ouro);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- CONFIGURAÇÃO DE LOGOS ---
        const LOGO_BIZU_MILITAR = "https://i.ibb.co/C3mFvXv/logo-bizu.png"; 
        const LOGO_ESQUADRAO_FENIX = "https://i.ibb.co/9H7W1V8/logo-fenix.png"; 

        function App() {
            const [status, setStatus] = useState('login'); 
            const [userLogado, setUserLogado] = useState(null);
            const [escolaSel, setEscolaSel] = useState('');

            const frasesMotivacionais = [
                "O treinamento difícil torna o combate bem mais fácil",
                "A disciplina é a alma de um exército",
                "Só o que é bom dura o tempo suficiente para se tornar inesquecível.",
                "A limitação está apenas na sua mente e não no seu corpo",
                "A jornada mais longa começa com o primeiro passo.",
                "Se você pode sonhar, pode realizar."
            ];

            const handleLogin = (e) => {
                e.preventDefault();
                // Simulação de login do Comandante Eufrásio
                setUserLogado({ nome: "EUFRÁSIO", patente: "Comandante", perfil: "ADMIN" });
                setStatus('qg');
            };

            if (status === 'login') {
                return (
                    <div className="min-h-screen flex items-center justify-center p-6 militar-gradient">
                        <div className="max-w-md w-full bg-black/60 p-10 rounded-2xl border-2 border-ouro text-center shadow-2xl">
                            <img src={LOGO_BIZU_MILITAR} alt="Bizu Militar" className="h-32 mx-auto mb-6 drop-shadow-[0_0_10px_rgba(212,175,55,0.5)]" />
                            <div className="linha-vermelha mb-8"></div>
                            <form onSubmit={handleLogin} className="flex flex-col gap-4 text-left">
                                <label className="text-[10px] font-black text-ouro uppercase tracking-widest">Matrícula</label>
                                <input type="text" placeholder="EX: 184LMC" className="p-3 bg-white/5 border border-ouro/30 rounded text-white outline-none focus:border-ouro" />
                                <label className="text-[10px] font-black text-ouro uppercase tracking-widest">Senha</label>
                                <input type="password" placeholder="******" className="p-3 bg-white/5 border border-ouro/30 rounded text-white outline-none focus:border-ouro" />
                                <button type="submit" className="mt-4 bg-ouro text-black py-4 rounded font-black hover:bg-white transition-all uppercase text-xs tracking-tighter">Entrar no Combate</button>
                            </form>
                        </div>
                    </div>
                );
            }

            if (status === 'qg') {
                return (
                    <div className="min-h-screen">
                        <header className="bg-[#000814] border-b-2 border-ouro p-4 flex justify-between items-center px-8 shadow-2xl">
                            <div className="flex items-center gap-4">
                                <img src={LOGO_ESQUADRAO_FENIX} className="h-12" />
                                <span className="font-black italic text-xl text-ouro hidden md:block">CENTRAL DE COMANDO</span>
                            </div>
                            <div className="text-right">
                                <p className="text-[10px] font-bold opacity-70">BEM-VINDO, {userLogado.patente.toUpperCase()}</p>
                                <p className="text-sm font-black text-ouro">{userLogado.nome}</p>
                            </div>
                        </header>
                        
                        <main className="max-w-6xl mx-auto p-10">
                            <div className="grid grid-cols-2 md:grid-cols-3 gap-6 mb-16">
                                {['COLÉGIO NAVAL', 'CMRJ', 'EEAR', 'EsPCEx', 'ESA', 'CONCURSOS'].map(escola => (
                                    <button key={escola} onClick={() => {setEscolaSel(escola); setStatus('escola');}} 
                                            className="card-escola p-8 rounded-xl flex flex-col items-center gap-4 group">
                                        <div className="w-16 h-16 bg-ouro rounded-full flex items-center justify-center text-black font-black text-xl shadow-lg group-hover:scale-110 transition-transform italic">HQ</div>
                                        <span className="font-black tracking-widest uppercase text-xs text-ouro">{escola}</span>
                                    </button>
                                ))}
                            </div>

                            <div className="linha-vermelha mb-6"></div>
                            <div className="bg-black/30 p-8 rounded-xl border border-white/5 text-center">
                                <h3 className="text-[10px] font-black text-ouro mb-4 tracking-[0.3em] uppercase">Mensagem da Semana</h3>
                                <div className="space-y-2 italic text-slate-300 font-serif">
                                    {frasesMotivacionais.slice(0, 3).map((f, i) => <p key={i}>"{f}"</p>)}
                                </div>
                            </div>
                        </main>
                    </div>
                );
            }

            // --- ARSENAL DO COLÉGIO NAVAL ---
            const arsenal = [
                { mat: 'HISTÓRIA', img: 'https://i.ibb.co/tPbpMN1z/capa-historia.jpg' },
                { mat: 'INGLÊS', img: 'https://i.ibb.co/rRGhQGv8/capa-ingles.jpg' },
                { mat: 'MATEMÁTICA', img: 'https://i.ibb.co/MD42sWr9/capa-matematica.jpg' },
                { mat: 'PORTUGUÊS', img: 'https://i.ibb.co/tTJPWYsH/capa-portugues.jpg' },
                { mat: 'QUÍMICA', img: 'https://i.ibb.co/gZ78ThkL/capa-quimica.jpg' },
                { mat: 'GEOGRAFIA', img: 'https://i.ibb.co/G4rdS7qT/capa-geografia.jpg' },
                { mat: 'BIOLOGIA', img: 'https://i.ibb.co/bgrXnP4z/capa-biologia.jpg' }
            ];

            return (
                <div className="min-h-screen militar-gradient">
                    <header className="bg-[#000814] border-b-2 border-ouro p-4 flex justify-between items-center px-8">
                         <div className="flex items-center gap-4">
                            <img src={LOGO_ESQUADRAO_FENIX} className="h-10" />
                            <span className="font-black italic text-lg text-ouro uppercase">{escolaSel}</span>
                        </div>
                        <button onClick={() => setStatus('qg')} className="bg-white/5 border border-ouro/30 px-4 py-2 rounded text-[10px] font-black hover:bg-ouro hover:text-black transition-all">VOLTAR AO QG</button>
                    </header>

                    <main className="max-w-7xl mx-auto p-10">
                        <div className="grid grid-cols-4 md:grid-cols-8 gap-2 mb-10">
                            {['APOSTILAS', 'VÍDEOS', 'MOTIVAÇÃO', 'INSTITUC.', 'SIMULADOS', 'PROVAS', 'EDITAIS', 'GABARITOS'].map(m => (
                                <button key={m} className="bg-white/5 border border-ouro/10 p-2 rounded text-[8px] font-black hover:bg-ouro hover:text-black transition-all uppercase">{m}</button>
                            ))}
                        </div>

                        <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
                            {arsenal.map((item, idx) => (
                                <div key={idx} className="bg-black/40 border border-ouro/20 rounded-lg overflow-hidden group hover:border-ouro transition-all shadow-xl">
                                    <img src={item.img} alt={item.mat} className="capa-apostila" />
                                    <div className="p-4 text-center">
                                        <h4 className="font-black text-[10px] text-ouro mb-3 tracking-widest">{item.mat}</h4>
                                        <button className="w-full bg-ouro text-black font-black py-2 rounded text-[9px] hover:bg-white transition-all">ACESSAR MATERIAL</button>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
