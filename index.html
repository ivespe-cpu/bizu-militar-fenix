<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIZÚ MILITAR FÊNIX - PLATAFORMA DE ELITE</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --azul-marinho: #001233; --dourado-ouro: #D4AF37; --vermelho-tatico: #bc0000; }
        body { background-color: var(--azul-marinho); color: white; margin: 0; font-family: 'Segoe UI', sans-serif; overflow-x: hidden; }
        .militar-gradient { background: linear-gradient(135deg, #001233 0%, #000814 100%); }
        .linha-vermelha { height: 4px; background: repeating-linear-gradient(45deg, var(--vermelho-tatico), var(--vermelho-tatico) 10px, #7b0000 10px, #7b0000 20px); width: 100%; }
        
        /* Botões de Acesso ao Material */
        .btn-material { 
            background-color: var(--dourado-ouro) !important; 
            color: #000000 !important; 
            font-weight: 900 !important; 
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 12px;
            border-radius: 6px;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.2);
        }
        .btn-material:hover { background-color: white !important; transform: translateY(-2px); }

        /* Botão Voltar ao QG */
        .btn-voltar-fixo { 
            background-color: #ffffff !important; 
            color: #000000 !important; 
            font-weight: 900 !important; 
            padding: 12px 28px !important; 
            border: 3px solid var(--dourado-ouro) !important;
            font-size: 16px !important;
            text-transform: uppercase;
            box-shadow: 0 0 20px rgba(255,255,255,0.2);
        }

        .card-escola { position: relative; height: 180px; border-radius: 12px; border-bottom: 4px solid var(--dourado-ouro); overflow: hidden; display: flex; align-items: center; justify-content: center; background-size: cover; background-position: center; transition: 0.4s; cursor: pointer; }
        .card-escola::before { content: ""; position: absolute; inset: 0; background: rgba(0, 18, 51, 0.7); }
        .sigla-txt { position: relative; z-index: 10; font-size: 2.2rem; font-weight: 900; color: var(--dourado-ouro); font-style: italic; text-shadow: 2px 2px 10px black; }
        .capa-doc { width: 100%; height: 280px; object-fit: contain; background: #000; }
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: var(--dourado-ouro); border-radius: 10px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const BASE_URL = "https://raw.githubusercontent.com/ivespe-cpu/bizufenix/main/";

        const ALUNOS_DB = [
            { m: "ags186", p: "SG.GASPARELLO", pts: 1500 }, { m: "alm170", p: "SG. MOURA", pts: 1450 },
            { m: "bsp223", p: "SD. PINHEIRO", pts: 1200 }, { m: "bab196", p: "CB. BRAYAN", pts: 1100 },
            { m: "bbs203", p: "SD. BERNARDO", pts: 900 }, { m: "cvs208", p: "CB. CAMILA", pts: 1050 },
            { m: "dva194", p: "CB. ALBUQUERQUE", pts: 1300 }, { m: "esp192", p: "SG. PEIXOTO", pts: 1250 },
            { m: "egc228", p: "CB. ENZO", pts: 850 }, { m: "gsp187", p: "SG. GABRIELLE PEREIRA", pts: 1400 },
            { m: "gac174", p: "SG. GABRIELLY COUTINHO", pts: 1350 }, { m: "gem240", p: "SD.MICAELA", pts: 950 },
            { m: "gfa109", p: "SUB.TEN. ARAUJO", pts: 1900 }, { m: "hls197", p: "CB. SALES", pts: 1150 },
            { m: "icg127", p: "SG. GRANADO", pts: 1600 }, { m: "iws159", p: "SG. LIMA", pts: 1550 },
            { m: "jgm108", p: "SUB.TEN. MORAES", pts: 1950 }, { m: "jpj110", p: "ASP. JOÃO SAMUEL", pts: 2000 },
            { m: "jva190", p: "SG. ANDRADE", pts: 1480 }, { m: "jhs198", p: "CB. JOSUÉ", pts: 1120 },
            { m: "jcm166", p: "SG. JUNIO", pts: 1420 }, { m: "kfs245", p: "CB. FONTES", pts: 1080 },
            { m: "lgb226", p: "CB. BELTRON", pts: 1190 }, { m: "lod225", p: "CB. FADINI", pts: 1170 },
            { m: "lse165", p: "SG. ELEUTHÉRIO", pts: 1510 }, { m: "lfs220", p: "CB. LUIZ FERNANDO", pts: 1030 },
            { m: "lmc184", p: "SG. COSTA", pts: 1800 }, { m: "mps144", p: "SG. PEÇANHA", pts: 1750 },
            { m: "mis133", p: "SG. IRENO", pts: 1320 }, { m: "nmp214", p: "CB. NATHAN", pts: 800 },
            { m: "nab161", p: "SG. NICOLLAS ARTHUR", pts: 1580 }, { m: "nvo148", p: "SG. NICOLY VICTORIA", pts: 1570 },
            { m: "php105", p: "SUB.TEN. PAULO", pts: 1910 }, { m: "pha219", p: "CB. PEDRO HENRIQUE", pts: 1180 },
            { m: "pho188", p: "SG. DE PAULA", pts: 1410 }, { m: "phm185", p: "SG. PEDRO RIBEIRO", pts: 1430 },
            { m: "phc232", p: "SD. PIETRO", pts: 920 }, { m: "rsb130", p: "SG. BARBOSA", pts: 1620 },
            { m: "scg216", p: "SD. SAMANTHA", pts: 940 }, { m: "tvo212", p: "SG. THAYANE", pts: 1390 },
            { m: "tgs164", p: "SG. GARCIA", pts: 1470 }, { m: "vho129", p: "SG. VICTOR HUGO", pts: 1650 }
        ];

        const ESCOLAS = [
            { s: 'COLÉGIO NAVAL', i: 'https://images.unsplash.com/photo-1590490360182-c33d57733427?w=500' },
            { s: 'EPCAR', i: 'https://www2.fab.mil.br/epcar/images/noticias/2023/fab_em_destaque_2.jpg' },
            { s: 'CMRJ', i: 'https://upload.wikimedia.org/wikipedia/commons/thumb/5/5a/Col%C3%A9gio_Militar_do_Rio_de_Janeiro.jpg/500px-Col%C3%A9gio_Militar_do_Rio_de_Janeiro.jpg' },
            { s: 'EsPCEX', i: 'https://www.eb.mil.br/documents/10138/10321350/ESA1.jpg' },
            { s: 'EEAR', i: 'https://www2.fab.mil.br/eear/images/noticias/2023/06_JUNHO/23_eear/DSC_0137.jpg' },
            { s: 'ESA', i: 'https://upload.wikimedia.org/wikipedia/commons/0/0e/Escola_de_Sargentos_das_Armas.jpg' }
        ];

        const MATERIAIS = [
            { t: "MATEMÁTICA", f: "matematica.png" }, { t: "PORTUGUÊS", f: "portugues.png" },
            { t: "INGLÊS", f: "ingles.png" }, { t: "HISTÓRIA", f: "historia.png" },
            { t: "GEOGRAFIA", f: "geografia.png" }, { t: "FÍSICA", f: "fisica.png" }, // Alterado para fisica sem acento
            { t: "QUÍMICA", f: "quimica.png" }, { t: "BIOLOGIA", f: "biologia.png" }
        ];

        function App() {
            const [status, setStatus] = useState('login'); 
            const [user, setUser] = useState(null);
            const [senhaIn, setSenhaIn] = useState('');
            const [escolaSel, setEscolaSel] = useState('');

            const handleLogin = (e) => {
                e.preventDefault();
                const s = senhaIn.toLowerCase().trim();
                const aluno = ALUNOS_DB.find(a => a.m === s);
                if (s === "esp0815" || s === "admin") { setUser({ p: "COMANDANTE", pts: "∞" }); setStatus('qg'); }
                else if (aluno) { setUser(aluno); setStatus('qg'); }
                else { alert("ACESSO NEGADO!"); }
            };

            if (status === 'login') return (
                <div className="min-h-screen flex items-center justify-center p-6 militar-gradient">
                    <div className="max-w-md w-full bg-black/80 p-10 rounded-2xl border-2 border-ouro/30 shadow-2xl text-center">
                        <img src="https://i.ibb.co/BKLSQKT1/logo-bizu.jpg" className="w-full mb-6 rounded-lg shadow-lg border border-ouro/10" />
                        <div className="linha-vermelha mb-8"></div>
                        <input type="password" value={senhaIn} onChange={(e) => setSenhaIn(e.target.value)}
                               className="w-full p-4 mb-4 bg-white/5 border border-ouro/20 rounded text-white text-center text-xl font-mono" placeholder="DIGITE SUA MATRÍCULA" />
                        <button onClick={handleLogin} className="w-full btn-material">ENTRAR NO SISTEMA</button>
                    </div>
                </div>
            );

            if (status === 'qg') return (
                <div className="min-h-screen">
                    <header className="bg-[#000814] border-b-2 border-ouro p-6 flex items-center justify-between px-10 sticky top-0 z-50 shadow-2xl">
                        <img src="https://i.ibb.co/Q31w6PLJ/logo-esquadrao.jpg" className="h-14 rounded" />
                        <div className="text-center"><h2 className="text-xl font-black text-ouro italic uppercase">Olá, {user.p}</h2></div>
                        <button onClick={() => setStatus('login')} className="text-red-500 font-bold text-xs uppercase border border-red-500/20 px-3 py-1 rounded">Sair</button>
                    </header>
                    <main className="max-w-7xl mx-auto p-6 grid grid-cols-1 lg:grid-cols-3 gap-8">
                        <div className="lg:col-span-2 grid grid-cols-1 md:grid-cols-2 gap-4">
                            {ESCOLAS.map(e => (
                                <div key={e.s} onClick={() => {setEscolaSel(e.s); setStatus('escola');}} 
                                     className="card-escola hover:scale-[1.02] active:scale-95 transition-all" style={{backgroundImage: `url(${e.i})`}}>
                                    <span className="sigla-txt">{e.s}</span>
                                </div>
                            ))}
                        </div>
                        <div className="bg-black/40 p-5 rounded-xl border border-ouro/20 h-[550px] flex flex-col shadow-2xl">
                            <h3 className="text-ouro font-black text-center mb-4 italic uppercase border-b border-ouro/10 pb-2 tracking-widest">Ranking Pelotão</h3>
                            <div className="space-y-2 overflow-y-auto custom-scroll pr-2">
                                {ALUNOS_DB.sort((a,b) => b.pts - a.pts).map((a, i) => (
                                    <div key={i} className="flex justify-between p-3 bg-white/5 rounded text-[11px] border-l-4 border-ouro">
                                        <span className="font-bold">{i+1}º {a.p}</span>
                                        <span className="text-ouro font-black">{a.pts} PTS</span>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </main>
                </div>
            );

            return (
                <div className="min-h-screen militar-gradient">
                    <header className="bg-[#000814] border-b-2 border-ouro p-6 flex justify-between items-center px-10 sticky top-0 z-50 shadow-2xl">
                        <div className="flex items-center gap-4">
                            <img src="https://i.ibb.co/Q31w6PLJ/logo-esquadrao.jpg" className="h-10 rounded" />
                            <h1 className="text-lg font-black text-ouro uppercase italic tracking-tighter">{escolaSel}</h1>
                        </div>
                        <button onClick={() => setStatus('qg')} className="btn-voltar-fixo">
                            VOLTAR AO QG
                        </button>
                    </header>
                    <main className="max-w-7xl mx-auto p-6">
                        <div className="grid grid-cols-2 md:grid-cols-6 gap-2 mb-12">
                            {['APOSTILAS', 'VÍDEOS', 'SIMULADOS', 'PROVAS', 'EDITAIS', 'GABARITOS'].map(m => (
                                <button key={m} onClick={() => alert("Módulo em fase de carregamento.")}
                                        className="bg-white/5 border border-ouro/20 p-3 rounded text-[10px] font-black hover:bg-ouro hover:text-black transition-all uppercase tracking-widest">{m}</button>
                            ))}
                        </div>
                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8">
                            {MATERIAIS.map((m, i) => (
                                <div key={i} className="bg-black/60 border border-ouro/20 rounded-2xl overflow-hidden flex flex-col shadow-2xl group">
                                    <div className="h-[300px] bg-black flex items-center justify-center p-2">
                                        <img src={BASE_URL + m.f} className="capa-doc group-hover:scale-105 transition-all duration-500" 
                                             onError={(e) => {e.target.src="https://via.placeholder.com/300x400?text=CAPA+NAO+ENCONTRADA";}} />
                                    </div>
                                    <div className="p-5 text-center bg-white/5 border-t border-ouro/10">
                                        <div className="text-ouro font-black text-xs mb-4 uppercase tracking-[0.2em]">{m.t}</div>
                                        <button className="w-full btn-material">ACESSAR MATERIAL</button>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
