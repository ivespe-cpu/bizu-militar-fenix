<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIZÚ MILITAR FÊNIX - PLATAFORMA DE ELITE</title>
    
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        :root { --azul-marinho: #001233; --dourado-ouro: #D4AF37; --vermelho-tatico: #bc0000; }
        body { background-color: var(--azul-marinho); color: white; margin: 0; font-family: 'Segoe UI', sans-serif; overflow-x: hidden; }
        .militar-gradient { background: linear-gradient(135deg, #001233 0%, #000814 100%); min-height: 100vh; }
        .linha-vermelha { height: 4px; background: repeating-linear-gradient(45deg, var(--vermelho-tatico), var(--vermelho-tatico) 10px, #7b0000 10px, #7b0000 20px); width: 100%; }
        
        /* BOTÕES */
        .btn-material { background-color: #D4AF37 !important; color: #000 !important; font-weight: 900 !important; text-transform: uppercase; padding: 12px; border-radius: 6px; transition: 0.3s; width: 100%; }
        .btn-material:hover { transform: scale(1.02); box-shadow: 0 0 15px rgba(212, 175, 55, 0.4); }
        .btn-voltar-fixo { background-color: #fff !important; color: #000 !important; font-weight: 900 !important; padding: 8px 16px !important; border: 3px solid #D4AF37 !important; text-transform: uppercase; cursor: pointer; }
        
        /* CARDS */
        .card-escola { position: relative; height: 180px; border-radius: 12px; border-bottom: 4px solid #D4AF37; overflow: hidden; display: flex; align-items: center; justify-content: center; background-size: cover; background-position: center; cursor: pointer; transition: 0.4s; background-color: #000; }
        .card-escola:hover { transform: translateY(-5px); border-bottom-color: #fff; }
        .card-escola::before { content: ""; position: absolute; inset: 0; background: rgba(0, 18, 51, 0.7); transition: 0.3s; }
        
        .sigla-txt { position: relative; z-index: 10; font-size: 2.2rem; font-weight: 900; color: #D4AF37; font-style: italic; text-shadow: 2px 2px 10px black; }
        .frase-box { background: rgba(0,0,0,0.5); border-left: 4px solid var(--vermelho-tatico); padding: 20px; border-radius: 0 8px 8px 0; }
        
        /* VIDEO CONTAINER */
        .video-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 8px; border: 1px solid rgba(212, 175, 55, 0.3); }
        .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
        
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #D4AF37; border-radius: 10px; }
        .motion-header { height: 60px; filter: drop-shadow(0 0 5px #D4AF37); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const BASE_URL = "https://raw.githubusercontent.com/ivespe-cpu/bizufenix/main/";

        // --- BANCO DE DADOS: ALUNOS (Mantido) ---
        const ALUNOS_DB = [
            { m: "ags186", p: "SG.GASPARELLO", pts: 1500 }, { m: "alm170", p: "SG. MOURA", pts: 1450 },
            { m: "bsp223", p: "SD. PINHEIRO", pts: 1200 }, { m: "bab196", p: "CB. BRAYAN", pts: 1100 },
            { m: "bbs203", p: "SD. BERNARDO", pts: 900 }, { m: "cvs208", p: "CB. CAMILA", pts: 1050 },
            { m: "dva194", p: "CB. ALBUQUERQUE", pts: 1300 }, { m: "esp192", p: "SG. PEIXOTO", pts: 1250 },
            { m: "egc228", p: "CB. ENZO", pts: 850 }, { m: "gsp187", p: "SG. GABRIELLE PEREIRA", pts: 1400 },
            { m: "gac174", p: "SG. GABRIELLY COUTINHO", pts: 1350 }, { m: "gem240", p: "SD.MICAELA", pts: 950 },
            { m: "gfa109", p: "SUB.TEN. ARAUJO", pts: 1900 }, { m: "hls197", p: "CB. SALES", pts: 1150 },
            { m: "icg127", p: "SG. GRANADO", pts: 1600 }, { m: "iws159", p: "SG. LIMA", pts: 1550 },
            { m: "jgm108", p: "SUB.TEN. MORAES", pts: 1950 }, { m: "jpj110", p: "ASP. JOÃO SAMUEL", pts: 2000 },
            { m: "jva190", p: "SG. ANDRADE", pts: 1480 }, { m: "jhs198", p: "CB. JOSUÉ", pts: 1120 },
            { m: "jcm166", p: "SG. JUNIO", pts: 1420 }, { m: "kfs245", p: "CB. FONTES", pts: 1080 },
            { m: "lgb226", p: "CB. BELTRON", pts: 1190 }, { m: "lod225", p: "CB. FADINI", pts: 1170 },
            { m: "lse165", p: "SG. ELEUTHÉRIO", pts: 1510 }, { m: "lfs220", p: "CB. LUIZ FERNANDO", pts: 1030 },
            { m: "lmc184", p: "SG. COSTA", pts: 1800 }, { m: "mps144", p: "SG. PEÇANHA", pts: 1750 },
            { m: "mis133", p: "SG. IRENO", pts: 1320 }, { m: "nmp214", p: "CB. NATHAN", pts: 800 },
            { m: "nab161", p: "SG. NICOLLAS ARTHUR", pts: 1580 }, { m: "nvo148", p: "SG. NICOLY VICTORIA", pts: 1570 },
            { m: "php105", p: "SUB.TEN. PAULO", pts: 1910 }, { m: "pha219", p: "CB. PEDRO HENRIQUE", pts: 1180 },
            { m: "pho188", p: "SG. DE PAULA", pts: 1410 }, { m: "phm185", p: "SG. PEDRO RIBEIRO", pts: 1430 },
            { m: "phc232", p: "SD. PIETRO", pts: 920 }, { m: "rsb130", p: "SG. BARBOSA", pts: 1620 },
            { m: "scg216", p: "SD. SAMANTHA", pts: 940 }, { m: "tvo212", p: "SG. THAYANE", pts: 1390 },
            { m: "tgs164", p: "SG. GARCIA", pts: 1470 }, { m: "vho129", p: "SG. VICTOR HUGO", pts: 1650 }
        ];

        const FRASES_COMANDO = [
            "A limitação está apenas na sua mente.",
            "Coragem não é não ter medo, e sim, seguir em frente.",
            "Grandes batalhas só são dadas a grandes guerreiros.",
            "Vencer na vida não é um destino, é a sua escolha.",
            "Os fortes agem, avançam e deixam um legado."
        ];

        const ESCOLAS = [
            { s: 'COLÉGIO NAVAL', i: 'cn.jpg' }, { s: 'EPCAR', i: 'epcar.jpg' },
            { s: 'CMRJ', i: 'cmrj.jpg' }, { s: 'EsPCEX', i: 'espcex.jpg' },
            { s: 'EEAR', i: 'eear.jpg' }, { s: 'ESA', i: 'esa.jpg' }
        ];

        const MATERIAIS = [
            { t: "MATEMÁTICA", f: "matematica.png" }, { t: "PORTUGUÊS", f: "portugues.png" },
            { t: "INGLÊS", f: "ingles.png" }, { t: "HISTÓRIA", f: "historia.png" },
            { t: "GEOGRAFIA", f: "geografia.png" }, { t: "FÍSICA", f: "fisica.png" },
            { t: "QUÍMICA", f: "quimica.png" }, { t: "BIOLOGIA", f: "biologia.png" }
        ];

        function App() {
            const [status, setStatus] = useState('login'); 
            const [user, setUser] = useState(null);
            const [senhaIn, setSenhaIn] = useState('');
            const [escolaSel, setEscolaSel] = useState('');
            const [fraseDia, setFraseDia] = useState('');
            const [tipoDoc, setTipoDoc] = useState(''); 
            const [pdfAtivo, setPdfAtivo] = useState(null);

            useEffect(() => {
                setFraseDia(FRASES_COMANDO[Math.floor(Math.random() * FRASES_COMANDO.length)]);
            }, [status]);

            const handleLogin = (e) => {
                if(e) e.preventDefault();
                const s = senhaIn.toLowerCase().trim();
                const aluno = ALUNOS_DB.find(a => a.m === s);
                if (s === "esp0815" || s === "admin") { setUser({ p: "COMANDANTE", pts: "∞" }); setStatus('qg'); }
                else if (aluno) { setUser(aluno); setStatus('qg'); }
                else { alert("ACESSO NEGADO! Verifique sua matrícula."); }
            };

            const renderContent = () => {
                // TELA 1: LOGIN (MANTIDA)
                if (status === 'login') return (
                    <div className="min-h-screen flex items-center justify-center p-6">
                        <div className="max-w-md w-full bg-black/80 p-8 rounded-2xl border-2 border-[#D4AF37]/30 shadow-2xl text-center">
                            <video className="w-full rounded mb-6 border border-[#D4AF37]/20" autoPlay loop muted playsInline>
                                <source src={BASE_URL + "bizu8.mp4"} type="video/mp4" />
                            </video>
                            <div className="linha-vermelha mb-8"></div>
                            <input type="password" value={senhaIn} onChange={(e) => setSenhaIn(e.target.value)}
                                   className="w-full p-4 mb-4 bg-white/5 border border-[#D4AF37]/20 rounded text-white text-center text-xl font-mono focus:outline-none focus:border-[#D4AF37]" placeholder="MATRÍCULA" />
                            <button onClick={handleLogin} className="w-full btn-material">AUTENTICAR</button>
                        </div>
                    </div>
                );

                // TELA 2: QG SELEÇÃO (MANTIDA)
                if (status === 'qg') return (
                    <div className="min-h-screen">
                        <header className="bg-[#000814] border-b-2 border-[#D4AF37] p-4 flex items-center justify-between px-6 sticky top-0 z-50">
                            <video className="motion-header" autoPlay loop muted playsInline>
                                <source src={BASE_URL + "esquadrao2.mp4"} type="video/mp4" />
                            </video>
                            <div className="text-center hidden md:block">
                                <h2 className="text-xl font-black text-[#D4AF37] italic uppercase">BEM-VINDO, {user?.p}</h2>
                                <p className="text-[10px] text-white/60 tracking-widest mt-1 uppercase">PLATAFORMA OPERACIONAL FÊNIX</p>
                            </div>
                            <button onClick={() => setStatus('login')} className="text-red-500 font-bold border border-red-500/20 px-3 py-1 rounded text-xs">SAIR</button>
                        </header>
                        <main className="max-w-7xl mx-auto p-6 grid grid-cols-1 lg:grid-cols-3 gap-8">
                            <div className="lg:col-span-2">
                                <div className="frase-box mb-8">
                                    <p className="text-[#D4AF37] text-xs font-black mb-2 tracking-[0.3em]">ORDEM DO DIA:</p>
                                    <p className="text-xl font-medium italic">"{fraseDia}"</p>
                                </div>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    {ESCOLAS.map(e => (
                                        <div key={e.s} onClick={() => {setEscolaSel(e.s); setStatus('escola');}} 
                                             className="card-escola hover:scale-[1.02] transition-all" 
                                             style={{backgroundImage: `url(${BASE_URL + e.i})`}}>
                                            <span className="sigla-txt">{e.s}</span>
                                        </div>
                                    ))}
                                </div>
                            </div>
                            <div className="bg-black/40 p-5 rounded-xl border border-[#D4AF37]/20 h-[550px] flex flex-col shadow-2xl">
                                <h3 className="text-[#D4AF37] font-black text-center mb-4 uppercase tracking-widest border-b border-[#D4AF37]/10 pb-2">Ranking Pelotão</h3>
                                <div className="space-y-2 overflow-y-auto custom-scroll pr-2">
                                    {ALUNOS_DB.sort((a,b) => b.pts - a.pts).map((a, i) => (
                                        <div key={i} className="flex justify-between p-3 bg-white/5 rounded text-[11px] border-l-4 border-[#D4AF37]">
                                            <span>{i+1}º {a.p}</span>
                                            <span className="text-[#D4AF37] font-black">{a.pts} PTS</span>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </main>
                    </div>
                );

                // TELA 3: NOVA ESTRUTURA DA ESCOLA (O "HUB" DE 5 PILARES)
                if (status === 'escola') return (
                    <div className="min-h-screen militar-gradient">
                        <header className="bg-[#000814] border-b-2 border-[#D4AF37] p-4 flex justify-between items-center px-6 sticky top-0 z-40">
                            <h1 className="text-lg font-black text-[#D4AF37] uppercase italic">{escolaSel}</h1>
                            <button onClick={() => setStatus('qg')} className="btn-voltar-fixo">VOLTAR AO QG</button>
                        </header>
                        
                        <main className="max-w-6xl mx-auto p-6 space-y-6">
                            
                            {/* PIALR 1: CENTRO DE INSTRUÇÃO (VIDEOAULAS SEMANAIS) */}
                            <section className="bg-black/60 border-2 border-[#D4AF37] rounded-2xl overflow-hidden shadow-2xl">
                                <div className="bg-[#D4AF37] text-black p-2 text-center font-black text-sm tracking-widest uppercase">
                                    ⚡ Centro de Instrução (Videoaulas da Semana)
                                </div>
                                <div className="p-6 flex flex-col md:flex-row items-center gap-6">
                                    <div className="w-full md:w-2/3 video-container">
                                        {/* Placeholder de vídeo - aqui entrará a aula semanal */}
                                        <iframe src="https://www.youtube.com/embed/H0Gssr6mZbw" allowFullScreen></iframe>
                                    </div>
                                    <div className="w-full md:w-1/3 text-center md:text-left space-y-4">
                                        <h3 className="text-2xl font-black text-[#D4AF37]">AULA 01: O INÍCIO DA JORNADA</h3>
                                        <p className="text-sm text-gray-300 italic">"Nesta aula, nosso instrutor virtual apresenta os pilares da aprovação no {escolaSel}."</p>
                                        <button onClick={() => alert("Resumo em PDF liberado na próxima semana.")} className="w-full py-3 bg-white/10 border border-[#D4AF37] text-[#D4AF37] font-bold rounded hover:bg-[#D4AF37] hover:text-black transition">BAIXAR RESUMO DA AULA</button>
                                    </div>
                                </div>
                            </section>

                            {/* GRID DE ACESSO AOS OUTROS 4 PILARES */}
                            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                                
                                {/* PILLAR 2: ARSENAL TEÓRICO */}
                                <button onClick={() => setStatus('materiais_menu')} className="flex flex-col items-center p-6 bg-blue-900/30 border border-blue-500/50 rounded-xl hover:bg-blue-800 transition shadow-lg">
                                    <span className="text-4xl mb-2">📚</span>
                                    <span className="font-black text-sm">ARSENAL TEÓRICO</span>
                                    <span className="text-[10px] opacity-60">APOSTILAS E BIZUS</span>
                                </button>

                                {/* PILLAR 3: CAMPO DE BATALHA */}
                                <button onClick={() => setStatus('simulado_interno')} className="flex flex-col items-center p-6 bg-red-900/30 border border-red-500/50 rounded-xl hover:bg-red-800 transition shadow-lg">
                                    <span className="text-4xl mb-2">⚔️</span>
                                    <span className="font-black text-sm">CAMPO DE BATALHA</span>
                                    <span className="text-[10px] opacity-60">SIMULADOS E PROVAS</span>
                                </button>

                                {/* PILLAR 4: INTELIGÊNCIA */}
                                <button onClick={() => { setTipoDoc('EDITAIS'); setStatus('documentos'); }} className="flex flex-col items-center p-6 bg-gray-800/50 border border-gray-400/50 rounded-xl hover:bg-gray-700 transition shadow-lg">
                                    <span className="text-4xl mb-2">🧠</span>
                                    <span className="font-black text-sm">INTELIGÊNCIA</span>
                                    <span className="text-[10px] opacity-60">EDITAIS E DATAS</span>
                                </button>

                                {/* PILLAR 5: CINE FÊNIX */}
                                <button onClick={() => setStatus('videos')} className="flex flex-col items-center p-6 bg-yellow-900/30 border border-yellow-500/50 rounded-xl hover:bg-yellow-800 transition shadow-lg">
                                    <span className="text-4xl mb-2">🎬</span>
                                    <span className="font-black text-sm">CINE FÊNIX</span>
                                    <span className="text-[10px] opacity-60">MOTIVAÇÃO E INSTITUCIONAL</span>
                                </button>

                            </div>
                        </main>
                    </div>
                );

                // --- AS OUTRAS TELAS FORAM MANTIDAS INTEGRALMENTE ABAIXO ---

                if (status === 'simulado_interno') {
                    return (
                        <div className="min-h-screen militar-gradient p-6">
                            <header className="flex justify-between items-center max-w-4xl mx-auto mb-10 border-b border-[#D4AF37] pb-4 sticky top-0 bg-[#001233] z-50 pt-2">
                                <h1 className="text-[#D4AF37] font-black text-xl italic">COMBATE: {escolaSel}</h1>
                                <button onClick={() => setStatus('escola')} className="btn-voltar-fixo text-xs">RECUAR</button>
                            </header>
                            <div className="max-w-4xl mx-auto text-center py-20">
                                <p className="text-xl text-gray-400">CARREGANDO BANCO DE DADOS DE SIMULADOS...</p>
                                <button onClick={() => setStatus('escola')} className="mt-6 btn-material max-w-xs">VOLTAR</button>
                            </div>
                        </div>
                    );
                }

                if (status === 'materiais_menu') return (
                     <div className="min-h-screen">
                        <header className="bg-[#000814] border-b-2 border-[#D4AF37] p-4 flex justify-between items-center px-6 sticky top-0 z-40">
                            <h1 className="text-lg font-black text-[#D4AF37] uppercase italic">ARSENAL: {escolaSel}</h1>
                            <button onClick={() => setStatus('escola')} className="btn-voltar-fixo">VOLTAR</button>
                        </header>
                        <main className="max-w-6xl mx-auto p-8 text-center">
                            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                                {MATERIAIS.map((m, i) => (
                                    <div key={i} className="bg-black/60 border border-[#D4AF37]/20 rounded-2xl overflow-hidden flex flex-col shadow-lg">
                                        <div className="h-[200px] bg-black flex items-center justify-center p-2 border-b border-[#D4AF37]/10">
                                            <img src={BASE_URL + m.f} className="h-full object-contain" alt={m.t} />
                                        </div>
                                        <div className="p-4 text-center bg-white/5 flex-grow flex flex-col justify-between">
                                            <div className="text-[#D4AF37] font-black text-xs mb-3 uppercase tracking-wider">{m.t}</div>
                                            <button onClick={() => alert("Acesso liberado em breve pelo Comando.")} className="w-full btn-material text-[10px] py-2">LER APOSTILA</button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </main>
                    </div>
                );

                if (status === 'documentos') {
                    const arquivos = ["prova2024CN.pdf", "edital2023CN.pdf", "gabarito2024CN.pdf"];
                    return (
                        <div className="min-h-screen">
                            <header className="bg-[#000814] border-b-2 border-[#D4AF37] p-4 flex justify-between items-center px-10">
                                <h1 className="text-xl font-black text-[#D4AF37] italic uppercase">{tipoDoc}</h1>
                                <button onClick={() => setStatus('escola')} className="btn-voltar-fixo">VOLTAR</button>
                            </header>
                            <main className="max-w-4xl mx-auto p-6">
                                <div className="space-y-3">
                                    {arquivos.map((arq, idx) => (
                                        <div key={idx} className="flex justify-between items-center p-4 bg-black/40 border-l-4 border-[#D4AF37] rounded">
                                            <span className="text-xs font-bold uppercase text-gray-300">{arq}</span>
                                            <button onClick={() => setPdfAtivo({ url: arq, nome: arq.toUpperCase() })}
                                                    className="bg-[#D4AF37] text-black text-[10px] font-black px-6 py-2 rounded">VISUALIZAR</button>
                                        </div>
                                    ))}
                                </div>
                            </main>
                        </div>
                    );
                }

                if (status === 'videos') return (
                    <div className="min-h-screen">
                        <header className="bg-[#000814] border-b-2 border-[#D4AF37] p-4 flex justify-between items-center px-6 sticky top-0 z-50">
                            <h1 className="text-xl font-black text-[#D4AF37] italic uppercase">🎬 CINE FÊNIX</h1>
                            <button onClick={() => setStatus('escola')} className="btn-voltar-fixo">VOLTAR</button>
                        </header>
                        <main className="max-w-7xl mx-auto p-6 text-center">
                            <p className="text-gray-400 mb-8 font-black">VÍDEOS INSTITUCIONAIS E MOTIVACIONAIS</p>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-8 text-left">
                                <div className="bg-black/60 p-4 rounded-xl border border-[#D4AF37]/20">
                                    <h3 className="text-[#D4AF37] font-bold mb-3 uppercase text-xs">MOTIVACIONAL: QUEM DISSE QUE SERIA FÁCIL</h3>
                                    <div className="video-container">
                                        <iframe src={`https://www.youtube.com/embed/dOV_Dum7t58`} allowFullScreen></iframe>
                                    </div>
                                </div>
                                <div className="bg-black/60 p-4 rounded-xl border border-[#D4AF37]/20">
                                    <h3 className="text-[#D4AF37] font-bold mb-3 uppercase text-xs">MARINHA DO BRASIL</h3>
                                    <div className="video-container">
                                        <iframe src={`https://www.youtube.com/embed/zSSp5CQpg10`} allowFullScreen></iframe>
                                    </div>
                                </div>
                            </div>
                        </main>
                    </div>
                );
            };

            return (
                <div className="militar-gradient relative min-h-screen">
                    {renderContent()}

                    {/* MODAL DE PDF (MANTIDO) */}
                    {pdfAtivo && (
                        <div className="fixed inset-0 z-[9999] bg-black/95 flex flex-col p-2 md:p-6">
                            <div className="flex justify-between items-center mb-4 bg-[#000814] p-4 border border-[#D4AF37]/30 rounded">
                                <h2 className="text-[#D4AF37] font-black uppercase text-xs italic tracking-widest">
                                    LEITURA: {pdfAtivo.nome}
                                </h2>
                                <button onClick={() => setPdfAtivo(null)} 
                                        className="bg-red-600 text-white px-6 py-2 rounded font-black">
                                    FECHAR
                                </button>
                            </div>
                            <div className="flex-1 bg-white rounded overflow-hidden border-2 border-[#D4AF37]/20 shadow-2xl">
                                <iframe src={`https://docs.google.com/viewer?url=${encodeURIComponent(BASE_URL + pdfAtivo.url)}&embedded=true`} 
                                        className="w-full h-full border-0" />
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
