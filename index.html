<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIZÚ MILITAR FÊNIX - COMANDO GERAL</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --ouro: #D4AF37; --azul: #001233; }
        body { background: var(--azul); color: white; font-family: 'Segoe UI', sans-serif; overflow-x: hidden; }
        .militar-gradient { background: linear-gradient(135deg, #001233 0%, #000814 100%); }
        .glass { background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(15px); border: 1px solid rgba(212, 175, 55, 0.3); }
        
        /* LOGO MOTION CONTAINER */
        .video-container { width: 150px; height: 150px; margin: 0 auto 20px; border-radius: 50%; border: 2px solid var(--ouro); overflow: hidden; background: black; }
        
        .card-escola { 
            height: 140px; border-radius: 12px; border-bottom: 4px solid var(--ouro);
            background-size: cover; background-position: center; transition: 0.4s; cursor: pointer;
            position: relative;
        }
        .card-escola:hover { transform: scale(1.05); box-shadow: 0 0 20px rgba(212, 175, 55, 0.4); }
        .overlay-escola { position: absolute; inset: 0; background: rgba(0,18,51,0.7); display: flex; align-items: center; justify-content: center; border-radius: 8px; }
        .card-escola:hover .overlay-escola { background: rgba(0,18,51,0.3); }

        .capa-apostila { 
            min-width: 170px; height: 250px; background: #000; border: 1px solid var(--ouro);
            border-radius: 10px; padding: 10px; display: flex; flex-direction: column; justify-content: space-between;
        }
        .scroll-custom::-webkit-scrollbar { height: 6px; }
        .scroll-custom::-webkit-scrollbar-thumb { background: var(--ouro); border-radius: 10px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        const GITHUB_URL = "https://raw.githubusercontent.com/ivespe-cpu/bizufenix/main/";

        function App() {
            const [view, setView] = useState('login');
            const [modal, setModal] = useState(null);
            const [extraOpen, setExtraOpen] = useState(false);

            const login = () => setView('qg');

            if (view === 'login') return (
                <div className="min-h-screen flex items-center justify-center militar-gradient p-6">
                    <div className="glass p-12 rounded-[40px] max-w-sm w-full text-center border-t-4 border-ouro">
                        {/* ESPAÇO PARA LOGO MOTION (VÍDEO) */}
                        <div className="video-container">
                            <video autoPlay loop muted className="w-full h-full object-cover">
                                <source src="LINK_DO_SEU_VIDEO_MOTION.mp4" type="video/mp4" />
                            </video>
                        </div>
                        <h1 className="text-ouro font-black text-3xl italic tracking-tighter mb-1">BIZÚ MILITAR</h1>
                        <p className="text-[10px] tracking-[0.5em] text-white opacity-40 mb-8 uppercase">Esquadrão Fênix</p>
                        
                        <div className="space-y-4">
                            <input type="text" placeholder="MATRÍCULA" className="w-full p-4 bg-white/5 border border-ouro/20 rounded-xl outline-none focus:border-ouro text-center font-bold" />
                            <button onClick={login} className="w-full bg-ouro text-black font-black py-4 rounded-xl hover:scale-105 transition shadow-[0_10px_20px_rgba(212,175,55,0.3)]">INICIAR MISSÃO</button>
                        </div>
                    </div>
                </div>
            );

            return (
                <div className="min-h-screen militar-gradient">
                    <header className="p-6 glass border-b-2 border-ouro flex justify-between items-center sticky top-0 z-50">
                        <div className="flex items-center gap-4">
                            <img src="LINK_LOGO_ESTATICA.png" className="w-12 h-12 rounded-full border border-ouro" alt="Fênix" />
                            <h2 className="text-ouro font-black text-xl italic">BIZÚ MILITAR FÊNIX</h2>
                        </div>
                        <button onClick={() => setView('login')} className="bg-red-600/20 text-red-500 border border-red-500/50 px-4 py-2 rounded-lg text-xs font-black">LOGOUT</button>
                    </header>

                    <main className="max-w-6xl mx-auto p-6">
                        {/* FRASE DA SEMANA - RESTAURADA */}
                        <div className="bg-white/5 border-l-8 border-ouro p-8 rounded-r-2xl mb-12 relative overflow-hidden">
                            <div className="absolute top-0 right-0 p-4 opacity-10 text-6xl font-black">"</div>
                            <h4 className="text-ouro font-black text-xs uppercase mb-3 tracking-widest">Ordem do Dia:</h4>
                            <p className="text-2xl font-serif italic text-white/90">"A disciplina é o fogo que forja a espada do vencedor. O cansaço é temporário, a farda é eterna."</p>
                        </div>

                        {/* 6 ESCOLAS - BOTÕES ATIVOS */}
                        <h3 className="text-ouro font-black italic mb-6 flex items-center gap-2">
                            <span className="w-8 h-[2px] bg-ouro"></span> UNIDADES MILITARES
                        </h3>
                        <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-6 mb-16">
                            {['CN', 'EEAR', 'ESA', 'EsPCEx', 'EPCAR', 'CMRJ'].map(esc => (
                                <div key={esc} onClick={() => setModal(esc)} className="card-escola">
                                    <div className="overlay-escola text-ouro font-black text-2xl italic">{esc}</div>
                                </div>
                            ))}
                        </div>

                        {/* 8 APOSTILAS COM LINKS REAIS */}
                        <h3 className="text-ouro font-black italic mb-6 flex justify-between items-center">
                            <span>📚 ARSENAL DIDÁTICO</span>
                            <button onClick={() => setExtraOpen(true)} className="bg-ouro text-black px-4 py-2 rounded-full text-[10px] font-black hover:bg-white transition">EXTRAS +</button>
                        </h3>
                        <div className="flex gap-6 overflow-x-auto pb-8 scroll-custom">
                            {[
                                {m: "MATEMÁTICA", p: "prova2025CN-mat-ingles.pdf"},
                                {m: "PORTUGUÊS", p: "prova2023CN-Port-Ciencias.pdf"},
                                {m: "FÍSICA", p: "prova2025CN-mat-ingles.pdf"},
                                {m: "INGLÊS", p: "prova2024CN-mat-ingles.pdf"},
                                {m: "HISTÓRIA", p: "edital2023CN.pdf"},
                                {m: "GEOGRAFIA", p: "edital2022CN.pdf"},
                                {m: "QUÍMICA", p: "prova2024CN-Port-Ciencias.pdf"},
                                {m: "BIOLOGIA", p: "prova2023CN-Port-Ciencias.pdf"}
                            ].map((ap, i) => (
                                <div key={i} className="capa-apostila">
                                    <div className="flex-grow flex items-center justify-center bg-ouro/5 border border-ouro/20 rounded font-black text-[11px] text-center p-2 italic uppercase">
                                        BIZÚ FÊNIX<br/>{ap.m}
                                    </div>
                                    <h5 className="text-[10px] font-bold my-2 text-ouro">{ap.m}</h5>
                                    <button onClick={() => window.open(GITHUB_URL + ap.p)} className="w-full py-2 bg-ouro text-black text-[9px] font-black rounded hover:bg-white transition">BAIXAR PDF</button>
                                </div>
                            ))}
                        </div>
                    </main>

                    {/* MODAL ESCOLAS */}
                    {modal && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center bg-black/90 p-4" onClick={() => setModal(null)}>
                            <div className="glass max-w-lg w-full p-8 rounded-[30px] border-2 border-ouro" onClick={e => e.stopPropagation()}>
                                <h2 className="text-ouro font-black text-4xl italic mb-8 text-center">{modal}</h2>
                                <div className="grid grid-cols-1 gap-4">
                                    <button onClick={() => window.open(GITHUB_URL + 'prova2025CN-mat-ingles.pdf')} className="p-4 bg-white/5 border border-ouro/20 rounded-xl font-bold text-left hover:bg-ouro hover:text-black transition">📄 PROVAS RECENTES</button>
                                    <button onClick={() => window.open(GITHUB_URL + 'edital2023CN.pdf')} className="p-4 bg-white/5 border border-ouro/20 rounded-xl font-bold text-left hover:bg-ouro hover:text-black transition">📜 EDITAL COMPLETO</button>
                                    <button className="p-4 bg-white/5 border border-ouro/20 rounded-xl font-bold text-left opacity-30">📑 SIMULADOS EXCLUSIVOS</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MODAL EXTRAS */}
                    {extraOpen && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center bg-black/95 p-4" onClick={() => setExtraOpen(false)}>
                            <div className="glass max-w-md w-full p-10 rounded-[30px] border-2 border-ouro text-center">
                                <h2 className="text-ouro font-black text-2xl mb-6 italic tracking-widest">CONTEÚDO EXTRA</h2>
                                <p className="text-sm opacity-60 mb-8 font-serif">Acesso liberado a manuais de conduta, dicas de TAF e orientações psicológicas para o Esquadrão.</p>
                                <button onClick={() => window.open(GITHUB_URL + 'edital2023CN.pdf')} className="w-full py-4 bg-ouro text-black font-black rounded-xl mb-4">VER MANUAIS</button>
                                <button onClick={() => setExtraOpen(false)} className="text-red-500 font-black text-xs uppercase">Fechar</button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
