<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIZÚ MILITAR FÊNIX - PLATAFORMA DE ELITE</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --azul-marinho: #001233; --dourado-ouro: #D4AF37; --vermelho-tatico: #bc0000; }
        body { background-color: var(--azul-marinho); color: white; margin: 0; font-family: 'Segoe UI', sans-serif; overflow-x: hidden; }
        .militar-gradient { background: linear-gradient(135deg, #001233 0%, #000814 100%); }
        .linha-vermelha { height: 4px; background: repeating-linear-gradient(45deg, var(--vermelho-tatico), var(--vermelho-tatico) 10px, #7b0000 10px, #7b0000 20px); width: 100%; }
        
        .btn-material { 
            background-color: var(--dourado-ouro) !important; 
            color: #000000 !important; 
            font-weight: 900 !important; 
            text-transform: uppercase;
            padding: 12px;
            border-radius: 6px;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
        }

        .btn-voltar-fixo { 
            background-color: #ffffff !important; 
            color: #000000 !important; 
            font-weight: 900 !important; 
            padding: 10px 20px !important; 
            border: 2px solid var(--dourado-ouro) !important;
            text-transform: uppercase;
        }

        .card-escola { position: relative; height: 180px; border-radius: 12px; border-bottom: 4px solid var(--dourado-ouro); overflow: hidden; display: flex; align-items: center; justify-content: center; background-size: cover; background-position: center; cursor: pointer; }
        .card-escola::before { content: ""; position: absolute; inset: 0; background: rgba(0, 18, 51, 0.6); }
        .sigla-txt { position: relative; z-index: 10; font-size: 2rem; font-weight: 900; color: var(--dourado-ouro); font-style: italic; text-shadow: 2px 2px 10px black; }
        
        .video-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 12px; border: 2px solid var(--dourado-ouro); }
        .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

        @keyframes pulse-gold {
            0% { box-shadow: 0 0 0 0 rgba(212, 175, 55, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(212, 175, 55, 0); }
            100% { box-shadow: 0 0 0 0 rgba(212, 175, 55, 0); }
        }
        .animate-fenix { animation: pulse-gold 2s infinite; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const BASE_URL = "https://raw.githubusercontent.com/ivespe-cpu/bizufenix/main/";

        const ALUNOS_DB = [
            { m: "ags186", p: "SG.GASPARELLO", pts: 1500 }, { m: "alm170", p: "SG. MOURA", pts: 1450 },
            { m: "gfa109", p: "SUB.TEN. ARAUJO", pts: 1900 }, { m: "jgm108", p: "SUB.TEN. MORAES", pts: 1950 },
            { m: "jpj110", p: "ASP. JOÃO SAMUEL", pts: 2000 }, { m: "php105", p: "SUB.TEN. PAULO", pts: 1910 }
        ];

        // BANCO DE DADOS DE VÍDEOS (IDS ATUALIZADOS)
        const VIDEOS_DB = [
            { t: "FAB - REPORTAGEM SOBRE A EPCAR", id: "Vq_Z5KNmuks" },
            { t: "ISTO É A MARINHA DO BRASIL", id: "zSSp5CQpg10" },
            { t: "VÍDEO INSTITUCIONAL - MARINHA", id: "H0Gssr6mZbw" },
            { t: "LUTE PELOS SEUS SONHOS", id: "Nc3WusSAIQI" },
            { t: "QUEM DISSE QUE SERIA FÁCIL", id: "dOV_Dum7t58" },
            { t: "ESPCEX AMAN MOTIVACIONAL", id: "WKMS3LfGERo" }
        ];

        const ESCOLAS = [
            { s: 'COLÉGIO NAVAL', i: 'cn.jpg' }, { s: 'EPCAR', i: 'epcar.jpg' },
            { s: 'CMRJ', i: 'cmrj.jpg' }, { s: 'EsPCEX', i: 'espcex.jpg' },
            { s: 'EEAR', i: 'eear.jpg' }, { s: 'ESA', i: 'esa.jpg' }
        ];

        const MATERIAIS = [
            { t: "MATEMÁTICA", f: "matematica.png" }, { t: "PORTUGUÊS", f: "portugues.png" },
            { t: "INGLÊS", f: "ingles.png" }, { t: "HISTÓRIA", f: "historia.png" }
        ];

        function App() {
            const [status, setStatus] = useState('login'); 
            const [user, setUser] = useState(null);
            const [senhaIn, setSenhaIn] = useState('');
            const [escolaSel, setEscolaSel] = useState('');

            const handleLogin = (e) => {
                e.preventDefault();
                const s = senhaIn.toLowerCase().trim();
                const aluno = ALUNOS_DB.find(a => a.m === s);
                if (s === "esp0815" || s === "admin") { setUser({ p: "COMANDANTE", pts: "∞" }); setStatus('qg'); }
                else if (aluno) { setUser(aluno); setStatus('qg'); }
                else { alert("ACESSO NEGADO!"); }
            };

            // TELA DE LOGIN
            if (status === 'login') return (
                <div className="min-h-screen flex items-center justify-center p-6 militar-gradient">
                    <div className="max-w-md w-full bg-black/80 p-10 rounded-2xl border-2 border-[#D4AF37]/30 shadow-2xl text-center">
                        <div className="linha-vermelha mb-8"></div>
                        <input type="password" value={senhaIn} onChange={(e) => setSenhaIn(e.target.value)}
                               className="w-full p-4 mb-4 bg-white/5 border border-[#D4AF37]/20 rounded text-white text-center text-xl font-mono" placeholder="MATRÍCULA" />
                        <button onClick={handleLogin} className="w-full btn-material">ENTRAR NO SISTEMA</button>
                    </div>
                </div>
            );

            // TELA QG
            if (status === 'qg') return (
                <div className="min-h-screen">
                    <header className="bg-[#000814] border-b-2 border-[#D4AF37] p-6 flex items-center justify-between px-10 sticky top-0 z-50">
                        <div className="text-center w-full">
                            <h2 className="text-2xl font-black text-[#D4AF37] italic uppercase">SEJA BEM VINDO, {user.p}</h2>
                        </div>
                        <button onClick={() => setStatus('login')} className="bg-red-600 px-4 py-2 rounded font-bold text-xs">SAIR</button>
                    </header>
                    <main className="max-w-7xl mx-auto p-10 grid grid-cols-1 lg:grid-cols-3 gap-8">
                        <div className="lg:col-span-2 grid grid-cols-1 md:grid-cols-2 gap-6">
                            {ESCOLAS.map(e => (
                                <div key={e.s} onClick={() => {setEscolaSel(e.s); setStatus('escola');}} 
                                     className="card-escola hover:scale-[1.03] transition-all" 
                                     style={{backgroundImage: `url(${BASE_URL + e.i})`}}>
                                    <span className="sigla-txt">{e.s}</span>
                                </div>
                            ))}
                        </div>
                        <div className="bg-black/40 p-5 rounded-xl border border-[#D4AF37]/20">
                            <h3 className="text-[#D4AF37] font-black text-center mb-4 italic uppercase border-b border-[#D4AF37]/10 pb-2">Ranking Pelotão</h3>
                            {ALUNOS_DB.sort((a,b) => b.pts - a.pts).map((a, i) => (
                                <div key={i} className="flex justify-between p-3 mb-2 bg-white/5 rounded text-[11px] border-l-4 border-[#D4AF37]">
                                    <span className="font-bold">{i+1}º {a.p}</span>
                                    <span className="text-[#D4AF37] font-black">{a.pts} PTS</span>
                                </div>
                            ))}
                        </div>
                    </main>
                </div>
            );

            // TELA DE VÍDEOS (CINE FÊNIX) - CORRIGIDA
            if (status === 'videos') return (
                <div className="min-h-screen militar-gradient">
                    <header className="bg-[#000814] border-b-2 border-[#D4AF37] p-4 flex justify-between items-center px-10 sticky top-0 z-50">
                        <h1 className="text-xl font-black text-[#D4AF37] italic uppercase">CINE FÊNIX - {escolaSel}</h1>
                        <button onClick={() => setStatus('escola')} className="btn-voltar-fixo">VOLTAR</button>
                    </header>
                    <main className="max-w-6xl mx-auto p-10 grid grid-cols-1 md:grid-cols-2 gap-12">
                        {VIDEOS_DB.map((v, i) => (
                            <div key={i} className="bg-black/60 p-4 rounded-xl border border-[#D4AF37]/20 shadow-2xl">
                                <h3 className="text-[#D4AF37] font-bold mb-4 uppercase text-center text-sm">{v.t}</h3>
                                <div className="video-container">
                                    <iframe 
                                        src={`https://www.youtube.com/embed/${v.id}`} 
                                        allowFullScreen>
                                    </iframe>
                                </div>
                            </div>
                        ))}
                    </main>
                </div>
            );

            // TELA DA ESCOLA (CORREÇÃO DO BOTÃO VÍDEOS)
            return (
                <div className="min-h-screen militar-gradient">
                    <header className="bg-[#000814] border-b-2 border-[#D4AF37] p-4 flex justify-between items-center px-10 sticky top-0 z-50">
                        <h1 className="text-xl font-black text-[#D4AF37] uppercase italic">{escolaSel}</h1>
                        <button onClick={() => setStatus('qg')} className="btn-voltar-fixo">VOLTAR AO QG</button>
                    </header>
                    <main className="max-w-7xl mx-auto p-8">
                        <div className="grid grid-cols-2 md:grid-cols-6 gap-3 mb-12">
                            <button className="bg-white/10 p-3 rounded text-[10px] font-black uppercase text-[#D4AF37] border border-[#D4AF37]/30">APOSTILAS</button>
                            
                            {/* BOTÃO CORRIGIDO: AMARELO E PULSANTE */}
                            <button onClick={() => setStatus('videos')} 
                                    className="bg-[#D4AF37] text-black p-3 rounded text-[10px] font-black uppercase animate-fenix">
                                🎬 VER VÍDEOS
                            </button>

                            <button className="bg-white/5 p-3 rounded text-[10px] font-black uppercase opacity-50">SIMULADOS</button>
                            <button className="bg-white/5 p-3 rounded text-[10px] font-black uppercase opacity-50">PROVAS</button>
                            <button className="bg-white/5 p-3 rounded text-[10px] font-black uppercase opacity-50">EDITAIS</button>
                            <button className="bg-white/5 p-3 rounded text-[10px] font-black uppercase opacity-50">GABARITOS</button>
                        </div>
                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8">
                            {MATERIAIS.map((m, i) => (
                                <div key={i} className="bg-black/60 border border-[#D4AF37]/20 rounded-2xl overflow-hidden shadow-2xl">
                                    <div className="h-[280px] bg-black flex items-center justify-center">
                                        <img src={BASE_URL + m.f} className="h-full object-contain" />
                                    </div>
                                    <div className="p-5 text-center bg-white/5 border-t border-[#D4AF37]/10">
                                        <div className="text-[#D4AF37] font-black text-xs mb-4">{m.t}</div>
                                        <button className="w-full btn-material">ACESSAR</button>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
