<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIZÚ MILITAR FÊNIX - PLATAFORMA DE ELITE</title>

    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        :root { 
            --preto-operacional: #050505; 
            --verde-vibrante: #83E509; 
            --verde-musgo: #1a2f23;
            --dourado: #D4AF37; 
        }
        body { background-color: var(--preto-operacional); color: white; margin: 0; font-family: 'Segoe UI', sans-serif; overflow-x: hidden; }
        
        /* Scrollbar Estilizada */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0a0a0a; }
        ::-webkit-scrollbar-thumb { background: var(--verde-vibrante); border-radius: 10px; }

        .btn-ouro { background: var(--dourado); color: black; font-weight: 900; transition: 0.3s; cursor: pointer; border: none; }
        .btn-ouro:hover { transform: scale(1.05); box-shadow: 0 0 20px rgba(212, 175, 55, 0.4); }
        
        .motion-header { height: 60px; width: 60px; object-fit: cover; border-radius: 50%; border: 2px solid var(--verde-vibrante); }
        
        .card-menu {
            background: linear-gradient(145deg, #0f172a, #050505);
            border: 1px solid rgba(131, 229, 9, 0.2);
            transition: 0.3s;
        }
        .card-menu:hover { border-color: var(--verde-vibrante); transform: translateY(-5px); }

        .top-pelotao {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 20px;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const BASE_URL = "https://ivespe-cpu.github.io/bizu-militar-fenix";

        // --- BANCO DE DADOS RESTAURADO ---
        const REPOSITORIO_PDFS = [
            "edital2020cn.pdf", "edital2021cn.pdf", "edital2022cn.pdf", "edital2023cn.pdf",
            "edital_cmrj.pdf", "gabarito2023cn.pdf", "gabarito2024cn.pdf", "gabarito2025cn.pdf",
            "gabarito_2025cn.pdf", "prova2023cn_Port_Ciencias.pdf", "prova2023cn_mat_ingles.pdf",
            "prova2024cn_Port_Ciencias.pdf", "prova2024cn_mat_ingles.pdf", "prova2025cn_Port_Cienc2.pdf",
            "prova2025cn_Port_Ciencias.pdf", "prova2025cn_mat_ingles.pdf", "manual_cmrj.pdf", "informativo_fenix.pdf"
        ];

        const CONFIG_ESCOLAS = {
            "COLÉGIO NAVAL": { slug: "cn", materias: ["MATEMÁTICA", "PORTUGUÊS", "INGLÊS", "HISTÓRIA", "GEOGRAFIA", "FÍSICA", "QUÍMICA", "BIOLOGIA"] },
            "EPCAR": { slug: "epcar", materias: ["MATEMÁTICA", "PORTUGUÊS", "INGLÊS"] },
            "CMRJ": { slug: "cmrj", materias: ["MATEMÁTICA", "PORTUGUÊS"] },
            "EsPCEX": { slug: "espcex", materias: ["MATEMÁTICA", "PORTUGUÊS", "INGLÊS", "HISTÓRIA", "GEOGRAFIA", "FÍSICA", "QUÍMICA"] },
            "EEAR": { slug: "eear1", materias: ["MATEMÁTICA", "PORTUGUÊS", "INGLÊS", "FÍSICA"] },
            "ESA": { slug: "esa", materias: ["MATEMÁTICA", "PORTUGUÊS", "INGLÊS", "HISTÓRIA", "GEOGRAFIA"] }
        };

        const ALUNOS_DB = [
            { m: "ags186", p: "SG. GASPARELLO", pts: 1500 }, { m: "gfa109", p: "SUB.TEN. ARAUJO", pts: 1900 },
            { m: "jpj110", p: "ASP. JOÃO SAMUEL", pts: 2000 }, { m: "jgm108", p: "SUB.TEN. MORAES", pts: 1950 },
            { m: "st.paulo", p: "SUB.TEN. PAULO", pts: 1910 }, { m: "sg.costa", p: "SG. COSTA", pts: 1800 },
            { m: "sg.pecanha", p: "SG. PEÇANHA", pts: 1750 }, { m: "sg.victor", p: "SG. VICTOR HUGO", pts: 1650 },
            { m: "sg.moura", p: "SG. MOURA", pts: 1400 } // Adicionado conforme o print
        ].sort((a,b) => b.pts - a.pts);

        const VIDEOS_DB = [
            { t: "MARINHA DO BRASIL", id: "zSSp5CQpg10" },
            { t: "MOTIVACIONAL ELITE", id: "Nc3WusSAIQI" },
            { t: "ESTRATÉGIA DE COMBATE", id: "dQw4w9WgXcQ" }
        ];

        const FRASES = ["Grandes batalhas só são dadas a grandes guerreiros.", "A limitação está apenas na sua mente."];

        // --- COMPONENTES ---
        const HeaderPadrao = ({ titulo, subTitulo, acaoBotao, textoBotao }) => (
            <header className="bg-[#0f172a] border-b-4 border-[#1a2f23] p-4 flex justify-between items-center sticky top-0 z-50">
                <div className="flex items-center gap-4">
                    <video className="motion-header" autoPlay loop muted playsInline>
                        <source src={`${BASE_URL}/video/logo_esquadrao.mp4`} type="video/mp4" />
                    </video>
                    <div className="hidden sm:block">
                        <h1 className="text-[#83E509] font-black italic uppercase text-lg leading-none">ESQUADRÃO FÊNIX</h1>
                        <p className="text-[10px] text-[#D4AF37] font-bold tracking-widest uppercase">Prontos para o Combate</p>
                    </div>
                </div>
                <div className="text-center">
                    <h2 className="text-[#D4AF37] font-black italic uppercase text-xs sm:text-sm">{titulo}</h2>
                    {subTitulo && <p className="text-[9px] text-white/40 font-bold uppercase">{subTitulo}</p>}
                </div>
                <button onClick={acaoBotao} className="text-red-500 font-black border border-red-500/30 px-4 py-1 rounded text-xs hover:bg-red-500 hover:text-white transition-all">
                    {textoBotao}
                </button>
            </header>
        );

        function App() {
            const [status, setStatus] = useState('login');
            const [user, setUser] = useState(null);
            const [matricula, setMatricula] = useState('');
            const [escolaSel, setEscolaSel] = useState(null);
            const [tipoDoc, setTipoDoc] = useState('');
            const [pdfAtivo, setPdfAtivo] = useState(null);

            const formatar = (t) => t.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\s+/g, "_");

            const handleLogin = (e) => {
                if(e) e.preventDefault();
                const m = matricula.toLowerCase().trim();
                const aluno = ALUNOS_DB.find(a => a.m === m);
                if (m === 'esp0815' || m === 'militar') {
                    setUser({ p: m === 'militar' ? "INSTRUTOR" : "COMANDANTE IVESPE" });
                    setStatus('qg');
                } else if (aluno) {
                    setUser(aluno);
                    setStatus('qg');
                } else {
                    alert("MATRÍCULA NÃO ENCONTRADA!");
                }
            };

            if (status === 'login') return (
                <div className="min-h-screen flex items-center justify-center bg-black p-4">
                    <div className="max-w-md w-full text-center">
                        <video className="w-32 h-32 mx-auto rounded-full mb-8 border-2 border-[#D4AF37]" autoPlay loop muted playsInline>
                            <source src={`${BASE_URL}/video/logo_bizu2.mp4`} type="video/mp4" />
                        </video>
                        <form onSubmit={handleLogin} className="space-y-4">
                            <input type="text" value={matricula} onChange={(e) => setMatricula(e.target.value)}
                                className="w-full p-4 bg-white/5 border border-white/10 rounded-2xl text-white text-center text-xl outline-none focus:border-[#D4AF37]" 
                                placeholder="DIGITE SUA MATRÍCULA" />
                            <button type="submit" className="w-full py-4 rounded-2xl btn-ouro uppercase tracking-widest">Autenticar Acesso</button>
                        </form>
                    </div>
                </div>
            );

            if (status === 'qg') return (
                <div className="min-h-screen">
                    <HeaderPadrao titulo={`BEM-VINDO(A) GUERREIRO(A) ${user?.p}!`} acaoBotao={() => setStatus('login')} textoBotao="SAIR" />
                    <div className="bg-[#1a2f23] py-2 text-center border-y border-[#83E509]/20">
                        <p className="text-[#83E509] italic text-xs animate-pulse">{FRASES[0]}</p>
                    </div>
                    
                    <main className="p-6 max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-4 gap-8">
                        {/* Grade de Escolas */}
                        <div className="lg:col-span-3 grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
                            {Object.entries(CONFIG_ESCOLAS).map(([nome, d]) => (
                                <button key={nome} onClick={() => { setEscolaSel(nome); setStatus('menu_escola'); }}
                                    className="relative h-48 rounded-3xl overflow-hidden group border border-white/10 hover:border-[#83E509] transition-all shadow-2xl">
                                    <div className="absolute inset-0 bg-center bg-cover" style={{ backgroundImage: `url(${BASE_URL}/jpg/${d.slug}.jpg)` }}>
                                        <div className="absolute inset-0 bg-black/60 group-hover:bg-black/30 transition-all"></div>
                                    </div>
                                    <span className="relative z-10 text-xl font-black italic text-[#D4AF37] uppercase">{nome}</span>
                                </button>
                            ))}
                        </div>

                        {/* Ranking Sidebar (Restaurado!) */}
                        <aside className="top-pelotao p-6 flex flex-col h-[500px]">
                            <h3 className="text-[#83E509] font-black text-center mb-6 border-b border-white/10 pb-2 uppercase tracking-tighter">Top Pelotão</h3>
                            <div className="flex-1 overflow-y-auto space-y-3 pr-2">
                                {ALUNOS_DB.map((aluno, i) => (
                                    <div key={i} className={`flex justify-between items-center p-2 rounded-lg border-b border-white/5 ${i === 0 ? 'text-[#D4AF37]' : 'text-gray-400'}`}>
                                        <span className="text-[10px] font-bold uppercase">{i+1}º {aluno.p}</span>
                                        <span className="text-[10px] font-black">{aluno.pts} PTS</span>
                                    </div>
                                ))}
                            </div>
                        </aside>
                    </main>
                </div>
            );

            if (status === 'menu_escola') return (
                <div className="min-h-screen">
                    <HeaderPadrao titulo={escolaSel} subTitulo="SELECIONE O MÓDULO DE TREINAMENTO" acaoBotao={() => setStatus('qg')} textoBotao="VOLTAR AO QG" />
                    
                    <main className="max-w-6xl mx-auto p-12">
                        {/* Ferramentas Rápidas */}
                        <div className="flex flex-wrap justify-center gap-4 mb-16">
                            <button onClick={() => { setTipoDoc('EDITAL'); setStatus('documentos'); }} className="px-8 py-3 bg-yellow-600/10 border border-yellow-500/50 text-yellow-500 rounded-xl font-black hover:bg-yellow-500 hover:text-black transition-all">📜 EDITAIS</button>
                            <button onClick={() => { setTipoDoc('PROVA'); setStatus('documentos'); }} className="px-8 py-3 bg-green-600/10 border border-green-500/50 text-green-500 rounded-xl font-black hover:bg-green-500 hover:text-black transition-all">📝 PROVAS</button>
                            <button onClick={() => { setTipoDoc('GABARITO'); setStatus('documentos'); }} className="px-8 py-3 bg-blue-600/10 border border-blue-500/50 text-blue-500 rounded-xl font-black hover:bg-blue-500 hover:text-black transition-all">✅ GABARITOS</button>
                        </div>

                        {/* Cards Principais (CINE FÊNIX RESTAURADO!) */}
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-8">
                            <button onClick={() => alert("Simulados em manutenção")} className="card-menu p-10 rounded-3xl text-center">
                                <span className="block text-4xl mb-4">📝</span>
                                <span className="block text-[#83E509] font-black uppercase text-sm">Simulados Interativos</span>
                            </button>
                            <button onClick={() => setStatus('materiais')} className="card-menu p-10 rounded-3xl text-center">
                                <span className="block text-4xl mb-4">📚</span>
                                <span className="block text-[#D4AF37] font-black uppercase text-sm">Biblioteca de Apostilas</span>
                            </button>
                            <button onClick={() => setStatus('videos')} className="card-menu p-10 rounded-3xl text-center">
                                <span className="block text-4xl mb-4">🎬</span>
                                <span className="block text-white font-black uppercase text-sm">Cine Fênix (Vídeos)</span>
                            </button>
                        </div>
                    </main>
                </div>
            );

            if (status === 'documentos') {
                const slug = CONFIG_ESCOLAS[escolaSel].slug.replace('1', '').toLowerCase();
                const lista = REPOSITORIO_PDFS.filter(arq => arq.toLowerCase().includes(tipoDoc.toLowerCase()) && arq.toLowerCase().includes(slug));
                return (
                    <div className="min-h-screen">
                        <HeaderPadrao titulo={`${tipoDoc}S: ${escolaSel}`} acaoBotao={() => setStatus('menu_escola')} textoBotao="RECUAR" />
                        <main className="max-w-4xl mx-auto p-6 space-y-4">
                            {lista.length > 0 ? lista.map((arq, i) => (
                                <div key={i} className="flex justify-between items-center p-5 bg-white/5 border-l-4 border-[#D4AF37] rounded-xl hover:bg-white/10 transition-all">
                                    <span className="text-xs font-black uppercase tracking-wider">{arq.replace('.pdf', '').replace(/_/g, ' ')}</span>
                                    <button onClick={() => setPdfAtivo({ url: arq, nome: arq.toUpperCase() })} className="btn-ouro px-8 py-2 rounded-lg text-[10px]">ABRIR</button>
                                </div>
                            )) : <p className="text-center text-white/20 py-20 font-bold uppercase italic">Nenhum arquivo encontrado no repositório.</p>}
                        </main>
                        {pdfAtivo && (
                            <div className="fixed inset-0 z-[100] bg-black flex flex-col p-2 sm:p-4">
                                <div className="flex justify-between items-center p-4 bg-[#0a0a0a] border border-white/10 rounded-t-2xl">
                                    <h2 className="text-[#D4AF37] font-black text-xs uppercase">{pdfAtivo.nome}</h2>
                                    <button onClick={() => setPdfAtivo(null)} className="bg-red-600 text-white px-6 py-1 rounded-full font-black text-xs">FECHAR</button>
                                </div>
                                <iframe src={`https://docs.google.com/viewer?url=${encodeURIComponent(BASE_URL + "/pdf/" + pdfAtivo.url)}&embedded=true`} className="flex-1 w-full rounded-b-2xl bg-white" />
                            </div>
                        )}
                    </div>
                );
            }

            if (status === 'materiais') return (
                <div className="min-h-screen text-center">
                    <HeaderPadrao titulo={`BIBLIOTECA: ${escolaSel}`} acaoBotao={() => setStatus('menu_escola')} textoBotao="VOLTAR" />
                    <main className="p-8 max-w-7xl mx-auto grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8">
                        {CONFIG_ESCOLAS[escolaSel].materias.map((m) => {
                            const fileName = `card_${formatar(m)}_${CONFIG_ESCOLAS[escolaSel].slug.replace('1','')}.png`;
                            const pdfName = `${formatar(m)}_${CONFIG_ESCOLAS[escolaSel].slug.replace('1','')}.pdf`;
                            return (
                                <div key={m} className="bg-[#0f172a] border border-white/5 rounded-3xl overflow-hidden p-6 hover:border-[#83E509] transition-all flex flex-col">
                                    <div className="h-44 bg-black/40 rounded-2xl mb-4 flex items-center justify-center overflow-hidden">
                                        <img 
                                            src={`${BASE_URL}/png/${fileName}`} 
                                            className="w-full h-full object-contain" 
                                            onError={(e) => { e.target.src = "https://via.placeholder.com/300x450/0f172a/83E509?text=PDF"; }}
                                        />
                                    </div>
                                    <h3 className="font-black text-[10px] mb-4 text-gray-300 uppercase h-8 flex items-center justify-center">{m}</h3>
                                    <button onClick={() => window.open(`${BASE_URL}/pdf/${pdfName}`)} className="w-full bg-[#83E509] text-black font-black py-3 rounded-xl text-[10px] uppercase shadow-lg shadow-green-900/20">Abrir Material</button>
                                </div>
                            );
                        })}
                    </main>
                </div>
            );

            if (status === 'videos') return (
                <div className="min-h-screen">
                    <HeaderPadrao titulo="CINE FÊNIX - SALA DE VÍDEO" acaoBotao={() => setStatus('menu_escola')} textoBotao="RECUAR" />
                    <main className="p-8 max-w-6xl mx-auto grid grid-cols-1 md:grid-cols-2 gap-8">
                        {VIDEOS_DB.map((v, i) => (
                            <div key={i} className="bg-[#0f172a] rounded-3xl overflow-hidden border border-white/10 group hover:border-[#D4AF37]">
                                <div className="relative pt-[56.25%]">
                                    <iframe className="absolute inset-0 w-full h-full" src={`https://www.youtube.com/embed/${v.id}`} frameBorder="0" allowFullScreen></iframe>
                                </div>
                                <div className="p-4 bg-black/40 text-center">
                                    <span className="font-black text-[#D4AF37] italic text-xs uppercase">{v.t}</span>
                                </div>
                            </div>
                        ))}
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
