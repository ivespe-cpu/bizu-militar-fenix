<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIZÚ MILITAR FÊNIX - SISTEMA ELITE</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --azul-marinho: #001233; --dourado-ouro: #D4AF37; --vermelho-tatico: #bc0000; }
        body { background-color: var(--azul-marinho); color: white; margin: 0; font-family: 'Segoe UI', sans-serif; }
        .militar-gradient { background: linear-gradient(135deg, #001233 0%, #000814 100%); }
        .linha-vermelha { height: 4px; background: repeating-linear-gradient(45deg, var(--vermelho-tatico), var(--vermelho-tatico) 10px, #7b0000 10px, #7b0000 20px); width: 100%; }
        .btn-combate { background: var(--dourado-ouro) !important; color: black !important; font-weight: 900; padding: 1.2rem; border-radius: 0.5rem; transition: 0.3s; width: 100%; text-transform: uppercase; cursor: pointer; border: none; box-shadow: 0 0 15px rgba(212, 175, 55, 0.4); }
        .btn-combate:hover { transform: scale(1.02); background: white !important; }
        .card-escola { position: relative; height: 160px; border-radius: 12px; border-bottom: 4px solid var(--dourado-ouro); overflow: hidden; display: flex; items: center; justify-content: center; background-size: cover; background-position: center; transition: 0.4s; cursor: pointer; border: 1px solid rgba(212, 175, 55, 0.2); width: 100%; }
        .card-escola::before { content: ""; position: absolute; inset: 0; background: rgba(0, 18, 51, 0.7); }
        .sigla-txt { position: relative; z-index: 10; font-size: 2.2rem; font-weight: 900; color: var(--dourado-ouro); font-style: italic; text-shadow: 2px 2px 8px black; }
        /* Ranking com Scroll para os 42 alunos */
        .ranking-area { max-height: 400px; overflow-y: auto; padding-right: 10px; }
        .ranking-area::-webkit-scrollbar { width: 4px; }
        .ranking-area::-webkit-scrollbar-thumb { background: var(--dourado-ouro); border-radius: 10px; }
        .modal-overlay { background: rgba(0,0,0,0.95); position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .doc-link { background: rgba(255,255,255,0.05); border: 1px solid rgba(212, 175, 55, 0.3); padding: 12px; border-radius: 8px; width: 100%; text-align: left; font-weight: bold; margin-bottom: 8px; display: block; color: white; cursor: pointer; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        const LOGO_IMG = "https://i.ibb.co/BKLSQKT1/logo-bizu.jpg";
        const LOGO_FENIX = "https://i.ibb.co/Q31w6PLJ/logo-esquadrao.jpg";
        const BASE_GITHUB = "https://raw.githubusercontent.com/ivespe-cpu/bizufenix/main/";

        const ALUNOS_DB = [
            { m: "ags186", p: "SG.GASPARELLO", pts: 1500 }, { m: "alm170", p: "SG. MOURA", pts: 1450 },
            { m: "bsp223", p: "SD. PINHEIRO", pts: 1200 }, { m: "bab196", p: "CB. BRAYAN", pts: 1100 },
            { m: "bbs203", p: "SD. BERNARDO", pts: 900 }, { m: "cvs208", p: "CB. CAMILA", pts: 1050 },
            { m: "dva194", p: "CB. ALBUQUERQUE", pts: 1300 }, { m: "esp192", p: "SG. PEIXOTO", pts: 1250 },
            { m: "egc228", p: "CB. ENZO", pts: 850 }, { m: "gsp187", p: "SG. GABRIELLE PEREIRA", pts: 1400 },
            { m: "gac174", p: "SG. GABRIELLY COUTINHO", pts: 1350 }, { m: "gem240", p: "SD.MICAELA", pts: 950 },
            { m: "gfa109", p: "SUB.TEN. ARAUJO", pts: 1900 }, { m: "hls197", p: "CB. SALES", pts: 1150 },
            { m: "icg127", p: "SG. GRANADO", pts: 1600 }, { m: "iws159", p: "SG. LIMA", pts: 1550 },
            { m: "jgm108", p: "SUB.TEN. MORAES", pts: 1950 }, { m: "jpj110", p: "ASP. JOÃO SAMUEL", pts: 2000 },
            { m: "jva190", p: "SG. ANDRADE", pts: 1480 }, { m: "jhs198", p: "CB. JOSUÉ", pts: 1120 },
            { m: "jcm166", p: "SG. JUNIO", pts: 1420 }, { m: "kfs245", p: "CB. FONTES", pts: 1080 },
            { m: "lgb226", p: "CB. BELTRON", pts: 1190 }, { m: "lod225", p: "CB. FADINI", pts: 1170 },
            { m: "lse165", p: "SG. ELEUTHÉRIO", pts: 1510 }, { m: "lfs220", p: "CB. LUIZ FERNANDO", pts: 1030 },
            { m: "lmc184", p: "SG. COSTA", pts: 1800 }, { m: "mps144", p: "SG. PEÇANHA", pts: 1750 },
            { m: "mis133", p: "SG. IRENO", pts: 1320 }, { m: "nmp214", p: "CB. NATHAN", pts: 800 },
            { m: "nab161", p: "SG. NICOLLAS ARTHUR", pts: 1580 }, { m: "nvo148", p: "SG. NICOLY VICTORIA", pts: 1570 },
            { m: "php105", p: "SUB.TEN. PAULO", pts: 1910 }, { m: "pha219", p: "CB. PEDRO HENRIQUE", pts: 1180 },
            { m: "pho188", p: "SG. DE PAULA", pts: 1410 }, { m: "phm185", p: "SG. PEDRO RIBEIRO", pts: 1430 },
            { m: "phc232", p: "SD. PIETRO", pts: 920 }, { m: "rsb130", p: "SG. BARBOSA", pts: 1620 },
            { m: "scg216", p: "SD. SAMANTHA", pts: 940 }, { m: "tvo212", p: "SG. THAYANE", pts: 1390 },
            { m: "tgs164", p: "SG. GARCIA", pts: 1470 }, { m: "vho129", p: "SG. VICTOR HUGO", pts: 1650 }
        ];

        function App() {
            const [status, setStatus] = useState('login');
            const [alunoLogado, setAlunoLogado] = useState(null);
            const [matricula, setMatricula] = useState('');
            const [senha, setSenha] = useState('');
            const [modal, setModal] = useState(null);

            const login = () => {
                const encontrado = ALUNOS_DB.find(a => a.m === matricula.toLowerCase());
                if(encontrado && senha === 'fenix123') {
                    setAlunoLogado(encontrado);
                    setStatus('qg');
                } else {
                    alert("Acesso Negado! Verifique seus dados.");
                }
            };

            if (status === 'login') return (
                <div className="min-h-screen flex items-center justify-center p-6 militar-gradient">
                    <div className="max-w-md w-full bg-black/80 p-10 rounded-2xl border-2 border-ouro/50 shadow-2xl text-center">
                        <img src={LOGO_IMG} className="h-32 mx-auto mb-6 rounded-lg shadow-ouro" />
                        <div className="linha-vermelha mb-8"></div>
                        <div className="space-y-4 text-left">
                            <div>
                                <label className="text-[10px] font-black text-ouro uppercase tracking-widest block mb-2">Matrícula</label>
                                <input value={matricula} onChange={e => setMatricula(e.target.value)} type="text" placeholder="Ex: gfa109" className="w-full p-4 bg-white/5 border border-ouro/20 rounded text-white outline-none focus:border-ouro" />
                            </div>
                            <div>
                                <label className="text-[10px] font-black text-ouro uppercase tracking-widest block mb-2">Senha Operacional</label>
                                <input value={senha} onChange={e => setSenha(e.target.value)} type="password" placeholder="******" className="w-full p-4 bg-white/5 border border-ouro/20 rounded text-white outline-none focus:border-ouro" />
                            </div>
                            <button onClick={login} className="btn-combate mt-4">Entrar no Combate</button>
                        </div>
                    </div>
                </div>
            );

            return (
                <div className="min-h-screen militar-gradient">
                    <header className="bg-black border-b-2 border-ouro p-6 flex items-center justify-between px-10 sticky top-0 z-50">
                        <img src={LOGO_FENIX} className="h-10 rounded" />
                        <div className="text-center">
                            <h2 className="text-xl font-black text-ouro italic uppercase">Olá, {alunoLogado?.p}</h2>
                            <p className="text-[10px] font-bold text-white/40 tracking-widest">VOCÊ POSSUI {alunoLogado?.pts} PONTOS DE MÉRITO</p>
                        </div>
                        <button onClick={() => setStatus('login')} className="text-red-500 font-bold text-xs border border-red-500/30 px-3 py-1 rounded">SAIR</button>
                    </header>
                    
                    <main className="max-w-6xl mx-auto p-8">
                        {/* UNIDADES MILITARES */}
                        <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-4 mb-12">
                            {['CN', 'CMRJ', 'EEAR', 'EsPCEx', 'ESA', 'EXTRAS'].map(s => (
                                <button key={s} onClick={() => s === 'CN' ? setModal('cn_opcoes') : alert('Unidade em mobilização')} className="card-escola h-24">
                                    <span className="sigla-txt text-xl">{s}</span>
                                </button>
                            ))}
                        </div>

                        {/* RANKING COMPLETO DO EFETIVO */}
                        <div className="bg-black/40 border border-ouro/30 rounded-xl p-6">
                            <h3 className="text-ouro font-black italic mb-6">🏆 RANKING GERAL DO EFETIVO (ORDEM DE MÉRITO)</h3>
                            <div className="ranking-area space-y-2">
                                {ALUNOS_DB.sort((a,b) => b.pts - a.pts).map((al, i) => (
                                    <div key={al.m} className={`flex justify-between items-center p-3 rounded border-l-4 ${al.m === alunoLogado?.m ? 'bg-ouro/20 border-white' : 'bg-white/5 border-ouro/40'}`}>
                                        <div className="flex items-center gap-4">
                                            <span className="text-xs font-black opacity-40">#{i+1}</span>
                                            <span className="font-bold text-sm">{al.p}</span>
                                        </div>
                                        <span className="text-ouro font-black">{al.pts} PTS</span>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </main>

                    {/* MODAL DE OPÇÕES CN */}
                    {modal === 'cn_opcoes' && (
                        <div className="modal-overlay" onClick={() => setModal(null)}>
                            <div className="bg-[#001233] border-2 border-ouro p-8 rounded-2xl max-w-lg w-full" onClick={e => e.stopPropagation()}>
                                <h3 className="text-ouro font-black text-2xl mb-8 italic text-center">COLÉGIO NAVAL - ARSENAL</h3>
                                <div className="space-y-4">
                                    <button onClick={() => window.open(BASE_GITHUB+'gabarito2025CN.pdf')} className="doc-link">✅ GABARITO 2025 (ÚLTIMO)</button>
                                    <button onClick={() => window.open(BASE_GITHUB+'prova2025CN-mat-ingles.pdf')} className="doc-link">📝 PROVA 2025 - MAT/ING</button>
                                    <button onClick={() => alert('Lista completa em Editais')} className="doc-link">📄 ACESSAR EDITAIS ANTERIORES</button>
                                </div>
                                <button onClick={() => setModal(null)} className="mt-8 w-full py-3 text-red-500 font-bold border border-red-500/20 rounded">FECHAR</button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
