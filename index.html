<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIZÚ MILITAR FÊNIX - PLATAFORMA DE ELITE</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --azul-marinho: #001233; --dourado-ouro: #D4AF37; --vermelho-tatico: #bc0000; }
        body { background-color: var(--azul-marinho); color: white; margin: 0; font-family: 'Segoe UI', sans-serif; }
        .militar-gradient { background: linear-gradient(135deg, #001233 0%, #000814 100%); }
        .linha-vermelha { height: 4px; background: repeating-linear-gradient(45deg, var(--vermelho-tatico), var(--vermelho-tatico) 10px, #7b0000 10px, #7b0000 20px); width: 100%; }
        .btn-combate { background-color: var(--dourado-ouro) !important; color: black !important; font-weight: 900; padding: 1.2rem; border-radius: 0.5rem; box-shadow: 0 0 20px rgba(212, 175, 55, 0.4); transition: 0.3s; width: 100%; text-transform: uppercase; }
        .card-escola { position: relative; height: 160px; border-radius: 12px; border-bottom: 4px solid var(--dourado-ouro); overflow: hidden; display: flex; align-items: center; justify-content: center; background-size: cover; background-position: center; transition: 0.4s; cursor: pointer; border: 1px solid rgba(212, 175, 55, 0.2); }
        .card-escola::before { content: ""; position: absolute; inset: 0; background: rgba(0, 18, 51, 0.7); }
        .sigla-txt { position: relative; z-index: 10; font-size: 2.2rem; font-weight: 900; color: var(--dourado-ouro); font-style: italic; text-shadow: 2px 2px 8px black; }
        /* Ajuste para capas não cortarem */
        .capa-doc { width: 100%; height: 280px; object-fit: contain; background: #000; border-bottom: 1px solid var(--dourado-ouro); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        const ALUNOS_DB = [
            { m: "ags186", p: "SG. GASPARELLO", pts: 1500 }, { m: "alm170", p: "SG. MOURA", pts: 1450 },
            { m: "bsp223", p: "SD. PINHEIRO", pts: 1200 }, { m: "bab196", p: "CB. BRAYAN", pts: 1100 },
            { m: "bbs203", p: "SD. BERNARDO", pts: 900 }, { m: "cvs208", p: "CB. CAMILA", pts: 1050 },
            { m: "dva194", p: "CB. ALBUQUERQUE", pts: 1300 }, { m: "esp192", p: "SG. PEIXOTO", pts: 1250 },
            { m: "egc228", p: "CB. ENZO", pts: 850 }, { m: "gsp187", p: "SG. GABRIELLE PEREIRA", pts: 1400 },
            { m: "gac174", p: "SG. GABRIELLY COUTINHO", pts: 1350 }, { m: "gem240", p: "SD. MICAELA", pts: 950 },
            { m: "gfa109", p: "SUB.TEN. ARAUJO", pts: 1900 }, { m: "hls197", p: "CB. SALES", pts: 1150 },
            { m: "icg127", p: "SG. GRANADO", pts: 1600 }, { m: "iws159", p: "SG. LIMA", pts: 1550 },
            { m: "jgm108", p: "SUB.TEN. MORAES", pts: 1950 }, { m: "jpj110", p: "ASP. JOÃO SAMUEL", pts: 2000 },
            { m: "jva190", p: "SG. ANDRADE", pts: 1480 }, { m: "jhs198", p: "CB. JOSUÉ", pts: 1120 },
            { m: "jcm166", p: "SG. JUNIO", pts: 1420 }, { m: "kfs245", p: "CB. FONTES", pts: 1080 },
            { m: "lgb226", p: "CB. BELTRON", pts: 1190 }, { m: "lod225", p: "CB. FADINI", pts: 1170 },
            { m: "lse165", p: "SG. ELEUTHÉRIO", pts: 1510 }, { m: "lfs220", p: "CB. LUIZ FERNANDO", pts: 1030 },
            { m: "lmc184", p: "SG. COSTA", pts: 1800 }, { m: "mps144", p: "SG. PEÇANHA", pts: 1750 },
            { m: "mis133", p: "SG. IRENO", pts: 1320 }
        ];

        function App() {
            const [status, setStatus] = useState('login'); 
            const [user, setUser] = useState(null);
            const [senhaIn, setSenhaIn] = useState('');
            const [escolaSel, setEscolaSel] = useState('');

            const handleLogin = (e) => {
                e.preventDefault();
                const s = senhaIn.toLowerCase().trim();
                if (s === "esp0815" || s === "admin") {
                    setUser({ p: "COMANDANTE", n: "EUFRÁSIO" });
                    setStatus('qg');
                } else {
                    const aluno = ALUNOS_DB.find(a => a.m === s);
                    if (aluno) { setUser(aluno); setStatus('qg'); }
                    else { alert("ACESSO NEGADO!"); }
                }
            };

            if (status === 'login') {
                return (
                    <div className="min-h-screen flex items-center justify-center p-6 militar-gradient text-center">
                        <div className="max-w-md w-full bg-black/80 p-10 rounded-2xl border-2 border-ouro/30 shadow-2xl">
                            <img src="https://i.ibb.co/BKLSQKT1/logo-bizu.jpg" className="w-full mb-6 rounded-lg" />
                            <div className="linha-vermelha mb-8"></div>
                            <form onSubmit={handleLogin} className="flex flex-col gap-4">
                                <label className="text-[10px] font-black text-ouro uppercase tracking-widest text-left">Insira sua Senha de Acesso</label>
                                <input type="password" value={senhaIn} onChange={(e) => setSenhaIn(e.target.value)}
                                       className="p-4 bg-white/5 border border-ouro/20 rounded text-white outline-none focus:border-ouro text-center text-xl" placeholder="****" />
                                <button type="submit" className="btn-combate mt-2">ENTRAR NO QG</button>
                            </form>
                        </div>
                    </div>
                );
            }

            if (status === 'qg') {
                const ranking = [...ALUNOS_DB].sort((a, b) => b.pts - a.pts);
                return (
                    <div className="min-h-screen">
                        <header className="bg-[#000814] border-b-2 border-ouro p-6 flex items-center justify-between px-10">
                            <img src="https://i.ibb.co/Q31w6PLJ/logo-esquadrao.jpg" className="h-16 rounded" />
                            <h2 className="text-2xl font-black text-ouro italic uppercase">Olá, {user.p}</h2>
                            <button onClick={() => setStatus('login')} className="text-red-500 font-black text-xs border border-red-500/30 px-3 py-1 rounded">SAIR</button>
                        </header>
                        <main className="max-w-7xl mx-auto p-10 grid grid-cols-1 lg:grid-cols-3 gap-10">
                            <div className="lg:col-span-2 grid grid-cols-1 md:grid-cols-2 gap-4">
                                {[{s:'CN', i:'https://images.unsplash.com/photo-1590490360182-c33d57733427?w=500'}, {s:'CMRJ', i:'https://upload.wikimedia.org/wikipedia/commons/thumb/5/5a/Col%C3%A9gio_Militar_do_Rio_de_Janeiro.jpg/500px-Col%C3%A9gio_Militar_do_Rio_de_Janeiro.jpg'}, {s:'EEAR', i:'https://www2.fab.mil.br/eear/images/noticias/2023/06_JUNHO/23_eear/DSC_0137.jpg'}, {s:'ESA', i:'https://www.eb.mil.br/documents/10138/10321350/ESA1.jpg/87029671-3310-85f2-9333-e18e3c509618?t=1559235002737'}].map(item => (
                                    <div key={item.s} onClick={() => {setEscolaSel(item.s); setStatus('escola');}} className="card-escola" style={{backgroundImage: `url(${item.i})`}}>
                                        <span className="sigla-txt">{item.s}</span>
                                    </div>
                                ))}
                            </div>
                            <div className="bg-black/40 p-6 rounded-xl border border-ouro/20 shadow-2xl">
                                <h3 className="text-ouro font-black mb-6 text-center uppercase italic">🏆 Ranking do Pelotão</h3>
                                <div className="space-y-3">
                                    {ranking.slice(0, 8).map((aluno, idx) => (
                                        <div key={idx} className="flex justify-between p-2 bg-white/5 rounded border-l-2 border-ouro text-[11px]">
                                            <span>{idx+1}º {aluno.p}</span>
                                            <span className="text-ouro">{aluno.pts} pts</span>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </main>
                    </div>
                );
            }

            return (
                <div className="min-h-screen militar-gradient">
                    <header className="bg-[#000814] border-b-2 border-ouro p-6 flex justify-between items-center px-10">
                        <h1 className="text-xl font-black text-ouro uppercase">{escolaSel} | ARSENAL</h1>
                        <button onClick={() => setStatus('qg')} className="bg-ouro text-black px-6 py-2 rounded text-[10px] font-black hover:bg-white transition-all">VOLTAR AO QG</button>
                    </header>
                    <main className="max-w-7xl mx-auto p-10">
                        <div className="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-2 mb-10">
                            {['APOSTILAS', 'VÍDEOS', 'SIMULADOS', 'PROVAS', 'EDITAIS', 'GABARITOS'].map(m => (
                                <button key={m} className="bg-white/5 border border-ouro/20 p-2 rounded text-[9px] font-black hover:bg-ouro hover:text-black transition-all uppercase">{m}</button>
                            ))}
                        </div>
                        <div className="grid grid-cols-1 md:grid-cols-4 gap-6">
                            {['MATEMÁTICA', 'PORTUGUÊS', 'INGLÊS', 'HISTÓRIA'].map((m, i) => (
                                <div key={i} className="bg-black/40 border border-ouro/20 rounded-xl overflow-hidden hover:border-ouro transition-all">
                                    <div className="bg-slate-800 h-[280px] flex items-center justify-center text-ouro font-black italic">CAPA {m}</div>
                                    <div className="p-4 text-center text-[10px] font-black">{m}</div>
                                </div>
                            ))}
                        </div>
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
