<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIZÚ MILITAR FÊNIX - PLATAFORMA DE ELITE</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --azul-marinho: #050505; --dourado: #D4AF37; --laranja: #ea580c; }
        body { background-color: var(--azul-marinho); color: white; margin: 0; font-family: sans-serif; }
        .militar-gradient { background: radial-gradient(circle at top, #1e293b 0%, #050505 100%); min-height: 100vh; }
        .btn-ouro { background: var(--dourado); color: black; font-weight: 900; transition: 0.3s; }
        .btn-ouro:hover { transform: scale(1.05); box-shadow: 0 0 20px rgba(212, 175, 55, 0.4); }
        /* Brilho nos cards */
        .card-militar { border: 1px solid rgba(255,255,255,0.05); transition: 0.3s; background: #0f172a; }
        .card-militar:hover { border-color: var(--laranja); box-shadow: 0 0 20px rgba(234, 88, 12, 0.2); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;
        const BASE_URL = "https://ivespe-cpu.github.io/bizu-militar-fenix";

        const CONFIG_ESCOLAS = {
            "COLÉGIO NAVAL": { slug: "cn", materias: ["MATEMÁTICA", "PORTUGUÊS", "INGLÊS", "HISTÓRIA", "GEOGRAFIA", "FÍSICA", "QUÍMICA", "BIOLOGIA"] },
            "CMRJ": { slug: "cmrj", materias: ["MATEMÁTICA", "PORTUGUÊS"] },
            "EPCAR": { slug: "epcar", materias: ["MATEMÁTICA", "PORTUGUÊS", "INGLÊS"] },
            "EsPCEX": { slug: "espcex", materias: ["MATEMÁTICA", "PORTUGUÊS", "INGLÊS", "HISTÓRIA", "GEOGRAFIA", "FÍSICA", "QUÍMICA"] },
            "EEAR": { slug: "eear1", materias: ["MATEMÁTICA", "PORTUGUÊS", "INGLÊS", "FÍSICA"] },
            "ESA": { slug: "esa", materias: ["MATEMÁTICA", "PORTUGUÊS", "INGLÊS", "HISTÓRIA", "GEOGRAFIA"] }
        };

        const ALUNOS_DB = [
            { m: "ags186", p: "SG.GASPARELLO", pts: 1500 }, { m: "alm170", p: "SG. MOURA", pts: 1450 },
            { m: "bsp223", p: "SD. PINHEIRO", pts: 1200 }, { m: "bab196", p: "CB. BRAYAN", pts: 1100 },
            { m: "bbs203", p: "SD. BERNARDO", pts: 900 }, { m: "cvs208", p: "CB. CAMILA", pts: 1050 },
            { m: "dva194", p: "CB. ALBUQUERQUE", pts: 1300 }, { m: "esp192", p: "SG. PEIXOTO", pts: 1250 },
            { m: "egc228", p: "CB. ENZO", pts: 850 }, { m: "gsp187", p: "SG. GABRIELLE PEREIRA", pts: 1400 },
            { m: "gac174", p: "SG. GABRIELLY COUTINHO", pts: 1350 }, { m: "gem240", p: "SD.MICAELA", pts: 950 },
            { m: "gfa109", p: "SUB.TEN. ARAUJO", pts: 1900 }, { m: "hls197", p: "CB. SALES", pts: 1150 },
            { m: "icg127", p: "SG. GRANADO", pts: 1600 }, { m: "iws159", p: "SG. LIMA", pts: 1550 },
            { m: "jgm108", p: "SUB.TEN. MORAES", pts: 1950 }, { m: "jpj110", p: "ASP. JOÃO SAMUEL", pts: 2000 },
            { m: "jva190", p: "SG. ANDRADE", pts: 1480 }, { m: "jhs198", p: "CB. JOSUÉ", pts: 1120 },
            { m: "jcm166", p: "SG. JUNIO", pts: 1420 }, { m: "kfs245", p: "CB. FONTES", pts: 1080 },
            { m: "lgb226", p: "CB. BELTRON", pts: 1190 }, { m: "lod225", p: "CB. FADINI", pts: 1170 },
            { m: "lse165", p: "SG. ELEUTHÉRIO", pts: 1510 }, { m: "lfs220", p: "CB. LUIZ FERNANDO", pts: 1030 },
            { m: "lmc184", p: "SG. COSTA", pts: 1800 }, { m: "mps144", p: "SG. PEÇANHA", pts: 1750 },
            { m: "mis133", p: "SG. IRENO", pts: 1320 }, { m: "nmp214", p: "CB. NATHAN", pts: 800 },
            { m: "nab161", p: "SG. NICOLLAS ARTHUR", pts: 1580 }, { m: "nvo148", p: "SG. NICOLY VICTORIA", pts: 1570 },
            { m: "php105", p: "SUB.TEN. PAULO", pts: 1910 }, { m: "pha219", p: "CB. PEDRO HENRIQUE", pts: 1180 },
            { m: "pho188", p: "SG. DE PAULA", pts: 1410 }, { m: "phm185", p: "SG. PEDRO RIBEIRO", pts: 1430 },
            { m: "phc232", p: "SD. PIETRO", pts: 920 }, { m: "rsb130", p: "SG. BARBOSA", pts: 1620 },
            { m: "scg216", p: "SD. SAMANTHA", pts: 940 }, { m: "tvo212", p: "SG. THAYANE", pts: 1390 },
            { m: "tgs164", p: "SG. GARCIA", pts: 1470 }, { m: "vho129", p: "SG. VICTOR HUGO", pts: 1650 }
        ];

        function App() {
            const [status, setStatus] = useState('login'); 
            const [user, setUser] = useState(null);
            const [matricula, setMatricula] = useState('');
            const [escolaSel, setEscolaSel] = useState(null);

            const formatar = (t) => t.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\s+/g, "_");

            const handleLogin = (e) => {
                if(e) e.preventDefault();
                const m = matricula.toLowerCase().trim();
                const aluno = ALUNOS_DB.find(a => a.m === m);
                if (aluno) { setUser(aluno); setStatus('qg'); }
                else { alert("MATRÍCULA NÃO CADASTRADA!"); }
            };

            if (status === 'login') return (
                <div className="min-h-screen flex items-center justify-center p-4 militar-gradient">
                    <div className="max-w-md w-full bg-black/80 p-8 rounded-3xl border-2 border-orange-600/30 text-center">
                        <video className="w-full rounded-2xl mb-6 border border-orange-600/20 shadow-lg" autoPlay loop muted playsInline>
                            <source src={`${BASE_URL}/video/logo_bizu2.mp4`} type="video/mp4" />
                        </video>
                        <form onSubmit={handleLogin}>
                            <input type="text" value={matricula} onChange={(e) => setMatricula(e.target.value)}
                                className="w-full p-4 mb-4 bg-white/5 border border-white/10 rounded-xl text-white text-center text-xl outline-none focus:border-orange-500" 
                                placeholder="SUA MATRÍCULA" 
                            />
                            <button type="submit" className="w-full py-4 rounded-xl btn-ouro text-lg">ENTRAR NO QG</button>
                        </form>
                    </div>
                </div>
            );

            if (status === 'qg') return (
                <div className="min-h-screen">
                    <header className="bg-[#0f172a] border-b-4 border-orange-600 p-5 flex justify-between items-center shadow-2xl">
                        <h1 className="font-black italic text-xl text-orange-500">BIZÚ MILITAR FÊNIX</h1>
                        <div className="text-right">
                            <span className="text-xs font-bold block">{user?.p}</span>
                            <button onClick={() => setStatus('login')} className="text-red-500 text-[10px] font-black uppercase">Sair</button>
                        </div>
                    </header>
                    <main className="p-6 max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-4 gap-8">
                        <div className="lg:col-span-3 grid grid-cols-1 md:grid-cols-2 gap-6">
                            {Object.entries(CONFIG_ESCOLAS).map(([nome, d]) => (
                                <button key={nome} onClick={() => { setEscolaSel(nome); setStatus('materiais'); }}
                                    className="relative h-48 rounded-3xl overflow-hidden group border-2 border-white/5 hover:border-orange-600 transition-all"
                                >
                                    <div className="absolute inset-0 bg-center bg-cover" style={{ backgroundImage: `url(${BASE_URL}/jpg/${d.slug}.jpg)` }}>
                                        <div className="absolute inset-0 bg-black/60 group-hover:bg-black/30 transition-all"></div>
                                    </div>
                                    <span className="relative z-10 text-2xl font-black italic">{nome}</span>
                                </button>
                            ))}
                        </div>
                        <div className="bg-[#0f172a] rounded-3xl p-6 border border-white/5 shadow-xl h-fit">
                            <h3 className="text-orange-500 font-black text-center mb-4 uppercase text-sm">Ranking do Pelotão</h3>
                            {ALUNOS_DB.map((a, i) => (
                                <div key={i} className="flex justify-between p-2 text-[10px] border-b border-white/5 bg-white/5 mb-1 rounded">
                                    <span className="font-bold">{a.p}</span>
                                    <span className="text-orange-400 font-black">{a.pts}</span>
                                </div>
                            ))}
                        </div>
                    </main>
                </div>
            );

            if (status === 'materiais') {
                const escola = CONFIG_ESCOLAS[escolaSel];
                const slugLimpo = escola.slug.replace('1','');
                
                return (
                    <div className="min-h-screen">
                        <header className="bg-[#0f172a] border-b-4 border-orange-600 p-5 flex justify-between items-center">
                            <h1 className="font-black italic text-orange-500 uppercase">{escolaSel}</h1>
                            <button onClick={() => setStatus('qg')} className="bg-white text-black px-6 py-2 rounded-lg font-black text-xs hover:bg-orange-500">VOLTAR</button>
                        </header>
                        
                        {/* BOTÕES DE RECURSOS EXTRAS (BASEADO NO SEU PRINT) */}
                        <div className="flex flex-wrap justify-center gap-4 p-6 bg-black/30">
                            <button onClick={() => window.open(`${BASE_URL}/pdf/edital2023${slugLimpo}.pdf`)} className="bg-white/10 hover:bg-white/20 px-4 py-2 rounded-lg text-[10px] font-bold border border-white/20">📜 EDITAIS</button>
                            <button onClick={() => window.open(`${BASE_URL}/pdf/prova2023${slugLimpo}_mat_ingles.pdf`)} className="bg-white/10 hover:bg-white/20 px-4 py-2 rounded-lg text-[10px] font-bold border border-white/20">📝 PROVAS ANTERIORES</button>
                            <button onClick={() => window.open(`${BASE_URL}/pdf/gabarito2024${slugLimpo}.pdf`)} className="bg-white/10 hover:bg-white/20 px-4 py-2 rounded-lg text-[10px] font-bold border border-white/20">✅ GABARITOS</button>
                        </div>

                        <main className="p-8 max-w-7xl mx-auto">
                            <h2 className="text-center text-white/40 text-[10px] font-black tracking-[0.3em] mb-8 uppercase">Apostilas Operacionais</h2>
                            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8">
                                {escola.materias.map((m) => (
                                    <div key={m} className="card-militar rounded-3xl overflow-hidden group">
                                        <div className="h-64 bg-black p-4 flex items-center justify-center">
                                            <img 
                                                src={`${BASE_URL}/png/card_${formatar(m)}_${slugLimpo}.png`} 
                                                className="max-w-full max-h-full object-contain group-hover:scale-105 transition-transform duration-500 shadow-2xl"
                                                alt={m}
                                                onError={(e) => { e.target.src = "https://via.placeholder.com/300x450?text=CAPA+EM+BREVE"; }}
                                            />
                                        </div>
                                        <div className="p-5 text-center bg-black/20">
                                            <h3 className="font-black text-[11px] mb-4 uppercase text-orange-100">{m}</h3>
                                            <button 
                                                onClick={() => window.open(`${BASE_URL}/pdf/${formatar(m)}_${slugLimpo}.pdf`, '_blank')}
                                                className="w-full bg-orange-600 text-black font-black py-3 rounded-xl text-xs hover:bg-white transition-colors"
                                            >
                                                LER APOSTILA
                                            </button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </main>
                    </div>
                );
            }
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
