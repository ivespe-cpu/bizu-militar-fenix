<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIZÚ MILITAR FÊNIX</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #050505; color: white; margin: 0; font-family: sans-serif; overflow-x: hidden; }
        .militar-gradient { background: linear-gradient(135deg, #0f172a 0%, #020617 100%); }
        .fênix-input { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); padding: 12px; border-radius: 8px; color: white; outline: none; transition: 0.3s; width: 100%; }
        .fênix-input:focus { border-color: #ea580c; background: rgba(255,255,255,0.1); }
        .logo-glow { filter: drop-shadow(0 0 15px rgba(234, 88, 12, 0.4)); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        const LOGO_BIZU_MILITAR = "https://i.ibb.co/C3mFvXv/logo-bizu.png"; 
        const LOGO_ESQUADRAO_FENIX = "https://i.ibb.co/9H7W1V8/logo-fenix.png"; 

        function App() {
            const [status, setStatus] = useState('login'); 
            const [escolaSel, setEscolaSel] = useState('');

            if (status === 'login') {
                return (
                    <div className="min-h-screen flex items-center justify-center p-6 militar-gradient">
                        <div className="max-w-md w-full bg-black/40 p-10 rounded-[40px] border-2 border-orange-600/30 text-center shadow-2xl">
                            <img src={LOGO_BIZU_MILITAR} alt="Bizu Militar" className="h-32 mx-auto mb-6 logo-glow" 
                                 onError={(e) => {e.target.src="https://via.placeholder.com/150?text=BIZU+MILITAR"}} />
                            
                            <h1 className="text-2xl font-black italic mb-8 text-white uppercase tracking-tighter">Portal de Acesso</h1>
                            
                            <div className="flex flex-col gap-4 text-left">
                                <input type="text" placeholder="LOGIN" className="fênix-input font-bold" />
                                <input type="password" placeholder="SENHA" className="fênix-input font-bold" />
                                <button onClick={() => setStatus('qg')} className="mt-4 bg-orange-600 hover:bg-white hover:text-black py-4 rounded-xl font-black transition-all uppercase tracking-widest text-sm">ENTRAR NO COMBATE</button>
                            </div>
                        </div>
                    </div>
                );
            }

            if (status === 'qg') {
                const escolas = [
                    { id: 'cn', nome: 'Colégio Naval', sigla: 'CN' },
                    { id: 'rj', nome: 'Escola Militar - RJ', sigla: 'CMRJ' },
                    { id: 'eear', nome: 'EEAR', sigla: 'EEAR' },
                    { id: 'espcex', nome: 'EsPCEx', sigla: 'EsPCEx' },
                    { id: 'esa', nome: 'ESA', sigla: 'ESA' },
                    { id: 'extras', nome: 'CONCURSOS', sigla: 'EXTRAS' } // ATUALIZADO
                ];

                return (
                    <div className="min-h-screen">
                        <header className="bg-[#0f172a] border-b-4 border-orange-600 p-4 flex justify-between items-center px-8">
                            <div className="flex items-center gap-4">
                                <img src={LOGO_ESQUADRAO_FENIX} alt="Esquadrão Fênix" className="h-12 logo-glow" 
                                     onError={(e) => {e.target.src="https://via.placeholder.com/50?text=FENIX"}} />
                                <span className="font-black italic text-xl uppercase hidden md:block text-orange-500">Esquadrão Fênix</span>
                            </div>
                            <button onClick={() => setStatus('login')} className="bg-red-600/20 text-red-500 px-4 py-1 rounded-full text-[10px] font-black uppercase border border-red-500/30">Desconectar</button>
                        </header>
                        
                        <main className="max-w-6xl mx-auto p-10">
                            <div className="mb-12 border-l-8 border-orange-600 pl-6">
                                <h2 className="text-4xl md:text-5xl font-black uppercase italic tracking-tight">Centro de <span className="text-orange-500">Comando</span></h2>
                                <p className="text-slate-400 font-bold text-xs uppercase tracking-widest">Selecione a unidade de ensino</p>
                            </div>
                            
                            <div className="grid grid-cols-2 md:grid-cols-3 gap-6">
                                {escolas.map(e => (
                                    <button key={e.id} onClick={() => {setEscolaSel(e.nome); setStatus('escola');}} 
                                            className="bg-[#111827] p-8 rounded-[30px] border-2 border-white/5 hover:border-orange-600 transition-all flex flex-col items-center gap-4 group hover:bg-orange-600/5">
                                        <div className="w-20 h-20 bg-black rounded-2xl flex items-center justify-center text-sm font-black group-hover:scale-110 transition-transform italic text-orange-500 border border-white/10 shadow-lg px-2 text-center leading-tight">{e.sigla}</div>
                                        <span className="font-black tracking-widest uppercase text-xs text-slate-300 group-hover:text-white">{e.nome}</span>
                                    </button>
                                ))}
                            </div>
                        </main>
                    </div>
                );
            }

            return (
                <div className="min-h-screen">
                    <header className="bg-[#0f172a] border-b-4 border-orange-600 p-4 flex justify-between items-center px-8">
                         <div className="flex items-center gap-4">
                            <img src={LOGO_ESQUADRAO_FENIX} className="h-10" />
                            <span className="font-black italic text-lg uppercase">Módulo: <span className="text-orange-500">{escolaSel}</span></span>
                        </div>
                        <button onClick={() => setStatus('qg')} className="bg-white/10 px-4 py-2 rounded-lg text-[10px] font-black uppercase hover:bg-orange-600 transition-all">← Voltar</button>
                    </header>

                    <main className="max-w-6xl mx-auto p-6 md:p-10">
                        <div className="grid grid-cols-3 md:grid-cols-6 gap-3">
                            <MenuBotao label="Apostilas" emoji="📚" />
                            <MenuBotao label="Videoaulas" emoji="🎥" />
                            <MenuBotao label="Motivacionais" emoji="⚡" />
                            <MenuBotao label="Institucionais" emoji="🏛️" />
                            <MenuBotao label="Simulados" emoji="🛡️" />
                            <MenuBotao label="Provas" emoji="📝" /> {/* ATUALIZADO */}
                        </div>
                        
                        <div className="mt-12 bg-white/5 border-2 border-dashed border-white/10 rounded-[40px] p-20 text-center">
                            <p className="font-black text-slate-500 italic uppercase tracking-[0.3em]">Aguardando Injeção de Arsenal ({escolaSel})</p>
                        </div>
                    </main>
                </div>
            );
        }

        function MenuBotao({label, emoji}) {
            return (
                <button className="bg-[#111827] p-4 rounded-2xl border border-white/5 flex flex-col items-center gap-2 hover:bg-orange-600 transition-all group">
                    <span className="text-xl group-hover:scale-125 transition-transform">{emoji}</span>
                    <span className="text-[9px] font-black uppercase text-center text-slate-400 group-hover:text-white">{label}</span>
                </button>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
