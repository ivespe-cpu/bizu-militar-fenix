<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIZÚ MILITAR FÊNIX - ELITE</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --azul-marinho: #001233;
            --dourado-ouro: #D4AF37;
            --vermelho-tatico: #bc0000;
        }
        body { background-color: var(--azul-marinho); color: white; margin: 0; font-family: 'Segoe UI', sans-serif; }
        .militar-gradient { background: linear-gradient(135deg, #001233 0%, #000814 100%); }
        .text-ouro { color: var(--dourado-ouro); }
        .border-ouro { border: 2px solid var(--dourado-ouro); }
        
        .linha-vermelha { 
            height: 4px; 
            background: repeating-linear-gradient(45deg, var(--vermelho-tatico), var(--vermelho-tatico) 10px, #7b0000 10px, #7b0000 20px); 
            width: 100%;
        }

        .card-escola { 
            position: relative;
            height: 180px;
            overflow: hidden;
            border-radius: 15px;
            border-bottom: 5px solid var(--dourado-ouro);
            transition: 0.4s;
            display: flex;
            align-items: center;
            justify-content: center;
            background-size: cover;
            background-position: center;
        }
        .card-escola::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 18, 51, 0.75);
        }
        .card-escola:hover { transform: scale(1.02); }
        
        .sigla-txt {
            position: relative;
            z-index: 10;
            font-size: 2.5rem;
            font-weight: 900;
            color: var(--dourado-ouro);
            text-shadow: 2px 2px 10px rgba(0,0,0,0.8);
            font-style: italic;
        }

        .logo-login { 
            width: 100%; /* Largura total do container para alinhar com a linha */
            max-width: 350px; /* Limite de segurança */
            height: auto;
            filter: drop-shadow(0 0 10px rgba(212, 175, 55, 0.3)); 
        }
        
        /* Botão Restaurado */
        .btn-acesso {
            background-color: var(--dourado-ouro) !important;
            color: black !important;
            font-weight: 900;
            text-transform: uppercase;
            padding: 1rem;
            border-radius: 0.5rem;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
        }
        .btn-acesso:hover { background-color: white !important; transform: translateY(-2px); }

        .logo-interna { height: 80px; } /* Aumentada conforme pedido */
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        const LOGO_BIZU_MILITAR = "https://i.ibb.co/BKLSQKT1/logo-bizu.jpg"; 
        const LOGO_ESQUADRAO_FENIX = "https://i.ibb.co/Q31w6PLJ/logo-esquadrao.jpg"; 

        function App() {
            const [status, setStatus] = useState('login'); 
            const [escolaSel, setEscolaSel] = useState('');

            const escolas = [
                { sigla: 'CN', nome: 'COLÉGIO NAVAL', img: 'https://images.unsplash.com/photo-1590490360182-c33d57733427?auto=format&fit=crop&q=80&w=500' },
                { sigla: 'CMRJ', nome: 'COLÉGIO MILITAR - RJ', img: 'https://upload.wikimedia.org/wikipedia/commons/thumb/5/5a/Col%C3%A9gio_Militar_do_Rio_de_Janeiro.jpg/500px-Col%C3%A9gio_Militar_do_Rio_de_Janeiro.jpg' },
                { sigla: 'EEAR', nome: 'EEAR', img: 'https://www2.fab.mil.br/eear/images/noticias/2023/06_JUNHO/23_eear/DSC_0137.jpg' },
                { sigla: 'EsPCEx', nome: 'EsPCEx', img: 'https://upload.wikimedia.org/wikipedia/commons/thumb/b/b3/Espcex-front.jpg/500px-Espcex-front.jpg' },
                { sigla: 'ESA', nome: 'ESA', img: 'https://www.eb.mil.br/documents/10138/10321350/ESA1.jpg/87029671-3310-85f2-9333-e18e3c509618?t=1559235002737' },
                { sigla: 'EXTRAS', nome: 'CONCURSOS', img: 'https://images.unsplash.com/photo-1524178232363-1fb2b075b655?auto=format&fit=crop&q=80&w=500' }
            ];

            if (status === 'login') {
                return (
                    <div className="min-h-screen flex items-center justify-center p-6 militar-gradient">
                        <div className="max-w-md w-full bg-black/60 p-10 rounded-2xl border-2 border-ouro text-center shadow-2xl">
                            <div className="flex flex-col items-center">
                                <img src={LOGO_BIZU_MILITAR} alt="Bizu Militar" className="logo-login mb-4 rounded-lg" />
                                <div className="linha-vermelha mb-8"></div>
                            </div>
                            <div className="flex flex-col gap-4 text-left">
                                <label className="text-[10px] font-black text-ouro uppercase tracking-widest">Matrícula</label>
                                <input type="text" placeholder="184LMC" className="p-3 bg-white/5 border border-ouro/30 rounded text-white outline-none focus:border-ouro" />
                                <label className="text-[10px] font-black text-ouro uppercase tracking-widest">Senha</label>
                                <input type="password" placeholder="******" className="p-3 bg-white/5 border border-ouro/30 rounded text-white outline-none focus:border-ouro" />
                                <button onClick={() => setStatus('qg')} className="btn-acesso mt-4">Entrar no Combate</button>
                            </div>
                        </div>
                    </div>
                );
            }

            if (status === 'qg') {
                return (
                    <div className="min-h-screen">
                        <header className="bg-[#000814] border-b-2 border-ouro p-6 flex justify-between items-center px-8 shadow-xl">
                            <img src={LOGO_ESQUADRAO_FENIX} alt="Esquadrão Fênix" className="logo-interna rounded shadow-sm" />
                            <div className="flex-1 text-center px-4">
                                <h2 className="text-2xl md:text-3xl font-black text-ouro italic tracking-tighter uppercase">Bem-vindo, Comandante Eufrásio</h2>
                                <p className="text-[10px] tracking-[0.4em] opacity-60">SISTEMA DE PREPARAÇÃO DE EXCELÊNCIA</p>
                            </div>
                            <button className="bg-red-900/20 border border-red-600 text-red-500 px-4 py-2 rounded font-black text-[10px]" onClick={() => setStatus('login')}>SAIR</button>
                        </header>
                        
                        <main className="max-w-6xl mx-auto p-10">
                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 mb-16">
                                {escolas.map(e => (
                                    <button key={e.sigla} onClick={() => {setEscolaSel(e.sigla); setStatus('escola');}} 
                                            className="card-escola shadow-lg" style={{backgroundImage: `url(${e.img})`}}>
                                        <span className="sigla-txt">{e.sigla}</span>
                                        <span className="absolute bottom-2 z-10 text-[9px] font-black tracking-[0.2em] text-white opacity-80 uppercase">{e.nome}</span>
                                    </button>
                                ))}
                            </div>
                            <div className="linha-vermelha mb-6"></div>
                            <div className="text-center italic text-slate-400 font-serif bg-black/20 p-6 rounded-lg">
                                <p>"O treinamento difícil torna o combate bem mais fácil"</p>
                            </div>
                        </main>
                    </div>
                );
            }

            return (
                <div className="min-h-screen militar-gradient">
                    <header className="bg-[#000814] border-b-2 border-ouro p-4 flex justify-between items-center px-8 shadow-md">
                        <div className="flex items-center gap-4">
                            <img src={LOGO_ESQUADRAO_FENIX} className="h-14 rounded" />
                            <span className="font-black text-ouro uppercase tracking-widest">{escolaSel}</span>
                        </div>
                        <button onClick={() => setStatus('qg')} className="bg-white/5 border border-ouro/30 px-6 py-2 rounded text-[10px] font-black hover:bg-ouro hover:text-black transition-all">VOLTAR AO QG</button>
                    </header>
                    <main className="max-w-7xl mx-auto p-10 text-center">
                        <h2 className="text-ouro font-black mb-10 tracking-[0.5em] uppercase">Módulos de Estudo Disponíveis</h2>
                        <div className="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-8 gap-2 mb-10">
                            {['APOSTILAS', 'VÍDEOS', 'MOTIVAÇÃO', 'INSTITUC.', 'SIMULADOS', 'PROVAS', 'EDITAIS', 'GABARITOS'].map(m => (
                                <button key={m} className="bg-white/5 border border-ouro/20 p-2 rounded text-[8px] font-black hover:bg-ouro hover:text-black transition-all uppercase">{m}</button>
                            ))}
                        </div>
                        <p className="opacity-50 italic">Selecione um módulo acima para carregar o arsenal.</p>
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
