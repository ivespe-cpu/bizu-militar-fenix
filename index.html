<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIZÚ MILITAR FÊNIX - PLATAFORMA DE ELITE</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --azul-marinho: #001233; --dourado-ouro: #D4AF37; --vermelho-tatico: #bc0000; }
        body { background-color: var(--azul-marinho); color: white; margin: 0; font-family: 'Segoe UI', sans-serif; overflow-x: hidden; }
        .militar-gradient { background: linear-gradient(135deg, #001233 0%, #000814 100%); }
        .linha-vermelha { height: 4px; background: repeating-linear-gradient(45deg, var(--vermelho-tatico), var(--vermelho-tatico) 10px, #7b0000 10px, #7b0000 20px); width: 100%; }
        
        .btn-material { 
            background-color: #D4AF37 !important; 
            color: #000000 !important; 
            font-weight: 900 !important; 
            text-transform: uppercase;
            padding: 12px;
            border-radius: 6px;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.2);
        }

        .btn-voltar-fixo { 
            background-color: #ffffff !important; 
            color: #000000 !important; 
            font-weight: 900 !important; 
            padding: 12px 28px !important; 
            border: 3px solid #D4AF37 !important;
            text-transform: uppercase;
        }

        .frase-box {
            background: rgba(0,0,0,0.5);
            border-left: 4px solid var(--vermelho-tatico);
            padding: 20px;
            border-radius: 0 8px 8px 0;
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
        }

        .card-escola { position: relative; height: 180px; border-radius: 12px; border-bottom: 4px solid #D4AF37; overflow: hidden; display: flex; align-items: center; justify-content: center; background-size: cover; background-position: center; cursor: pointer; }
        .card-escola::before { content: ""; position: absolute; inset: 0; background: rgba(0, 18, 51, 0.7); }
        .sigla-txt { position: relative; z-index: 10; font-size: 2.2rem; font-weight: 900; color: #D4AF37; font-style: italic; text-shadow: 2px 2px 10px black; }
        
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #D4AF37; border-radius: 10px; }
        
        .motion-video { width: 100%; border-radius: 8px; border: 1px solid rgba(212, 175, 55, 0.1); }
        .motion-header { height: 100px; border-radius: 4px; border: 1px solid #D4AF37; }

        .video-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 8px; border: 1px solid rgba(212, 175, 55, 0.3); }
        .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const BASE_URL = "https://raw.githubusercontent.com/ivespe-cpu/bizufenix/main/";

        const ALUNOS_DB = [
            { m: "ags186", p: "SG.GASPARELLO", pts: 1500 }, { m: "alm170", p: "SG. MOURA", pts: 1450 },
            { m: "bsp223", p: "SD. PINHEIRO", pts: 1200 }, { m: "bab196", p: "CB. BRAYAN", pts: 1100 },
            { m: "bbs203", p: "SD. BERNARDO", pts: 900 }, { m: "cvs208", p: "CB. CAMILA", pts: 1050 },
            { m: "dva194", p: "CB. ALBUQUERQUE", pts: 1300 }, { m: "esp192", p: "SG. PEIXOTO", pts: 1250 },
            { m: "egc228", p: "CB. ENZO", pts: 850 }, { m: "gsp187", p: "SG. GABRIELLE PEREIRA", pts: 1400 },
            { m: "gac174", p: "SG. GABRIELLY COUTINHO", pts: 1350 }, { m: "gem240", p: "SD.MICAELA", pts: 950 },
            { m: "gfa109", p: "SUB.TEN. ARAUJO", pts: 1900 }, { m: "hls197", p: "CB. SALES", pts: 1150 },
            { m: "icg127", p: "SG. GRANADO", pts: 1600 }, { m: "iws159", p: "SG. LIMA", pts: 1550 },
            { m: "jgm108", p: "SUB.TEN. MORAES", pts: 1950 }, { m: "jpj110", p: "ASP. JOÃO SAMUEL", pts: 2000 },
            { m: "jva190", p: "SG. ANDRADE", pts: 1480 }, { m: "jhs198", p: "CB. JOSUÉ", pts: 1120 },
            { m: "jcm166", p: "SG. JUNIO", pts: 1420 }, { m: "kfs245", p: "CB. FONTES", pts: 1080 },
            { m: "lgb226", p: "CB. BELTRON", pts: 1190 }, { m: "lod225", p: "CB. FADINI", pts: 1170 },
            { m: "lse165", p: "SG. ELEUTHÉRIO", pts: 1510 }, { m: "lfs220", p: "CB. LUIZ FERNANDO", pts: 1030 },
            { m: "lmc184", p: "SG. COSTA", pts: 1800 }, { m: "mps144", p: "SG. PEÇANHA", pts: 1750 },
            { m: "mis133", p: "SG. IRENO", pts: 1320 }, { m: "nmp214", p: "CB. NATHAN", pts: 800 },
            { m: "nab161", p: "SG. NICOLLAS ARTHUR", pts: 1580 }, { m: "nvo148", p: "SG. NICOLY VICTORIA", pts: 1570 },
            { m: "php105", p: "SUB.TEN. PAULO", pts: 1910 }, { m: "pha219", p: "CB. PEDRO HENRIQUE", pts: 1180 },
            { m: "pho188", p: "SG. DE PAULA", pts: 1410 }, { m: "phm185", p: "SG. PEDRO RIBEIRO", pts: 1430 },
            { m: "phc232", p: "SD. PIETRO", pts: 920 }, { m: "rsb130", p: "SG. BARBOSA", pts: 1620 },
            { m: "scg216", p: "SD. SAMANTHA", pts: 940 }, { m: "tvo212", p: "SG. THAYANE", pts: 1390 },
            { m: "tgs164", p: "SG. GARCIA", pts: 1470 }, { m: "vho129", p: "SG. VICTOR HUGO", pts: 1650 }
        ];

        const FRASES_COMANDO = [
            "A limitação está apenas na sua mente, e não no seu corpo",
            "Coragem não é não ter medo, e sim, seguir em frente apesar do medo",
            "Grandes batalhas só são dadas a grandes guerreiros",
            "Vencer na vida não é um destino, é a sua escolha",
            "Os fracos perdem tempo reclamando. Os fortes agem, avançam e deixam um legado"
        ];

        const VIDEOS_DB = [
            { t: "FAB - REPORTAGEM SOBRE A EPCAR", id: "Vq_Z5KNmuks" },
            { t: "ISTO É A MARINHA DO BRASIL", id: "zSSp5CQpg10" },
            { t: "VÍDEO INSTITUCIONAL - MARINHA", id: "H0Gssr6mZbw" },
            { t: "LUTE PELOS SEUS SONHOS", id: "Nc3WusSAIQI" },
            { t: "QUEM DISSE QUE SERIA FÁCIL", id: "dOV_Dum7t58" },
            { t: "ESPCEX AMAN MOTIVACIONAL", id: "WKMS3LfGERo" }
        ];

        const ESCOLAS = [
            { s: 'COLÉGIO NAVAL', i: 'cn.jpg' }, { s: 'EPCAR', i: 'epcar.jpg' },
            { s: 'CMRJ', i: 'cmrj.jpg' }, { s: 'EsPCEX', i: 'espcex.jpg' },
            { s: 'EEAR', i: 'eear.jpg' }, { s: 'ESA', i: 'esa.jpg' }
        ];

        const MATERIAIS = [
            { t: "MATEMÁTICA", f: "matematica.png" }, { t: "PORTUGUÊS", f: "portugues.png" },
            { t: "INGLÊS", f: "ingles.png" }, { t: "HISTÓRIA", f: "historia.png" },
            { t: "GEOGRAFIA", f: "geografia.png" }, { t: "FÍSICA", f: "fisica.png" },
            { t: "QUÍMICA", f: "quimica.png" }, { t: "BIOLOGIA", f: "biologia.png" }
        ];

        function App() {
            const [status, setStatus] = useState('login'); 
            const [user, setUser] = useState(null);
            const [senhaIn, setSenhaIn] = useState('');
            const [escolaSel, setEscolaSel] = useState('');
            const [fraseDia, setFraseDia] = useState('');
            const [tipoDoc, setTipoDoc] = useState(''); // Nova variável para controlar Provas/Editais/Gabaritos

            useEffect(() => {
                setFraseDia(FRASES_COMANDO[Math.floor(Math.random() * FRASES_COMANDO.length)]);
            }, [status]);

            const handleLogin = (e) => {
                if(e) e.preventDefault();
                const s = senhaIn.toLowerCase().trim();
                const aluno = ALUNOS_DB.find(a => a.m === s);
                if (s === "esp0815" || s === "admin") { setUser({ p: "COMANDANTE", pts: "∞" }); setStatus('qg'); }
                else if (aluno) { setUser(aluno); setStatus('qg'); }
                else { alert("ACESSO NEGADO!"); }
            };

            // TELA DE LOGIN
            if (status === 'login') return (
                <div className="min-h-screen flex items-center justify-center p-6 militar-gradient">
                    <div className="max-w-md w-full bg-black/80 p-10 rounded-2xl border-2 border-[#D4AF37]/30 shadow-2xl text-center">
                        <video className="motion-video mb-6" autoPlay loop muted playsInline>
                            <source src={BASE_URL + "bizu8.mp4"} type="video/mp4" />
                        </video>
                        <div className="linha-vermelha mb-8"></div>
                        <input type="password" value={senhaIn} onChange={(e) => setSenhaIn(e.target.value)}
                               className="w-full p-4 mb-4 bg-white/5 border border-[#D4AF37]/20 rounded text-white text-center text-xl font-mono" placeholder="DIGITE SUA MATRÍCULA" />
                        <button onClick={handleLogin} className="w-full btn-material">ENTRAR NO SISTEMA</button>
                    </div>
                </div>
            );

            // TELA QG (SELEÇÃO DE ESCOLAS)
            if (status === 'qg') return (
                <div className="min-h-screen">
                    <header className="bg-[#000814] border-b-2 border-[#D4AF37] p-4 flex items-center justify-between px-10 sticky top-0 z-50">
                        <video className="motion-header" autoPlay loop muted playsInline>
                            <source src={BASE_URL + "esquadrao2.mp4"} type="video/mp4" />
                        </video>
                        <div className="text-center">
                            <h2 className="text-xl font-black text-[#D4AF37] italic uppercase">Seja bem vindo, {user.p}</h2>
                            <p className="text-[10px] text-white/60 tracking-widest mt-1 uppercase">Não importa qual seja a missão, você nasceu para triunfar</p>
                        </div>
                        <button onClick={() => setStatus('login')} className="text-red-500 font-bold border border-red-500/20 px-3 py-1 rounded text-xs">SAIR</button>
                    </header>
                    <main className="max-w-7xl mx-auto p-6 grid grid-cols-1 lg:grid-cols-3 gap-8">
                        <div className="lg:col-span-2">
                            <div className="frase-box mb-8">
                                <p className="text-[#D4AF37] text-xs font-black mb-2 tracking-[0.3em]">MENSAGEM DO COMANDO:</p>
                                <p className="text-xl font-medium italic">"{fraseDia}"</p>
                            </div>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                {ESCOLAS.map(e => (
                                    <div key={e.s} onClick={() => {setEscolaSel(e.s); setStatus('escola');}} 
                                         className="card-escola hover:scale-[1.02] transition-all" 
                                         style={{backgroundImage: `url(${BASE_URL + e.i})`}}>
                                        <span className="sigla-txt">{e.s}</span>
                                    </div>
                                ))}
                            </div>
                        </div>
                        <div className="bg-black/40 p-5 rounded-xl border border-[#D4AF37]/20 h-[550px] flex flex-col shadow-2xl">
                            <h3 className="text-[#D4AF37] font-black text-center mb-4 uppercase tracking-widest border-b border-[#D4AF37]/10 pb-2">Ranking Pelotão</h3>
                            <div className="space-y-2 overflow-y-auto custom-scroll pr-2">
                                {ALUNOS_DB.sort((a,b) => b.pts - a.pts).map((a, i) => (
                                    <div key={i} className="flex justify-between p-3 bg-white/5 rounded text-[11px] border-l-4 border-[#D4AF37]">
                                        <span>{i+1}º {a.p}</span>
                                        <span className="text-[#D4AF37] font-black">{a.pts} PTS</span>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </main>
                </div>
            );

            // TELA CINE FÊNIX
            if (status === 'videos') return (
                <div className="min-h-screen militar-gradient">
                    <header className="bg-[#000814] border-b-2 border-[#D4AF37] p-4 flex justify-between items-center px-10">
                        <h1 className="text-xl font-black text-[#D4AF37] italic uppercase">CINE FÊNIX - {escolaSel}</h1>
                        <button onClick={() => setStatus('escola')} className="btn-voltar-fixo">VOLTAR</button>
                    </header>
                    <main className="max-w-7xl mx-auto p-6 grid grid-cols-1 md:grid-cols-2 gap-10">
                        {VIDEOS_DB.map((v, i) => (
                            <div key={i} className="bg-black/60 p-4 rounded-xl border border-[#D4AF37]/20">
                                <h3 className="text-[#D4AF37] font-bold mb-3 uppercase text-xs">{v.t}</h3>
                                <div className="video-container">
                                    <iframe src={`https://www.youtube.com/embed/${v.id}`} allowFullScreen></iframe>
                                </div>
                            </div>
                        ))}
                    </main>
                </div>
            );

            // TELA DE DOCUMENTOS FINALIZADA (PROVAS, EDITAIS E GABARITOS)
            if (status === 'documentos') {
                // Arsenal de Provas CN
                const listaProvasCN = [
                    "prova2021CN-Port-Ciencias.pdf", "prova2021CN-mat-ingles2.pdf",
                    "prova2022CN-Port-Ciencias.pdf", "prova2022CN-mat-ingles.pdf",
                    "prova2023CN-Port-Ciencias.pdf", "prova2023CN-mat-ingles.pdf",
                    "prova2024CN-Port-Ciencias.pdf", "prova2024CN-mat-ingles.pdf",
                    "prova2025CN-Port-Cienc2.pdf", "prova2025CN-Port-Ciencias.pdf",
                    "prova2025CN-mat-ingles.pdf", "prova2025CN-mat-ingles2.pdf"
                ];

                // Arsenal de Editais CN
                const listaEditaisCN = [
                    "edital2019CN.pdf", "edital2020CN.pdf", "edital2021CN.pdf", 
                    "edital2022CN.pdf", "edital2023CN.pdf"
                ];

                // Arsenal de Gabaritos CN
                const listaGabaritosCN = [
                    "gabarito2020CN.pdf", "gabarito2021CN.pdf", "gabarito2022CN.pdf",
                    "gabarito2023CN.pdf", "gabarito2024CN.pdf", "gabarito2025CN.pdf"
                ];

                // Inteligência de Seleção de Arquivos
                let arquivosExibir = [];
                if (escolaSel === 'COLÉGIO NAVAL') {
                    if (tipoDoc === 'PROVAS ANTERIORES') arquivosExibir = listaProvasCN;
                    if (tipoDoc === 'EDITAIS') arquivosExibir = listaEditaisCN;
                    if (tipoDoc === 'GABARITOS') arquivosExibir = listaGabaritosCN;
                }

                return (
                    <div className="min-h-screen militar-gradient">
                        <header className="bg-[#000814] border-b-2 border-[#D4AF37] p-4 flex justify-between items-center px-10">
                            <div className="flex flex-col">
                                <h1 className="text-xl font-black text-[#D4AF37] italic uppercase">{tipoDoc}</h1>
                                <span className="text-[10px] text-white/50 tracking-[0.2em]">{escolaSel}</span>
                            </div>
                            <button onClick={() => setStatus('escola')} className="btn-voltar-fixo shadow-lg shadow-white/10">VOLTAR</button>
                        </header>
                        <main className="max-w-4xl mx-auto p-6">
                            <div className="bg-black/60 rounded-xl border border-[#D4AF37]/20 p-8 shadow-2xl backdrop-blur-sm">
                                <div className="flex items-center justify-between mb-8 border-b border-white/10 pb-4">
                                    <p className="text-white/60 italic text-sm">Mostrando {arquivosExibir.length} registros encontrados.</p>
                                    <div className="bg-[#D4AF37]/10 text-[#D4AF37] text-[10px] px-2 py-1 rounded border border-[#D4AF37]/20 font-black">ACESSO AUTORIZADO</div>
                                </div>
                                
                                <div className="space-y-3">
                                    {arquivosExibir.length > 0 ? (
                                        arquivosExibir.map((arquivo, index) => (
                                            <div key={index} className="group flex justify-between items-center p-4 bg-white/5 border-l-4 border-transparent hover:border-[#D4AF37] rounded hover:bg-white/10 transition-all">
                                                <div className="flex flex-col">
                                                    <span className="text-[#D4AF37] text-sm font-bold tracking-wide group-hover:translate-x-1 transition-transform">
                                                        {arquivo.replace('.pdf', '').toUpperCase()}
                                                    </span>
                                                    <span className="text-[9px] text-white/30 font-mono">SERVER_LOC: GITHUB/BIZUFENIX</span>
                                                </div>
                                                <a 
                                                    href={BASE_URL + arquivo} 
                                                    target="_blank" 
                                                    rel="noopener noreferrer"
                                                    className="bg-transparent border border-[#D4AF37] text-[#D4AF37] text-[10px] font-black px-6 py-2 rounded hover:bg-[#D4AF37] hover:text-black transition-all uppercase"
                                                >
                                                    Visualizar
                                                </a>
                                            </div>
                                        ))
                                    ) : (
                                        <div className="text-center py-20">
                                            <div className="text-5xl mb-4 opacity-20">📡</div>
                                            <p className="text-white/40 uppercase text-xs tracking-[0.3em]">Varredura completa: Ninguém deixado para trás, mas arquivos ainda não localizados.</p>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </main>
                    </div>
                );
            }

            // TELA DA ESCOLA (MATERIAIS E BOTÕES DE COMANDO)
            return (
                <div className="min-h-screen militar-gradient">
                    <header className="bg-[#000814] border-b-2 border-[#D4AF37] p-4 flex justify-between items-center px-10">
                        <div className="flex items-center gap-4">
                            <video className="motion-header" autoPlay loop muted playsInline style={{height: '60px'}}>
                                <source src={BASE_URL + "esquadrao2.mp4"} type="video/mp4" />
                            </video>
                            <h1 className="text-lg font-black text-[#D4AF37] uppercase italic">{escolaSel}</h1>
                        </div>
                        <button onClick={() => setStatus('qg')} className="btn-voltar-fixo">VOLTAR AO QG</button>
                    </header>
                    <main className="max-w-7xl mx-auto p-6">
                        {/* GRID DE BOTÕES SUPERIORES ATUALIZADOS */}
                        <div className="grid grid-cols-2 md:grid-cols-6 gap-2 mb-12">
                            <button 
                                onClick={() => alert("MISSÃO DO DIA: Verifique seu cronograma de estudos táticos no mural da escola.")}
                                className="bg-blue-600 border border-blue-400 p-3 rounded text-[10px] font-black uppercase text-white hover:bg-blue-500 transition-all shadow-lg"
                            >
                                📅 Missão do Dia
                            </button>
                            
                            <button onClick={() => setStatus('videos')} className="bg-[#D4AF37] text-black p-3 rounded text-[10px] font-black uppercase animate-pulse">
                                🎬 Cine Fênix
                            </button>
                            
                            <button 
                                onClick={() => alert("SALA DE PROVAS: O próximo simulado será liberado conforme cronograma do Comando.")}
                                className="bg-red-700 border border-red-500 p-3 rounded text-[10px] font-black uppercase text-white hover:bg-red-600 transition-all"
                            >
                                📝 Simulados
                            </button>
                            
                            <button 
                                onClick={() => { setTipoDoc('PROVAS ANTERIORES'); setStatus('documentos'); }}
                                className="bg-white/10 border border-[#D4AF37]/40 p-3 rounded text-[10px] font-black uppercase text-[#D4AF37] hover:bg-[#D4AF37]/10"
                            >
                                📜 Provas
                            </button>
                            
                            <button 
                                onClick={() => { setTipoDoc('EDITAIS'); setStatus('documentos'); }}
                                className="bg-white/10 border border-[#D4AF37]/40 p-3 rounded text-[10px] font-black uppercase text-[#D4AF37] hover:bg-[#D4AF37]/10"
                            >
                                📢 Editais
                            </button>
                            
                            <button 
                                onClick={() => { setTipoDoc('GABARITOS'); setStatus('documentos'); }}
                                className="bg-white/10 border border-[#D4AF37]/40 p-3 rounded text-[10px] font-black uppercase text-[#D4AF37] hover:bg-[#D4AF37]/10"
                            >
                                ✅ Gabaritos
                            </button>
                        </div>

                        {/* GRID DE MATERIAIS (APOSTILAS) */}
                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8">
                            {MATERIAIS.map((m, i) => (
                                <div key={i} className="bg-black/60 border border-[#D4AF37]/20 rounded-2xl overflow-hidden flex flex-col shadow-2xl">
                                    <div className="h-[300px] bg-black flex items-center justify-center p-2">
                                        <img src={BASE_URL + m.f} className="h-full object-contain" />
                                    </div>
                                    <div className="p-5 text-center bg-white/5 border-t border-[#D4AF37]/10">
                                        <div className="text-[#D4AF37] font-black text-xs mb-4 uppercase">{m.t}</div>
                                        <button className="w-full btn-material">ACESSAR MATERIAL</button>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
