<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIZÚ MILITAR FÊNIX - SISTEMA ELITE</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --azul-marinho: #001233;
            --dourado-ouro: #D4AF37;
            --vermelho-tatico: #bc0000;
        }
        body { background-color: var(--azul-marinho); color: white; margin: 0; font-family: 'Segoe UI', sans-serif; overflow-x: hidden; }
        .militar-gradient { background: linear-gradient(135deg, #001233 0%, #000814 100%); }
        
        .linha-vermelha { 
            height: 4px; 
            background: repeating-linear-gradient(45deg, var(--vermelho-tatico), var(--vermelho-tatico) 10px, #7b0000 10px, #7b0000 20px); 
            width: 100%;
        }

        /* LOGIN: LOGO GRANDE E BOTÃO ACESO */
        .logo-login-container { width: 100%; max-width: 380px; margin-bottom: 1rem; }
        .logo-login { width: 100%; height: auto; border-radius: 8px; }
        
        .btn-combate {
            background-color: var(--dourado-ouro) !important;
            color: black !important;
            font-weight: 900;
            letter-spacing: 1px;
            padding: 1.2rem;
            border-radius: 0.5rem;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.4);
            transition: 0.3s;
        }
        .btn-combate:hover { background-color: white !important; transform: scale(1.02); }

        /* HEADER INTERNO */
        .logo-esquadrao-topo { height: 90px; width: auto; transition: 0.3s; }

        /* CARDS DE ESCOLAS COM FOTOS */
        .card-escola { 
            position: relative; height: 180px; border-radius: 12px;
            border-bottom: 4px solid var(--dourado-ouro);
            overflow: hidden; display: flex; align-items: center; justify-content: center;
            background-size: cover; background-position: center; transition: 0.4s;
        }
        .card-escola::before { content: ""; position: absolute; inset: 0; background: rgba(0, 18, 51, 0.75); }
        .card-escola:hover::before { background: rgba(0, 18, 51, 0.4); }
        .sigla-txt { position: relative; z-index: 10; font-size: 2.2rem; font-weight: 900; color: var(--dourado-ouro); font-style: italic; text-shadow: 2px 2px 8px black; }

        /* APOSTILAS */
        .capa-doc { width: 100%; height: 260px; object-fit: cover; border-bottom: 2px solid var(--dourado-ouro); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        // ASSETS OFICIAIS
        const LOGO_BIZU = "https://i.ibb.co/BKLSQKT1/logo-bizu.jpg"; 
        const LOGO_FENIX = "https://i.ibb.co/Q31w6PLJ/logo-esquadrao.jpg"; 

        function App() {
            const [status, setStatus] = useState('login'); 
            const [escolaSel, setEscolaSel] = useState('');

            // ARSENAL DE CAPAS DO COLÉGIO NAVAL
            const arsenalCN = [
                { mat: 'MATEMÁTICA', img: 'https://i.ibb.co/MD42sWr9/capa-matematica.jpg' },
                { mat: 'PORTUGUÊS', img: 'https://i.ibb.co/tTJPWYsH/capa-portugues.jpg' },
                { mat: 'INGLÊS', img: 'https://i.ibb.co/rRGhQGv8/capa-ingles.jpg' },
                { mat: 'HISTÓRIA', img: 'https://i.ibb.co/tPbpMN1z/capa-historia.jpg' },
                { mat: 'GEOGRAFIA', img: 'https://i.ibb.co/G4rdS7qT/capa-geografia.jpg' },
                { mat: 'QUÍMICA', img: 'https://i.ibb.co/gZ78ThkL/capa-quimica.jpg' },
                { mat: 'BIOLOGIA', img: 'https://i.ibb.co/bgrXnP4z/capa-biologia.jpg' }
            ];

            if (status === 'login') {
                return (
                    <div className="min-h-screen flex items-center justify-center p-6 militar-gradient">
                        <div className="max-w-md w-full bg-black/70 p-10 rounded-2xl border-2 border-ouro/50 shadow-[0_0_50px_rgba(0,0,0,0.8)] text-center">
                            <div className="logo-login-container mx-auto">
                                <img src={LOGO_BIZU} alt="Bizu Militar" className="logo-login" />
                            </div>
                            <div className="linha-vermelha mb-8"></div>
                            
                            {/* Atributo autoComplete="off" para evitar preenchimento indesejado */}
                            <form className="flex flex-col gap-5 text-left" autoComplete="off">
                                <div>
                                    <label className="text-[10px] font-black text-ouro uppercase tracking-widest block mb-2">Matrícula de Acesso</label>
                                    <input type="text" name="matricula-fake" placeholder="Insira sua matrícula" 
                                           className="w-full p-4 bg-white/5 border border-ouro/20 rounded text-white focus:border-ouro outline-none" />
                                </div>
                                <div>
                                    <label className="text-[10px] font-black text-ouro uppercase tracking-widest block mb-2">Senha Operacional</label>
                                    <input type="password" name="senha-fake" placeholder="******" 
                                           className="w-full p-4 bg-white/5 border border-ouro/20 rounded text-white focus:border-ouro outline-none" />
                                </div>
                                <button type="button" onClick={() => setStatus('qg')} className="btn-combate mt-4 uppercase">
                                    Entrar no Combate
                                </button>
                            </form>
                        </div>
                    </div>
                );
            }

            if (status === 'qg') {
                return (
                    <div className="min-h-screen">
                        <header className="bg-[#000814] border-b-2 border-ouro p-6 flex items-center justify-between px-10">
                            <img src={LOGO_FENIX} alt="Fênix" className="logo-esquadrao-topo rounded" />
                            
                            <div className="absolute left-1/2 -translate-x-1/2 text-center">
                                <h2 className="text-3xl font-black text-ouro italic uppercase tracking-tighter">Bem-vindo, Comandante Eufrásio</h2>
                                <p className="text-xs font-bold opacity-40 tracking-[0.3em]">CENTRAL DE INTELIGÊNCIA FÊNIX</p>
                            </div>

                            <button onClick={() => setStatus('login')} className="text-[10px] font-black text-red-500 border border-red-500/30 px-4 py-2 rounded hover:bg-red-500 hover:text-white transition-all">DESCONECTAR</button>
                        </header>
                        
                        <main className="max-w-6xl mx-auto p-12">
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-6 mb-16">
                                {[
                                    {s: 'CN', n: 'COLÉGIO NAVAL', bg: 'https://images.unsplash.com/photo-1590490360182-c33d57733427?w=400'},
                                    {s: 'CMRJ', n: 'COLÉGIO MILITAR - RJ', bg: 'https://upload.wikimedia.org/wikipedia/commons/thumb/5/5a/Col%C3%A9gio_Militar_do_Rio_de_Janeiro.jpg/400px-Col%C3%A9gio_Militar_do_Rio_de_Janeiro.jpg'},
                                    {s: 'EEAR', n: 'EEAR', bg: 'https://www2.fab.mil.br/eear/images/noticias/2023/06_JUNHO/23_eear/DSC_0137.jpg'},
                                    {s: 'EsPCEx', n: 'EsPCEx', bg: 'https://upload.wikimedia.org/wikipedia/commons/thumb/b/b3/Espcex-front.jpg/400px-Espcex-front.jpg'},
                                    {s: 'ESA', n: 'ESA', bg: 'https://www.eb.mil.br/documents/10138/10321350/ESA1.jpg/400px-ESA1.jpg'},
                                    {s: 'EXTRAS', n: 'CONCURSOS', bg: 'https://images.unsplash.com/photo-1524178232363-1fb2b075b655?w=400'}
                                ].map(e => (
                                    <button key={e.s} onClick={() => {setEscolaSel(e.s); setStatus('escola');}} 
                                            className="card-escola" style={{backgroundImage: `url(${e.bg})`}}>
                                        <span className="sigla-txt">{e.s}</span>
                                        <span className="absolute bottom-3 z-10 text-[10px] font-black text-white/80 tracking-widest">{e.n}</span>
                                    </button>
                                ))}
                            </div>
                            <div className="linha-vermelha mb-8"></div>
                            <div className="bg-black/20 p-8 rounded-xl border border-white/5 text-center">
                                <p className="italic text-slate-400 font-serif">"A limitação está apenas na sua mente e não no seu corpo"</p>
                            </div>
                        </main>
                    </div>
                );
            }

            return (
                <div className="min-h-screen militar-gradient">
                    <header className="bg-[#000814] border-b-2 border-ouro p-6 flex items-center justify-between px-10">
                        <div className="flex items-center gap-6">
                            <img src={LOGO_FENIX} className="h-16 rounded" />
                            <h1 className="text-2xl font-black text-ouro tracking-widest">{escolaSel} | ARSENAL</h1>
                        </div>
                        <button onClick={() => setStatus('qg')} className="bg-white/5 border border-ouro/30 px-6 py-2 rounded text-xs font-black hover:bg-ouro hover:text-black transition-all">VOLTAR AO QG</button>
                    </header>

                    <main className="max-w-7xl mx-auto p-12">
                        <div className="grid grid-cols-2 md:grid-cols-8 gap-3 mb-12">
                            {['APOSTILAS', 'VÍDEOS', 'MOTIVAÇÃO', 'INSTITUC.', 'SIMULADOS', 'PROVAS', 'EDITAIS', 'GABARITOS'].map(m => (
                                <button key={m} className="bg-white/5 border border-ouro/10 p-3 rounded text-[9px] font-black hover:bg-ouro hover:text-black transition-all">{m}</button>
                            ))}
                        </div>

                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8">
                            {arsenalCN.map((item, idx) => (
                                <div key={idx} className="bg-black/40 border border-ouro/20 rounded-xl overflow-hidden hover:border-ouro transition-all shadow-2xl">
                                    <img src={item.img} className="capa-doc" alt={item.mat} />
                                    <div className="p-5 text-center">
                                        <h4 className="font-black text-xs text-ouro mb-4 tracking-widest uppercase">{item.mat}</h4>
                                        <button className="w-full bg-ouro text-black font-black py-3 rounded text-[10px] hover:bg-white transition-all">BAIXAR MATERIAL</button>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
