<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIZÚ MILITAR FÊNIX - ELITE</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --azul-marinho: #001233;
            --dourado: #D4AF37;
            --vermelho: #bc0000;
        }
        body { background-color: var(--azul-marinho); color: white; margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .militar-gradient { background: linear-gradient(135deg, #001233 0%, #000814 100%); }
        .border-dourada { border: 2px solid var(--dourado); }
        .text-dourado { color: var(--dourado); }
        .bg-dourado { background-color: var(--dourado); }
        .linha-vermelha { height: 4px; background: repeating-linear-gradient(45deg, var(--vermelho), var(--vermelho) 10px, #8b0000 10px, #8b0000 20px); }
        .card-escola { background: rgba(255,255,255,0.05); border-bottom: 4px solid var(--dourado); transition: 0.3s; }
        .card-escola:hover { transform: translateY(-5px); background: rgba(212, 175, 55, 0.1); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const LOGO_BIZU_MILITAR = "https://i.ibb.co/C3mFvXv/logo-bizu.png"; 
        const LOGO_ESQUADRAO_FENIX = "https://i.ibb.co/9H7W1V8/logo-fenix.png"; 

        function App() {
            const [status, setStatus] = useState('login'); 
            const [escolaSel, setEscolaSel] = useState('');
            const [fraseDia, setFraseDia] = useState("");

            const frases = [
                "O treinamento difícil torna o combate bem mais fácil",
                "A disciplina é a alma de um exército",
                "Só o que é bom dura o tempo suficiente para se tornar inesquecível.",
                "A limitação está apenas na sua mente e não no seu corpo",
                "A jornada mais longa começa com o primeiro passo.",
                "Se você pode sonhar, pode realizar."
            ];

            useEffect(() => {
                const dia = new Date().getDay(); // 0 (Dom) a 6 (Sab)
                setFraseDia(frases[dia === 0 ? 0 : dia - 1]);
            }, []);

            if (status === 'login') {
                return (
                    <div className="min-h-screen flex items-center justify-center p-6 militar-gradient">
                        <div className="max-w-md w-full bg-black/60 p-10 rounded-lg border-2 border-[#D4AF37] text-center shadow-[0_0_30px_rgba(212,175,55,0.2)]">
                            <img src={LOGO_BIZU_MILITAR} className="h-32 mx-auto mb-6" onError={(e) => e.target.src="https://via.placeholder.com/150?text=BIZU+MILITAR"} />
                            <div className="linha-vermelha mb-6"></div>
                            <div className="flex flex-col gap-4">
                                <input type="text" placeholder="LOGIN" className="p-3 bg-white/10 border border-dourado/30 rounded text-white font-bold outline-none focus:border-dourado" />
                                <input type="password" placeholder="SENHA" className="p-3 bg-white/10 border border-dourado/30 rounded text-white font-bold outline-none focus:border-dourado" />
                                <button onClick={() => setStatus('qg')} className="bg-dourado text-black py-3 rounded font-black hover:bg-white transition-all uppercase tracking-tighter">Acessar Sistema</button>
                            </div>
                        </div>
                    </div>
                );
            }

            if (status === 'qg') {
                const escolas = [
                    { id: 'cn', nome: 'Colégio Naval', sigla: 'CN' },
                    { id: 'rj', nome: 'Escola Militar - RJ', sigla: 'CMRJ' },
                    { id: 'eear', nome: 'EEAR', sigla: 'EEAR' },
                    { id: 'espcex', nome: 'EsPCEx', sigla: 'EsPCEx' },
                    { id: 'esa', nome: 'ESA', sigla: 'ESA' },
                    { id: 'extras', nome: 'CONCURSOS', sigla: 'EXTRAS' }
                ];

                return (
                    <div className="min-h-screen">
                        <header className="bg-[#000814] border-b-2 border-dourado p-4 flex justify-between items-center px-8 shadow-xl">
                            <div className="flex items-center gap-4">
                                <img src={LOGO_ESQUADRAO_FENIX} className="h-12" onError={(e) => e.target.src="https://via.placeholder.com/50?text=FENIX"} />
                                <span className="font-black italic text-xl text-dourado">ESQUADRÃO FÊNIX</span>
                            </div>
                            <button onClick={() => setStatus('login')} className="text-red-500 font-bold text-xs border border-red-500 px-3 py-1 rounded hover:bg-red-500 hover:text-white transition-all">LOGOUT</button>
                        </header>
                        
                        <main className="max-w-6xl mx-auto p-10">
                            <div className="bg-black/40 p-6 rounded-lg border-l-8 border-red-600 mb-10 shadow-lg">
                                <h2 className="text-3xl font-black text-dourado italic uppercase mb-2">Central de Comando</h2>
                                <p className="text-white font-serif italic text-lg">"{fraseDia}"</p>
                            </div>
                            
                            <div className="grid grid-cols-2 md:grid-cols-3 gap-6">
                                {escolas.map(e => (
                                    <button key={e.id} onClick={() => {setEscolaSel(e.nome); setStatus('escola');}} 
                                            className="card-escola p-8 rounded-lg flex flex-col items-center gap-4 group">
                                        <div className="w-20 h-20 bg-dourado rounded-full flex items-center justify-center text-black font-black text-xl shadow-lg group-hover:scale-110 transition-transform">{e.sigla}</div>
                                        <span className="font-black tracking-widest text-sm text-dourado group-hover:text-white">{e.nome}</span>
                                    </button>
                                ))}
                            </div>
                        </main>
                    </div>
                );
            }

            // PÁGINA DO COLÉGIO NAVAL / ESCOLAS
            const arsenalCN = [
                { mat: 'MATEMÁTICA', img: 'https://i.ibb.co/MD42sWr9/capa-matematica.jpg' },
                { mat: 'PORTUGUÊS', img: 'https://i.ibb.co/tTJPWYsH/capa-portugues.jpg' },
                { mat: 'INGLÊS', img: 'https://i.ibb.co/rRGhQGv8/capa-ingles.jpg' },
                { mat: 'HISTÓRIA', img: 'https://i.ibb.co/tPbpMN1z/capa-historia.jpg' },
                { mat: 'GEOGRAFIA', img: 'https://i.ibb.co/G4rdS7qT/capa-geografia.jpg' },
                { mat: 'QUÍMICA', img: 'https://i.ibb.co/gZ78ThkL/capa-quimica.jpg' },
                { mat: 'BIOLOGIA', img: 'https://i.ibb.co/bgrXnP4z/capa-biologia.jpg' }
            ];

            return (
                <div className="min-h-screen militar-gradient">
                    <header className="bg-[#000814] border-b-2 border-dourado p-4 flex justify-between items-center px-8">
                         <div className="flex items-center gap-4">
                            <img src={LOGO_ESQUADRAO_FENIX} className="h-10" />
                            <span className="font-black italic text-lg text-dourado uppercase">{escolaSel}</span>
                        </div>
                        <button onClick={() => setStatus('qg')} className="bg-white/10 px-4 py-2 rounded text-xs font-black border border-dourado/30 hover:bg-dourado hover:text-black transition-all">VOLTAR AO QG</button>
                    </header>

                    <main className="max-w-7xl mx-auto p-6">
                        <div className="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-8 gap-2 mb-10">
                            <BotaoMenu label="APOSTILAS" emoji="📚" />
                            <BotaoMenu label="VIDEOAULAS" emoji="🎥" />
                            <BotaoMenu label="MOTIVACIONAIS" emoji="⚡" />
                            <BotaoMenu label="INSTITUCIONAIS" emoji="🏛️" />
                            <BotaoMenu label="SIMULADOS" emoji="🛡️" />
                            <BotaoMenu label="PROVAS" emoji="📝" />
                            <BotaoMenu label="EDITAIS" emoji="📜" color="bg-red-900" />
                            <BotaoMenu label="GABARITOS" emoji="✅" color="bg-green-900" />
                        </div>

                        <div className="linha-vermelha mb-8"></div>
                        
                        <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
                            {arsenalCN.map((ap, i) => (
                                <div key={i} className="bg-black/40 border border-dourado/20 rounded-lg overflow-hidden hover:border-dourado transition-all">
                                    <img src={ap.img} className="w-full h-72 object-cover" />
                                    <div className="p-4 bg-[#001233]">
                                        <h3 className="font-black text-xs text-dourado mb-3 tracking-tighter uppercase">{ap.mat}</h3>
                                        <button className="w-full bg-dourado text-black text-[10px] font-black py-2 rounded hover:bg-white transition-all">BAIXAR MATERIAL</button>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </main>
                </div>
            );
        }

        function BotaoMenu({label, emoji, color}) {
            return (
                <button className={`${color || 'bg-white/5'} p-3 rounded border border-dourado/20 flex flex-col items-center gap-1 hover:scale-105 transition-all`}>
                    <span className="text-xl">{emoji}</span>
                    <span className="text-[8px] font-black uppercase text-center">{label}</span>
                </button>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
