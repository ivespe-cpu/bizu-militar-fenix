<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIZÚ MILITAR FÊNIX - PAINEL DE COMANDO</title>
    
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        :root { --azul-marinho: #001233; --dourado-ouro: #D4AF37; --vermelho-tatico: #bc0000; }
        body { background-color: var(--azul-marinho); color: white; margin: 0; font-family: 'Segoe UI', sans-serif; overflow-x: hidden; }
        .militar-gradient { background: linear-gradient(135deg, #001233 0%, #000814 100%); min-height: 100vh; }
        .linha-vermelha { height: 4px; background: repeating-linear-gradient(45deg, var(--vermelho-tatico), var(--vermelho-tatico) 10px, #7b0000 10px, #7b0000 20px); width: 100%; }
        .btn-material { background-color: #D4AF37 !important; color: #000 !important; font-weight: 900 !important; text-transform: uppercase; padding: 12px; border-radius: 6px; transition: 0.3s; width: 100%; cursor: pointer; }
        .btn-material:hover { transform: scale(1.02); box-shadow: 0 0 15px rgba(212, 175, 55, 0.4); }
        .btn-voltar-fixo { background-color: #fff !important; color: #000 !important; font-weight: 900 !important; padding: 8px 16px !important; border: 3px solid #D4AF37 !important; text-transform: uppercase; cursor: pointer; }
        .card-escola { position: relative; height: 180px; border-radius: 12px; border-bottom: 4px solid #D4AF37; overflow: hidden; display: flex; align-items: center; justify-content: center; background-size: cover; background-position: center; cursor: pointer; transition: 0.4s; background-color: #000; }
        .card-escola::before { content: ""; position: absolute; inset: 0; background: rgba(0, 18, 51, 0.7); }
        .sigla-txt { position: relative; z-index: 10; font-size: 2.2rem; font-weight: 900; color: #D4AF37; font-style: italic; text-shadow: 2px 2px 10px black; }
        .video-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 8px; border: 1px solid rgba(212, 175, 55, 0.3); }
        .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #D4AF37; border-radius: 10px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const BASE_URL = "https://raw.githubusercontent.com/ivespe-cpu/bizufenix/main/";

        // --- BANCO DE DADOS (Simulado) ---
        const ALUNOS_DB = [
            { m: "ags186", p: "SG.GASPARELLO", pts: 1500 }, { m: "jva190", p: "SG. ANDRADE", pts: 1480 },
            { m: "jpj110", p: "ASP. JOÃO SAMUEL", pts: 2000 }, { m: "jgm108", p: "SUB.TEN. MORAES", pts: 1950 }
            // ... (restante dos alunos mantidos internamente)
        ];

        // RECUPERANDO VÍDEOS QUE "SUMIRAM"
        const VIDEOS_FULL = [
            { t: "FAB - EPCAR", id: "Vq_Z5KNmuks" },
            { t: "MARINHA DO BRASIL", id: "zSSp5CQpg10" },
            { t: "INSTITUCIONAL", id: "H0Gssr6mZbw" },
            { t: "MOTIVACIONAL", id: "Nc3WusSAIQI" },
            { t: "QUEM DISSE QUE SERIA FÁCIL", id: "dOV_Dum7t58" },
            { t: "ESPCEX AMAN", id: "WKMS3LfGERo" }
        ];

        function App() {
            const [status, setStatus] = useState('login'); 
            const [user, setUser] = useState(null);
            const [senhaIn, setSenhaIn] = useState('');
            const [escolaSel, setEscolaSel] = useState('');
            const [aulaID, setAulaID] = useState('H0Gssr6mZbw'); // Link da Aula Semanal (Alterável no Admin)

            const handleLogin = (e) => {
                if(e) e.preventDefault();
                const s = senhaIn.toLowerCase().trim();
                const aluno = ALUNOS_DB.find(a => a.m === s);
                if (s === "esp0815") { setUser({ p: "COMANDANTE", pts: "∞", isAdmin: true }); setStatus('qg'); }
                else if (aluno) { setUser(aluno); setStatus('qg'); }
                else { alert("ACESSO NEGADO!"); }
            };

            const renderContent = () => {
                // TELA LOGIN
                if (status === 'login') return (
                    <div className="min-h-screen flex items-center justify-center p-6">
                        <div className="max-w-md w-full bg-black/80 p-8 rounded-2xl border-2 border-[#D4AF37]/30 text-center">
                            <h1 className="text-[#D4AF37] font-black text-2xl mb-6 italic">ACESSO TÁTICO</h1>
                            <input type="password" value={senhaIn} onChange={(e) => setSenhaIn(e.target.value)}
                                   className="w-full p-4 mb-4 bg-white/5 border border-[#D4AF37]/20 rounded text-white text-center" placeholder="MATRÍCULA" />
                            <button onClick={handleLogin} className="btn-material">AUTENTICAR</button>
                        </div>
                    </div>
                );

                // TELA QG
                if (status === 'qg') return (
                    <div className="min-h-screen">
                        <header className="bg-[#000814] border-b-2 border-[#D4AF37] p-4 flex justify-between items-center px-6">
                            <span className="text-[#D4AF37] font-black">SOLDIER: {user?.p}</span>
                            <div className="flex gap-2">
                                {user?.isAdmin && (
                                    <button onClick={() => setStatus('admin')} className="bg-red-600 text-white px-3 py-1 rounded text-xs font-black">PAINEL DE COMANDO</button>
                                )}
                                <button onClick={() => setStatus('login')} className="text-white/50 text-xs">SAIR</button>
                            </div>
                        </header>
                        <main className="max-w-5xl mx-auto p-6">
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                {['COLÉGIO NAVAL', 'EPCAR', 'EsPCEX', 'EEAR'].map(escola => (
                                    <div key={escola} onClick={() => {setEscolaSel(escola); setStatus('escola');}} className="card-escola">
                                        <span className="sigla-txt">{escola}</span>
                                    </div>
                                ))}
                            </div>
                        </main>
                    </div>
                );

                // TELA ADMIN (NOVA!)
                if (status === 'admin') return (
                    <div className="min-h-screen p-6">
                        <div className="max-w-4xl mx-auto bg-black/60 border-2 border-red-600 p-8 rounded-2xl">
                            <h2 className="text-red-600 font-black text-2xl mb-8 flex justify-between">
                                🕹️ PAINEL DE CONTROLE CENTRAL
                                <button onClick={() => setStatus('qg')} className="text-sm bg-white text-black px-4 py-1 rounded">FECHAR</button>
                            </h2>
                            <div className="space-y-6">
                                <div className="bg-white/5 p-4 rounded">
                                    <label className="block text-[#D4AF37] font-bold mb-2">ID DO VÍDEO DA AULA SEMANAL (YOUTUBE):</label>
                                    <div className="flex gap-2">
                                        <input type="text" value={aulaID} onChange={(e) => setAulaID(e.target.value)} className="flex-1 p-2 bg-black border border-white/20 rounded text-white" />
                                        <button onClick={() => alert("Vídeo Atualizado!")} className="bg-green-600 px-4 rounded font-bold">SALVAR</button>
                                    </div>
                                    <p className="text-[10px] mt-2 text-white/40 italic">Cole apenas o código após o "v=" do link do Youtube.</p>
                                </div>
                                <div className="grid grid-cols-2 gap-4">
                                    <button className="bg-blue-600 p-4 rounded font-black">ADICIONAR PDF (GITHUB)</button>
                                    <button className="bg-yellow-600 p-4 rounded font-black text-black">ZERA RANKING</button>
                                </div>
                            </div>
                        </div>
                    </div>
                );

                // TELA ESCOLA (HUB DE 5 PILARES)
                if (status === 'escola') return (
                    <div className="min-h-screen">
                        <header className="bg-[#000814] border-b-2 border-[#D4AF37] p-4 flex justify-between items-center px-6">
                            <h1 className="text-[#D4AF37] font-black italic">{escolaSel}</h1>
                            <button onClick={() => setStatus('qg')} className="btn-voltar-fixo">VOLTAR</button>
                        </header>
                        <main className="max-w-6xl mx-auto p-6 space-y-6">
                            <section className="bg-black/60 border-2 border-[#D4AF37] rounded-2xl overflow-hidden shadow-2xl">
                                <div className="bg-[#D4AF37] text-black p-2 text-center font-black text-xs tracking-widest uppercase">
                                    ⚡ CENTRO DE INSTRUÇÃO (PROFESSORES VIRTUAIS)
                                </div>
                                <div className="p-4 flex flex-col md:flex-row gap-6">
                                    <div className="w-full md:w-2/3 video-container">
                                        <iframe src={`https://www.youtube.com/embed/${aulaID}`} allowFullScreen></iframe>
                                    </div>
                                    <div className="w-full md:w-1/3 space-y-4">
                                        <h3 className="text-xl font-black text-[#D4AF37]">AULA DA SEMANA</h3>
                                        <p className="text-xs text-gray-400">Esta aula foi gerada para o concurso do {escolaSel}. Bons estudos!</p>
                                    </div>
                                </div>
                            </section>
                            <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                                <button onClick={() => setStatus('materiais')} className="bg-blue-900/40 p-6 rounded-xl border border-blue-500/50 font-black text-xs">📚 ARSENAL</button>
                                <button onClick={() => alert("Simulados em manutenção")} className="bg-red-900/40 p-6 rounded-xl border border-red-500/50 font-black text-xs">⚔️ COMBATE</button>
                                <button onClick={() => setStatus('editais')} className="bg-gray-800/40 p-6 rounded-xl border border-gray-500/50 font-black text-xs">🧠 INTELIGÊNCIA</button>
                                <button onClick={() => setStatus('cine')} className="bg-yellow-900/40 p-6 rounded-xl border border-yellow-500/50 font-black text-xs">🎬 CINE FÊNIX</button>
                            </div>
                        </main>
                    </div>
                );

                // CINE FÊNIX (VÍDEOS RECUPERADOS)
                if (status === 'cine') return (
                    <div className="min-h-screen p-6">
                        <button onClick={() => setStatus('escola')} className="mb-6 btn-voltar-fixo italic">VOLTAR</button>
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                            {VIDEOS_FULL.map((v, i) => (
                                <div key={i} className="bg-black/60 p-4 rounded-xl border border-[#D4AF37]/20">
                                    <h3 className="text-[#D4AF37] font-bold mb-3 text-xs">{v.t}</h3>
                                    <div className="video-container">
                                        <iframe src={`https://www.youtube.com/embed/${v.id}`} allowFullScreen></iframe>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                );
            };

            return <div className="militar-gradient">{renderContent()}</div>;
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
