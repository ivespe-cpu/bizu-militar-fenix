<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIZÚ MILITAR FÊNIX - SISTEMA ELITE</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --ouro: #D4AF37; --azul: #001233; }
        body { background: var(--azul); color: white; font-family: 'Segoe UI', sans-serif; margin: 0; overflow-x: hidden; }
        
        /* BACKGROUND VIDEO CONFIG */
        .video-bg { position: fixed; right: 0; bottom: 0; min-width: 100%; min-height: 100%; z-index: -1; object-fit: cover; opacity: 0.4; }
        
        .militar-gradient { background: linear-gradient(135deg, #001233 0%, #000814 100%); }
        .linha-tática { height: 4px; background: repeating-linear-gradient(45deg, #bc0000, #bc0000 10px, #7b0000 10px, #7b0000 20px); }
        
        .glass-panel { background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(10px); border: 1px solid rgba(211, 175, 55, 0.3); }
        
        /* RANKING SCROLL */
        .ranking-scroll { max-height: 450px; overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--ouro) transparent; }
        .ranking-scroll::-webkit-scrollbar { width: 5px; }
        .ranking-scroll::-webkit-scrollbar-thumb { background: var(--ouro); border-radius: 10px; }

        .btn-combate { background: var(--ouro) !important; color: black !important; font-weight: 900; transition: 0.4s; text-transform: uppercase; border: none; cursor: pointer; }
        .btn-combate:hover { background: white !important; box-shadow: 0 0 20px var(--ouro); }
        
        .card-escola { position: relative; height: 140px; border-radius: 10px; border-bottom: 3px solid var(--ouro); overflow: hidden; transition: 0.3s; cursor: pointer; }
        .card-escola:hover { transform: translateY(-5px); filter: brightness(1.2); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        const ALUNOS_DB = [
            { m: "ags186", p: "SG.GASPARELLO", pts: 1500 }, { m: "alm170", p: "SG. MOURA", pts: 1450 },
            { m: "bsp223", p: "SD. PINHEIRO", pts: 1200 }, { m: "bab196", p: "CB. BRAYAN", pts: 1100 },
            { m: "bbs203", p: "SD. BERNARDO", pts: 900 }, { m: "cvs208", p: "CB. CAMILA", pts: 1050 },
            { m: "dva194", p: "CB. ALBUQUERQUE", pts: 1300 }, { m: "esp192", p: "SG. PEIXOTO", pts: 1250 },
            { m: "egc228", p: "CB. ENZO", pts: 850 }, { m: "gsp187", p: "SG. GABRIELLE PEREIRA", pts: 1400 },
            { m: "gac174", p: "SG. GABRIELLY COUTINHO", pts: 1350 }, { m: "gem240", p: "SD.MICAELA", pts: 950 },
            { m: "gfa109", p: "SUB.TEN. ARAUJO", pts: 1900 }, { m: "hls197", p: "CB. SALES", pts: 1150 },
            { m: "icg127", p: "SG. GRANADO", pts: 1600 }, { m: "iws159", p: "SG. LIMA", pts: 1550 },
            { m: "jgm108", p: "SUB.TEN. MORAES", pts: 1950 }, { m: "jpj110", p: "ASP. JOÃO SAMUEL", pts: 2000 },
            { m: "jva190", p: "SG. ANDRADE", pts: 1480 }, { m: "jhs198", p: "CB. JOSUÉ", pts: 1120 },
            { m: "jcm166", p: "SG. JUNIO", pts: 1420 }, { m: "kfs245", p: "CB. FONTES", pts: 1080 },
            { m: "lgb226", p: "CB. BELTRON", pts: 1190 }, { m: "lod225", p: "CB. FADINI", pts: 1170 },
            { m: "lse165", p: "SG. ELEUTHÉRIO", pts: 1510 }, { m: "lfs220", p: "CB. LUIZ FERNANDO", pts: 1030 },
            { m: "lmc184", p: "SG. COSTA", pts: 1800 }, { m: "mps144", p: "SG. PEÇANHA", pts: 1750 },
            { m: "mis133", p: "SG. IRENO", pts: 1320 }, { m: "nmp214", p: "CB. NATHAN", pts: 800 },
            { m: "nab161", p: "SG. NICOLLAS ARTHUR", pts: 1580 }, { m: "nvo148", p: "SG. NICOLY VICTORIA", pts: 1570 },
            { m: "php105", p: "SUB.TEN. PAULO", pts: 1910 }, { m: "pha219", p: "CB. PEDRO HENRIQUE", pts: 1180 },
            { m: "pho188", p: "SG. DE PAULA", pts: 1410 }, { m: "phm185", p: "SG. PEDRO RIBEIRO", pts: 1430 },
            { m: "phc232", p: "SD. PIETRO", pts: 920 }, { m: "rsb130", p: "SG. BARBOSA", pts: 1620 },
            { m: "scg216", p: "SD. SAMANTHA", pts: 940 }, { m: "tvo212", p: "SG. THAYANE", pts: 1390 },
            { m: "tgs164", p: "SG. GARCIA", pts: 1470 }, { m: "vho129", p: "SG. VICTOR HUGO", pts: 1650 }
        ];

        function App() {
            const [status, setStatus] = useState('login');
            const [alunoAtivo, setAlunoAtivo] = useState(null);
            const [inputMat, setInputMat] = useState('');
            const [inputPass, setInputPass] = useState('');

            const tentarLogin = () => {
                const user = ALUNOS_DB.find(a => a.m === inputMat.toLowerCase());
                if(user && inputPass === 'fenix123') {
                    setAlunoAtivo(user);
                    setStatus('qg');
                } else {
                    alert("⚠️ ACESSO NEGADO: Matrícula ou Senha incorreta.");
                }
            };

            if (status === 'login') return (
                <div className="min-h-screen flex items-center justify-center p-4">
                    {/* VIDEO DE FUNDO (Substitua a URL abaixo pela URL do seu Motion quando disponível) */}
                    <video autoPlay muted loop className="video-bg">
                        <source src="https://assets.mixkit.co/videos/preview/mixkit-abstract-dark-blue-and-gold-background-32863-large.mp4" type="video/mp4" />
                    </video>
                    
                    <div className="max-w-md w-full glass-panel p-8 rounded-3xl shadow-2xl text-center">
                        <div className="mb-6">
                            <h1 className="text-ouro font-black text-3xl italic tracking-tighter">BIZÚ MILITAR FÊNIX</h1>
                            <p className="text-[10px] tracking-[0.4em] opacity-60">SISTEMA DE ELITE</p>
                        </div>
                        <div className="linha-tática mb-8"></div>
                        <div className="space-y-4 text-left">
                            <input onChange={e => setInputMat(e.target.value)} type="text" placeholder="MATRÍCULA" className="w-full p-4 bg-white/5 border border-ouro/20 rounded-lg text-white outline-none focus:border-ouro" />
                            <input onChange={e => setInputPass(e.target.value)} type="password" placeholder="SENHA" className="w-full p-4 bg-white/5 border border-ouro/20 rounded-lg text-white outline-none focus:border-ouro" />
                            <button onClick={tentarLogin} className="btn-combate w-full py-4 rounded-lg">Iniciar Missão</button>
                        </div>
                    </div>
                </div>
            );

            return (
                <div className="min-h-screen militar-gradient">
                    <header className="glass-panel p-6 flex justify-between items-center border-b border-ouro/30 sticky top-0 z-50">
                        <div>
                            <h2 className="text-ouro font-black italic uppercase">Comando: {alunoAtivo?.p}</h2>
                            <span className="text-[10px] bg-ouro text-black px-2 py-0.5 rounded font-bold">MÉRITO: {alunoAtivo?.pts}</span>
                        </div>
                        <button onClick={() => setStatus('login')} className="text-red-500 font-bold text-xs uppercase hover:underline">Desconectar</button>
                    </header>

                    <main className="max-w-6xl mx-auto p-6">
                        <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-4 mb-10">
                            {['CN', 'CMRJ', 'EEAR', 'EsPCEx', 'ESA', 'EXTRAS'].map(s => (
                                <div key={s} className="card-escola bg-black/40 flex items-center justify-center">
                                    <span className="text-ouro font-black text-2xl italic">{s}</span>
                                </div>
                            ))}
                        </div>

                        <div className="glass-panel rounded-2xl p-6 shadow-2xl">
                            <h3 className="text-ouro font-black italic mb-4 flex justify-between">
                                <span>🏆 RANKING GERAL DO EFETIVO</span>
                                <span className="text-white/40 text-xs uppercase">42 Alunos Ativos</span>
                            </h3>
                            <div className="ranking-scroll space-y-2 pr-2">
                                {ALUNOS_DB.sort((a,b) => b.pts - a.pts).map((al, i) => (
                                    <div key={al.m} className={`flex justify-between items-center p-3 rounded-lg border-l-4 ${al.m === alunoAtivo?.m ? 'bg-ouro/20 border-white' : 'bg-white/5 border-ouro/40'}`}>
                                        <div className="flex items-center gap-3">
                                            <span className="opacity-30 font-black">#{i+1}</span>
                                            <span className="font-bold text-sm uppercase">{al.p}</span>
                                        </div>
                                        <span className="text-ouro font-bold">{al.pts} PTS</span>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
