<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIZÚ MILITAR FÊNIX - PLATAFORMA DE ELITE</title>

    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

    <style>
        :root { 
            --preto-operacional: #050505; 
            --verde-vibrante: #83E509; 
            --verde-musgo: #1a2f23;
            --dourado: #D4AF37; 
        }

        body { 
            background-color: var(--preto-operacional); 
            color: white; 
            margin: 0; 
            font-family: 'Segoe UI', sans-serif; 
            overflow-x: hidden;
        }

        /* Gradiente de Fundo do Login */
        .militar-gradient {
            background: radial-gradient(circle at center, #1a2f23 0%, #050505 100%);
        }

        /* Botão Dourado Tático */
        .btn-ouro {
            background: transparent;
            border: 2px solid var(--dourado);
            color: var(--dourado);
            font-weight: 900;
            transition: 0.3s;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .btn-ouro:hover {
            background: var(--dourado);
            color: black;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
        }

        /* Scrollbar Personalizada */
        .custom-scroll::-webkit-scrollbar { width: 5px; }
        .custom-scroll::-webkit-scrollbar-track { background: #0a0a0a; }
        .custom-scroll::-webkit-scrollbar-thumb { background: var(--verde-vibrante); border-radius: 10px; }

        /* Ajuste do vídeo no Header */
        .motion-header { 
            height: 65px; 
            width: 65px; 
            object-fit: cover; 
            border-radius: 50%; 
            border: 2px solid var(--dourado); 
        }

        /* AJUSTE PARA AS CAPAS DAS APOSTILAS (Tamanho do Modelo) */
        .capa-container {
            height: 320px; /* Altura fixa para alinhar todas as capas */
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .capa-manual {
            width: 100%;
            height: 100%;
            object-fit: contain; /* Garante que a capa apareça inteira sem cortar */
            transition: 0.5s;
        }

        .video-container { 
            position: relative; 
            padding-bottom: 56.25%; 
            height: 0; 
            overflow: hidden; 
            border-radius: 15px; 
            border: 1px solid rgba(131, 229, 9, 0.2); 
        }
        .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }

        .card-menu {
            background: linear-gradient(145deg, #0f172a, #050505);
            border: 1px solid rgba(212, 175, 55, 0.1);
            transition: 0.3s;
        }
        .card-menu:hover { border-color: var(--verde-vibrante); transform: translateY(-3px); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const BASE_URL = "https://ivespe-cpu.github.io/bizu-militar-fenix";

        // --- BANCO DE DADOS (Mantido conforme sua última versão) ---
        const CONFIG_ESCOLAS = {
            "COLÉGIO NAVAL": { slug: "cn", materias: ["MATEMÁTICA", "PORTUGUÊS", "INGLÊS", "HISTÓRIA", "GEOGRAFIA", "FÍSICA", "QUÍMICA", "BIOLOGIA"] },
            "EPCAR": { slug: "epcar", materias: ["MATEMÁTICA", "PORTUGUÊS", "INGLÊS"] },
            "CMRJ": { slug: "cmrj", materias: ["MATEMÁTICA", "PORTUGUÊS"] },
            "EsPCEX": { slug: "espcex", materias: ["MATEMÁTICA", "PORTUGUÊS", "INGLÊS", "HISTÓRIA", "GEOGRAFIA", "FÍSICA", "QUÍMICA"] },
            "EEAR": { slug: "eear1", materias: ["MATEMÁTICA", "PORTUGUÊS", "INGLÊS", "FÍSICA"] },
            "ESA": { slug: "esa", materias: ["MATEMÁTICA", "PORTUGUÊS", "INGLÊS", "HISTÓRIA", "GEOGRAFIA"] }
        };

        const ALUNOS_DB = [
            { m: "ags186", p: "SG.GASPARELLO", pts: 1500 }, { m: "alm170", p: "SG. MOURA", pts: 1450 },
            { m: "bsp223", p: "SD. PINHEIRO", pts: 1200 }, { m: "bab196", p: "CB. BRAYAN", pts: 1100 },
            { m: "bbs203", p: "SD. BERNARDO", pts: 900 }, { m: "cvs208", p: "CB. CAMILA", pts: 1050 },
            { m: "dva194", p: "CB. ALBUQUERQUE", pts: 1300 }, { m: "esp192", p: "SG. PEIXOTO", pts: 1250 },
            { m: "egc228", p: "CB. ENZO", pts: 850 }, { m: "gsp187", p: "SG. GABRIELLE PEREIRA", pts: 1400 },
            { m: "gac174", p: "SG. GABRIELLY COUTINHO", pts: 1350 }, { m: "gem240", p: "SD.MICAELA", pts: 950 },
            { m: "gfa109", p: "SUB.TEN. ARAUJO", pts: 1900 }, { m: "hls197", p: "CB. SALES", pts: 1150 },
            { m: "icg127", p: "SG. GRANADO", pts: 1600 }, { m: "iws159", p: "SG. LIMA", pts: 1550 },
            { m: "jgm108", p: "SUB.TEN. MORAES", pts: 1950 }, { m: "jpj110", p: "ASP. JOÃO SAMUEL", pts: 2000 },
            { m: "jva190", p: "SG. ANDRADE", pts: 1480 }, { m: "jhs198", p: "CB. JOSUÉ", pts: 1120 },
            { m: "jcm166", p: "SG. JUNIO", pts: 1420 }, { m: "kfs245", p: "CB. FONTES", pts: 1080 },
            { m: "lgb226", p: "CB. BELTRON", pts: 1190 }, { m: "lod225", p: "CB. FADINI", pts: 1170 },
            { m: "lse165", p: "SG. ELEUTHÉRIO", pts: 1510 }, { m: "lfs220", p: "CB. LUIZ FERNANDO", pts: 1030 },
            { m: "lmc184", p: "SG. COSTA", pts: 1800 }, { m: "mps144", p: "SG. PEÇANHA", pts: 1750 },
            { m: "mis133", p: "SG. IRENO", pts: 1320 }, { m: "nmp214", p: "CB. NATHAN", pts: 800 },
            { m: "nab161", p: "SG. NICOLLAS ARTHUR", pts: 1580 }, { m: "nvo148", p: "SG. NICOLY VICTORIA", pts: 1570 },
            { m: "php105", p: "SUB.TEN. PAULO", pts: 1910 }, { m: "pha219", p: "CB. PEDRO HENRIQUE", pts: 1180 },
            { m: "pho188", p: "SG. DE PAULA", pts: 1410 }, { m: "phm185", p: "SG. PEDRO RIBEIRO", pts: 1430 },
            { m: "phc232", p: "SD. PIETRO", pts: 920 }, { m: "rsb130", p: "SG. BARBOSA", pts: 1620 },
            { m: "scg216", p: "SD. SAMANTHA", pts: 940 }, { m: "tvo212", p: "SG. THAYANE", pts: 1390 },
            { m: "tgs164", p: "SG. GARCIA", pts: 1470 }, { m: "vho129", p: "SG. VICTOR HUGO", pts: 1650 }
        ];

        const VIDEOS_DB = [
            { t: "FAB - EPCAR", id: "Vq_Z5KNmuks" }, { t: "MARINHA DO BRASIL", id: "zSSp5CQpg10" },
            { t: "INSTITUCIONAL", id: "H0Gssr6mZbw" }, { t: "MOTIVACIONAL", id: "Nc3WusSAIQI" },
            { t: "QUEM DISSE QUE SERIA FÁCIL", id: "dOV_Dum7t58" }, { t: "ESPCEX AMAN", id: "WKMS3LfGERo" }
        ];

        const FRASES = [
            "Coragem não é não ter medo, e sim, seguir em frente.",
            "Os fortes agem, avançam e deixam um legado.",
            "A limitação está apenas na sua mente.",
            "Grandes batalhas só são dadas a grandes guerreiros."
        ];

        // --- COMPONENTES ---

        const HeaderPadrao = ({ titulo, subTitulo, acaoBotao, textoBotao, corBotao = "text-red-500" }) => (
            <header className="bg-[#0f172a] border-b-4 border-[#1a2f23] p-4 flex justify-between items-center sticky top-0 z-50">
                <div className="flex items-center gap-3">
                    <video className="motion-header" autoPlay loop muted playsInline>
                        <source src={`${BASE_URL}/video/logo_esquadrao.mp4`} type="video/mp4" />
                    </video>
                    <div className="hidden sm:block">
                        <h1 className="text-[#83E509] font-black italic leading-tight text-lg uppercase">ESQUADRÃO FÊNIX</h1>
                        <p className="text-[10px] text-[#D4AF37] tracking-tighter uppercase font-bold">Prontos para o Combate</p>
                    </div>
                </div>
                <div className="text-center">
                    <h2 className="text-xs sm:text-sm font-black text-[#D4AF37] italic uppercase animate-pulse px-2">{titulo}</h2>
                    {subTitulo && <p className="text-[9px] text-white/50 font-bold uppercase tracking-widest">{subTitulo}</p>}
                </div>
                <button onClick={acaoBotao} className={`${corBotao} font-black border border-white/10 px-4 py-1 rounded text-[10px] hover:bg-white/5 transition uppercase`}>
                    {textoBotao}
                </button>
            </header>
        );

        const BannerFrases = () => {
            const [index, setIndex] = React.useState(0);
            React.useEffect(() => {
                const interval = setInterval(() => setIndex((p) => (p + 1) % FRASES.length), 8000);
                return () => clearInterval(interval);
            }, []);
            return (
                <div className="w-full text-center py-2 bg-[#1a2f23] border-y border-[#83E509]/10">
                    <p className="text-[#83E509] italic text-[11px] font-bold animate-pulse uppercase tracking-wider">{FRASES[index]}</p>
                </div>
            );
        };

        function App() {
            const [status, setStatus] = useState('login');
            const [user, setUser] = useState(null);
            const [matricula, setMatricula] = useState('');
            const [escolaSel, setEscolaSel] = useState(null);

            const formatar = (t) => t.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\s+/g, "_");

            const handleLogin = (e) => {
                if(e) e.preventDefault();
                const m = matricula.toLowerCase().trim();
                const aluno = ALUNOS_DB.find(a => a.m === m);
                if (m === 'esp0815') { setUser({p: "COMANDANTE IVESPE"}); setStatus('qg'); }
                else if (m === 'militar') { setUser({p: "INSTRUTOR"}); setStatus('qg'); }
                else if (aluno) { setUser(aluno); setStatus('qg'); }
                else { alert("MATRÍCULA NÃO ENCONTRADA!"); }
            };

            if (status === 'login') return (
                <div className="min-h-screen flex items-center justify-center militar-gradient p-4">
                    <div className="max-w-sm w-full bg-black/60 p-10 rounded-[40px] border border-white/5 text-center backdrop-blur-md shadow-2xl">
                        <video className="w-32 h-32 mx-auto rounded-full mb-8 border-2 border-[#D4AF37] object-cover" autoPlay loop muted playsInline>
                            <source src={`${BASE_URL}/video/logo_bizu2.mp4`} type="video/mp4" />
                        </video>
                        <h2 className="text-[#D4AF37] font-black italic mb-6 tracking-widest uppercase">Acesso Restrito</h2>
                        <form onSubmit={handleLogin} className="space-y-4">
                            <input type="text" value={matricula} onChange={(e) => setMatricula(e.target.value)}
                                className="w-full p-4 bg-white/5 border border-white/10 rounded-2xl text-white text-center text-xl outline-none focus:border-[#83E509] transition-all" 
                                placeholder="MATRÍCULA" />
                            <button type="submit" className="w-full py-4 rounded-2xl btn-ouro text-sm">Autenticar Agora</button>
                        </form>
                    </div>
                </div>
            );

            if (status === 'qg') return (
                <div className="min-h-screen">
                    <HeaderPadrao titulo={`BEM-VINDO(A) GUERREIRO(A) ${user?.p}!`} acaoBotao={() => setStatus('login')} textoBotao="Sair" />
                    <BannerFrases />
                    <main className="p-6 max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-4 gap-8">
                        <div className="lg:col-span-3 grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
                            {Object.entries(CONFIG_ESCOLAS).map(([nome, d]) => (
                                <button key={nome} onClick={() => { setEscolaSel(nome); setStatus('menu_escola'); }}
                                    className="relative h-44 rounded-3xl overflow-hidden group border border-white/5 hover:border-[#83E509] transition-all shadow-xl">
                                    <div className="absolute inset-0 bg-center bg-cover transition-transform duration-700 group-hover:scale-110" 
                                         style={{ backgroundImage: `url(${BASE_URL}/jpg/${d.slug}.jpg)` }}>
                                        <div className="absolute inset-0 bg-black/60 group-hover:bg-black/30 transition-all"></div>
                                    </div>
                                    <span className="relative z-10 text-xl font-black italic text-[#D4AF37] uppercase drop-shadow-lg">{nome}</span>
                                </button>
                            ))}
                        </div>
                        <aside className="bg-[#0f172a] rounded-[32px] p-6 border border-white/5 shadow-2xl h-[550px] flex flex-col">
                            <h3 className="text-[#83E509] font-black text-center mb-6 uppercase text-xs tracking-tighter border-b border-[#1a2f23] pb-4">Top Pelotão (Ranking)</h3>
                            <div className="flex-1 overflow-y-auto custom-scroll pr-2 space-y-3">
                                {ALUNOS_DB.sort((a,b) => b.pts - a.pts).map((a, i) => (
                                    <div key={i} className="flex justify-between items-center p-3 bg-white/5 rounded-xl text-[10px] border-l-2 border-[#D4AF37] hover:bg-white/10 transition-all">
                                        <span className="font-bold text-gray-300 uppercase">{i+1}º {a.p}</span>
                                        <span className="text-[#83E509] font-black">{a.pts} PTS</span>
                                    </div>
                                ))}
                            </div>
                        </aside>
                    </main>
                </div>
            );

            if (status === 'menu_escola') return (
                <div className="min-h-screen">
                    <HeaderPadrao titulo={escolaSel} subTitulo="SELECIONE O MÓDULO DE TREINAMENTO" acaoBotao={() => setStatus('qg')} textoBotao="Voltar ao QG" corBotao="text-[#D4AF37]" />
                    <main className="p-8 max-w-5xl mx-auto">
                        <div className="flex flex-wrap justify-center gap-4 mb-12">
                            <button onClick={() => window.open(`${BASE_URL}/pdf/edital_${CONFIG_ESCOLAS[escolaSel].slug.replace('1','')}.pdf`)} className="px-8 py-2 bg-yellow-600/10 border border-yellow-500/50 text-yellow-500 rounded-lg hover:bg-yellow-500 hover:text-black transition-all font-black text-xs">📜 EDITAIS</button>
                            <button onClick={() => window.open(`${BASE_URL}/pdf/provas_${CONFIG_ESCOLAS[escolaSel].slug.replace('1','')}.pdf`)} className="px-8 py-2 bg-green-600/10 border border-green-500/50 text-green-500 rounded-lg hover:bg-green-500 hover:text-black transition-all font-black text-xs">📝 PROVAS</button>
                            <button onClick={() => window.open(`${BASE_URL}/pdf/gabaritos_${CONFIG_ESCOLAS[escolaSel].slug.replace('1','')}.pdf`)} className="px-8 py-2 bg-blue-600/10 border border-blue-500/50 text-blue-500 rounded-lg hover:bg-blue-500 hover:text-black transition-all font-black text-xs">✅ GABARITOS</button>
                        </div>
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-8">
                            <button onClick={() => alert("Simulados em manutenção")} className="card-menu p-10 rounded-[40px] text-center">
                                <span className="block text-4xl mb-4">📝</span>
                                <span className="block font-black text-[#83E509] text-sm uppercase">Simulados</span>
                            </button>
                            <button onClick={() => setStatus('materiais')} className="card-menu p-10 rounded-[40px] text-center">
                                <span className="block text-4xl mb-4">📚</span>
                                <span className="block font-black text-[#D4AF37] text-sm uppercase">Biblioteca</span>
                            </button>
                            <button onClick={() => setStatus('videos')} className="card-menu p-10 rounded-[40px] text-center">
                                <span className="block text-4xl mb-4">🎬</span>
                                <span className="block font-black text-white text-sm uppercase">Cine Fênix</span>
                            </button>
                        </div>
                    </main>
                </div>
            );

            if (status === 'materiais') return (
                <div className="min-h-screen">
                    <HeaderPadrao titulo={`BIBLIOTECA: ${escolaSel}`} acaoBotao={() => setStatus('menu_escola')} textoBotao="Recuar" corBotao="text-[#D4AF37]" />
                    <main className="p-8 max-w-7xl mx-auto grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8">
                        {CONFIG_ESCOLAS[escolaSel].materias.map((m) => (
                            <div key={m} className="bg-[#0f172a] border border-white/5 rounded-[32px] overflow-hidden group hover:border-[#83E509] transition-all flex flex-col">
                                <div className="capa-container">
                                    <img src={`${BASE_URL}/png/card_${formatar(m)}_${CONFIG_ESCOLAS[escolaSel].slug.replace('1','')}.png`} 
                                         className="capa-manual group-hover:scale-105"
                                         onError={(e) => e.target.src = "https://via.placeholder.com/300x450?text=EM+BREVE"} />
                                </div>
                                <div className="p-6 text-center bg-black/20">
                                    <h3 className="font-black text-[11px] mb-4 uppercase text-[#D4AF37] leading-tight h-8 flex items-center justify-center">{m}</h3>
                                    <button onClick={() => window.open(`${BASE_URL}/pdf/${formatar(m)}_${CONFIG_ESCOLAS[escolaSel].slug.replace('1','')}.pdf`)}
                                            className="w-full bg-[#83E509] text-black font-black py-3 rounded-2xl text-[10px] uppercase hover:bg-white transition-all">Estudar Agora</button>
                                </div>
                            </div>
                        ))}
                    </main>
                </div>
            );

            if (status === 'videos') return (
                <div className="min-h-screen">
                    <HeaderPadrao titulo="CINE FÊNIX" subTitulo="SALA DE INSTRUÇÃO EM VÍDEO" acaoBotao={() => setStatus('menu_escola')} textoBotao="Voltar" corBotao="text-[#D4AF37]" />
                    <main className="max-w-7xl mx-auto p-8 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                        {VIDEOS_DB.map((v, i) => (
                            <div key={i} className="bg-black/40 p-4 rounded-[32px] border border-white/5 hover:border-[#83E509] transition-all">
                                <div className="video-container mb-4 shadow-2xl">
                                    <iframe src={`https://www.youtube.com/embed/${v.id}`} allowFullScreen></iframe>
                                </div>
                                <h3 className="text-[#D4AF37] font-black text-center text-[10px] uppercase tracking-widest">{v.t}</h3>
                            </div>
                        ))}
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
