<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIZÚ MILITAR FÊNIX - PLATAFORMA DE ELITE</title>

    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --azul-marinho: #050505; --dourado: #D4AF37; --laranja: #ea580c; }
        body { background-color: var(--azul-marinho); color: white; margin: 0; font-family: 'Segoe UI', sans-serif; overflow-x: hidden; }
        .militar-gradient { background: radial-gradient(circle at top, #1e293b 0%, #050505 100%); min-height: 100vh; }
        
        /* CORREÇÃO DA LOGO ACHATADA */
        .motion-header { 
            height: 70px; 
            width: 70px; 
            aspect-ratio: 1/1; /* Garante que seja sempre quadrado antes do circle */
            object-fit: cover; 
            border-radius: 50%; 
            border: 2px solid #D4AF37;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.5);
        }

        .btn-ouro { background: var(--dourado); color: black; font-weight: 900; transition: 0.3s; border: none; cursor: pointer; }
        .btn-ouro:hover { transform: scale(1.05); box-shadow: 0 0 20px rgba(212, 175, 55, 0.4); }
        
        .card-operacional { background: #0f172a; border: 1px solid rgba(255,255,255,0.05); transition: 0.3s; }
        .card-operacional:hover { border-color: var(--laranja); }
        
        .custom-scroll::-webkit-scrollbar { width: 5px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: var(--laranja); border-radius: 10px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const BASE_URL = "https://ivespe-cpu.github.io/bizu-militar-fenix";

        // BANCO DE DADOS DA EQUIPE (Sua matrícula entra aqui)
        const EQUIPE_COMANDO = [
            { m: "admin10", p: "CMT. IVESPE", cargo: "COMANDANTE", pts: 9999 },
            { m: "instrutor01", p: "INSTRUTOR ALFA", cargo: "INSTRUTOR", pts: 5000 }
        ];

        const ALUNOS_DB = [
            { m: "ags186", p: "SG.GASPARELLO", pts: 1500 }, { m: "alm170", p: "SG. MOURA", pts: 1450 },
            { m: "jpj110", p: "ASP. JOÃO SAMUEL", pts: 2000 }, { m: "jgm108", p: "SUB.TEN. MORAES", pts: 1950 }
            // ... demais alunos
        ];

        const CONFIG_ESCOLAS = {
            "COLÉGIO NAVAL": { slug: "cn", materias: ["MATEMÁTICA", "PORTUGUÊS", "INGLÊS"] },
            "EPCAR": { slug: "epcar", materias: ["MATEMÁTICA", "PORTUGUÊS"] },
            "CMRJ": { slug: "cmrj", materias: ["MATEMÁTICA", "PORTUGUÊS"] }
        };

        function App() {
            const [status, setStatus] = useState('login'); 
            const [user, setUser] = useState(null);
            const [matricula, setMatricula] = useState('');
            const [escolaSel, setEscolaSel] = useState(null);

            const handleLogin = (e) => {
                if(e) e.preventDefault();
                const m = matricula.toLowerCase().trim();
                
                // Busca primeiro na equipe de comando, depois nos alunos
                const comandant = EQUIPE_COMANDO.find(a => a.m === m);
                const aluno = ALUNOS_DB.find(a => a.m === m);

                if (comandant) {
                    setUser({...comandant, tipo: 'admin'});
                    setStatus('qg');
                } else if (aluno) {
                    setUser({...aluno, tipo: 'guerreiro', cargo: 'GUERREIRO(A)'});
                    setStatus('qg');
                } else {
                    alert("ACESSO NEGADO! Verifique sua matrícula.");
                }
            };

            // COMPONENTE DE HEADER GLOBAL
            const HeaderPlataforma = () => (
                <header className="bg-[#0f172a] border-b-4 border-orange-600 p-4 flex justify-between items-center shadow-2xl sticky top-0 z-50">
                    <div className="flex items-center gap-3">
                        <video className="motion-header" autoPlay loop muted playsInline>
                            <source src={`${BASE_URL}/video/logo_esquadrao.mp4`} type="video/mp4" />
                        </video>
                        <div>
                            <h1 className="font-black italic text-lg text-orange-500 leading-none">BIZÚ MILITAR</h1>
                            <p className="text-[10px] text-white tracking-widest uppercase">Esquadrão Fênix</p>
                        </div>
                    </div>

                    <div className="text-center hidden md:block">
                        <h2 className="text-xs font-black text-[#D4AF37] italic uppercase animate-pulse">
                            {user?.cargo}: {user?.p}
                        </h2>
                    </div>

                    <div className="flex gap-2">
                        {status !== 'qg' && (
                            <button onClick={() => setStatus('qg')} className="bg-white/10 px-3 py-1 rounded text-[10px] font-bold">VOLTAR</button>
                        )}
                        <button onClick={() => {setStatus('login'); setUser(null);}} className="text-red-500 font-bold border border-red-500/20 px-3 py-1 rounded text-[10px] hover:bg-red-500 hover:text-white transition">SAIR</button>
                    </div>
                </header>
            );

            // TELA DE LOGIN
            if (status === 'login') return (
                <div className="min-h-screen flex items-center justify-center p-4 militar-gradient">
                    <div className="max-w-md w-full bg-black/80 p-8 rounded-3xl border-2 border-orange-900/45 text-center shadow-2xl">
                        <video className="w-48 h-48 mx-auto rounded-full mb-6 border-2 border-orange-600 object-cover" autoPlay loop muted playsInline>
                            <source src={`${BASE_URL}/video/logo_bizu2.mp4`} type="video/mp4" />
                        </video>
                        <h2 className="text-xl font-black mb-6 italic text-orange-500 tracking-widest">AUTENTICAÇÃO QG</h2>
                        <form onSubmit={handleLogin}>
                            <input type="text" value={matricula} onChange={(e) => setMatricula(e.target.value)}
                                className="w-full p-4 mb-4 bg-white/5 border border-white/10 rounded-xl text-white text-center text-xl outline-none focus:border-orange-500 font-mono" 
                                placeholder="MATRÍCULA" 
                            />
                            <button type="submit" className="w-full py-4 rounded-xl btn-ouro text-lg">ACESSAR SISTEMA</button>
                        </form>
                    </div>
                </div>
            );

            // RENDERIZAÇÃO DAS TELAS PÓS-LOGIN
            return (
                <div className="min-h-screen">
                    <HeaderPlataforma />
                    
                    {status === 'qg' && (
                        <main className="p-6 max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-4 gap-8">
                            <div className="lg:col-span-3">
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    {Object.entries(CONFIG_ESCOLAS).map(([nome, d]) => (
                                        <button key={nome} onClick={() => { setEscolaSel(nome); setStatus('menu_escola'); }}
                                            className="relative h-48 rounded-3xl overflow-hidden group border-2 border-white/5 hover:border-orange-600 transition-all shadow-xl"
                                        >
                                            <div className="absolute inset-0 bg-center bg-cover" style={{ backgroundImage: `url(${BASE_URL}/jpg/${d.slug}.jpg)` }}>
                                                <div className="absolute inset-0 bg-black/60 group-hover:bg-black/30 transition-all"></div>
                                            </div>
                                            <span className="relative z-10 text-2xl font-black italic text-white tracking-widest">{nome}</span>
                                        </button>
                                    ))}
                                </div>
                            </div>
                            <div className="bg-[#0f172a] rounded-3xl p-6 border border-white/5 shadow-xl h-fit">
                                <h3 className="text-orange-500 font-black text-center mb-4 uppercase text-xs">Ranking de Elite</h3>
                                <div className="space-y-2">
                                    {ALUNOS_DB.sort((a,b) => b.pts - a.pts).slice(0,5).map((a, i) => (
                                        <div key={i} className="flex justify-between p-2 bg-white/5 rounded text-[10px]">
                                            <span>{i+1}º {a.p}</span>
                                            <span className="text-orange-500">{a.pts}</span>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </main>
                    )}

                    {status === 'menu_escola' && (
                        <main className="p-10 flex flex-col items-center">
                            <h2 className="text-3xl font-black mb-10 italic">{escolaSel}</h2>
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-6 w-full max-w-5xl">
                                <button className="p-10 bg-red-900/50 rounded-3xl border border-red-500 hover:bg-red-600 transition-all font-bold">SIMULADOS</button>
                                <button className="p-10 bg-blue-900/50 rounded-3xl border border-blue-500 hover:bg-blue-600 transition-all font-bold">APOSTILAS</button>
                                <button className="p-10 bg-orange-900/50 rounded-3xl border border-orange-500 hover:bg-orange-600 transition-all font-bold">VÍDEOS</button>
                            </div>
                        </main>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
