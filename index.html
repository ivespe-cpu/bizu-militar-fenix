<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIZÚ MILITAR FÊNIX - SISTEMA DE SIMULADOS</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --azul-marinho: #001233; --dourado-ouro: #D4AF37; --vermelho-tatico: #bc0000; }
        body { background-color: var(--azul-marinho); color: white; margin: 0; font-family: 'Segoe UI', sans-serif; }
        .militar-gradient { background: linear-gradient(135deg, #001233 0%, #000814 100%); }
        .linha-vermelha { height: 4px; background: repeating-linear-gradient(45deg, var(--vermelho-tatico), var(--vermelho-tatico) 10px, #7b0000 10px, #7b0000 20px); width: 100%; }
        
        /* ESTILO SIMULADOS */
        .card-simulado {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(212, 175, 55, 0.2);
            padding: 20px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: 0.3s;
            margin-bottom: 12px;
        }
        .card-simulado:hover {
            background: rgba(212, 175, 55, 0.1);
            border-color: var(--dourado-ouro);
            transform: translateX(10px);
        }
        .btn-iniciar {
            background: var(--dourado-ouro);
            color: black;
            font-weight: 900;
            padding: 8px 20px;
            border-radius: 4px;
            font-size: 11px;
            text-transform: uppercase;
        }
        .btn-aba {
            padding: 10px 20px;
            font-size: 10px;
            font-weight: 900;
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 4px;
        }
        .btn-aba.active { background: var(--dourado-ouro); color: black; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        const LOGO_FENIX = "https://i.ibb.co/Q31w6PLJ/logo-esquadrao.jpg";

        function App() {
            const [status, setStatus] = useState('qg'); // Iniciando no QG para teste
            const [escolaSel, setEscolaSel] = useState('');
            const [aba, setAba] = useState('APOSTILAS');

            // --- BANCO DE DADOS DE SIMULADOS ---
            const SIMULADOS_DATA = {
                'CN': [
                    { id: 1, nome: "SIMULADO 01 - MATEMÁTICA (PADRÃO CN)", questoes: 20, tempo: "120 min", link: "#" },
                    { id: 2, nome: "SIMULADO 02 - PORTUGUÊS E INGLÊS", questoes: 40, tempo: "180 min", link: "#" },
                    { id: 3, nome: "PROVA REAL CN 2024 - ADAPTADA", questoes: 50, tempo: "240 min", link: "#" }
                ],
                'CMRJ': [
                    { id: 1, nome: "SIMULADO ADMISSÃO 6º ANO - MATEMÁTICA", questoes: 20, tempo: "90 min", link: "#" },
                    { id: 2, nome: "SIMULADO ADMISSÃO 1º ANO - PORTUGUÊS", questoes: 25, tempo: "120 min", link: "#" },
                    { id: 3, nome: "DESAFIO REDAÇÃO CMRJ - TEMA DA SEMANA", questoes: 1, tempo: "60 min", link: "#" }
                ]
            };

            const renderSimulados = () => {
                const lista = SIMULADOS_DATA[escolaSel] || [];
                if (lista.length === 0) return <p className="opacity-40 italic mt-10">Nenhum simulado carregado para esta unidade ainda.</p>;

                return (
                    <div className="max-w-4xl mx-auto mt-8">
                        <div className="flex items-center gap-3 mb-8 border-l-4 border-ouro pl-4">
                            <h3 className="text-xl font-black text-ouro uppercase">Arsenal de Simulados: {escolaSel}</h3>
                        </div>
                        {lista.map(s => (
                            <div key={s.id} className="card-simulado">
                                <div>
                                    <h4 className="font-black text-sm uppercase tracking-tight">{s.nome}</h4>
                                    <p className="text-[10px] opacity-60 uppercase mt-1">{s.questoes} QUESTÕES • TEMPO: {s.tempo}</p>
                                </div>
                                <button className="btn-iniciar hover:bg-white transition-all" onClick={() => window.open(s.link)}>Iniciar Teste</button>
                            </div>
                        ))}
                    </div>
                );
            };

            if (status === 'qg') {
                return (
                    <div className="min-h-screen militar-gradient">
                        <header className="p-6 border-b-2 border-ouro flex justify-between items-center bg-[#000814]">
                            <img src={LOGO_FENIX} className="h-16" />
                            <h2 className="text-2xl font-black text-ouro italic">CENTRAL DE COMANDO</h2>
                            <div className="w-16"></div>
                        </header>
                        <main className="max-w-6xl mx-auto p-10">
                            <h3 className="text-center text-ouro font-black mb-10 tracking-widest uppercase">Selecione a Escola para Treinamento</h3>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                <button onClick={() => {setEscolaSel('CN'); setStatus('escola');}} className="p-12 border-2 border-ouro/30 rounded-xl bg-black/40 hover:border-ouro transition-all">
                                    <span className="text-4xl font-black text-ouro italic">COLÉGIO NAVAL</span>
                                </button>
                                <button onClick={() => {setEscolaSel('CMRJ'); setStatus('escola');}} className="p-12 border-2 border-ouro/30 rounded-xl bg-black/40 hover:border-ouro transition-all">
                                    <span className="text-4xl font-black text-ouro italic">CMRJ</span>
                                </button>
                            </div>
                        </main>
                    </div>
                );
            }

            return (
                <div className="min-h-screen militar-gradient">
                    <header className="p-6 border-b-2 border-ouro flex justify-between items-center bg-[#000814]">
                        <div className="flex items-center gap-4">
                            <img src={LOGO_FENIX} className="h-12" />
                            <span className="font-black text-ouro text-xl">{escolaSel}</span>
                        </div>
                        <button onClick={() => setStatus('qg')} className="bg-ouro text-black px-4 py-2 rounded font-black text-xs">VOLTAR AO QG</button>
                    </header>

                    <main className="max-w-6xl mx-auto p-10">
                        <div className="flex justify-center gap-4 mb-10">
                            {['APOSTILAS', 'VÍDEOS', 'SIMULADOS', 'PROVAS'].map(m => (
                                <button key={m} onClick={() => setAba(m)} className={`btn-aba ${aba === m ? 'active' : ''}`}>{m}</button>
                            ))}
                        </div>

                        {aba === 'SIMULADOS' ? renderSimulados() : (
                            <div className="text-center py-20 opacity-30 italic">
                                <p>Módulo {aba} em fase de carregamento...</p>
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
