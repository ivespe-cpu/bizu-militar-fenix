<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIZÚ MILITAR FÊNIX - ELITE</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --azul-marinho: #001233;
            --dourado-ouro: #D4AF37;
            --vermelho-tatico: #bc0000;
        }
        body { background-color: var(--azul-marinho); color: white; margin: 0; font-family: 'Segoe UI', sans-serif; }
        .militar-gradient { background: linear-gradient(135deg, #001233 0%, #000814 100%); }
        .text-ouro { color: var(--dourado-ouro); }
        .border-ouro { border: 2px solid var(--dourado-ouro); }
        
        .linha-vermelha { 
            height: 3px; 
            background: repeating-linear-gradient(45deg, var(--vermelho-tatico), var(--vermelho-tatico) 10px, #7b0000 10px, #7b0000 20px); 
        }

        /* EFEITO FOTO NO BOTÃO */
        .card-escola { 
            position: relative;
            height: 180px;
            overflow: hidden;
            border-radius: 15px;
            border-bottom: 5px solid var(--dourado-ouro);
            transition: 0.4s;
            display: flex;
            align-items: center;
            justify-content: center;
            background-size: cover;
            background-position: center;
        }
        .card-escola::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 18, 51, 0.75); /* Camada escura para ler o texto */
            transition: 0.3s;
        }
        .card-escola:hover::before {
            background: rgba(0, 18, 51, 0.4); /* Clareia ao passar o mouse */
        }
        .card-escola:hover { transform: scale(1.02); }
        
        .sigla-txt {
            position: relative;
            z-index: 10;
            font-size: 2.5rem;
            font-weight: 900;
            color: var(--dourado-ouro);
            text-shadow: 2px 2px 10px rgba(0,0,0,0.8);
            font-style: italic;
        }

        .capa-apostila {
            width: 100%; height: 280px; object-fit: cover;
            border-bottom: 2px solid var(--dourado-ouro);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        const LOGO_BIZU_MILITAR = "https://i.ibb.co/C3mFvXv/logo-bizu.png"; 
        const LOGO_ESQUADRAO_FENIX = "https://i.ibb.co/9H7W1V8/logo-fenix.png"; 

        function App() {
            const [status, setStatus] = useState('login'); 
            const [escolaSel, setEscolaSel] = useState('');

            const escolas = [
                { sigla: 'CN', nome: 'COLÉGIO NAVAL', img: 'https://images.unsplash.com/photo-1590490360182-c33d57733427?auto=format&fit=crop&q=80&w=500' },
                { sigla: 'CMRJ', nome: 'COLÉGIO MILITAR - RJ', img: 'https://upload.wikimedia.org/wikipedia/commons/thumb/5/5a/Col%C3%A9gio_Militar_do_Rio_de_Janeiro.jpg/500px-Col%C3%A9gio_Militar_do_Rio_de_Janeiro.jpg' },
                { sigla: 'EEAR', nome: 'EEAR', img: 'https://www2.fab.mil.br/eear/images/noticias/2023/06_JUNHO/23_eear/DSC_0137.jpg' },
                { sigla: 'EsPCEx', nome: 'EsPCEx', img: 'https://upload.wikimedia.org/wikipedia/commons/thumb/b/b3/Espcex-front.jpg/500px-Espcex-front.jpg' },
                { sigla: 'ESA', nome: 'ESA', img: 'https://www.eb.mil.br/documents/10138/10321350/ESA1.jpg/87029671-3310-85f2-9333-e18e3c509618?t=1559235002737' },
                { sigla: 'EXTRAS', nome: 'CONCURSOS', img: 'https://images.unsplash.com/photo-1524178232363-1fb2b075b655?auto=format&fit=crop&q=80&w=500' }
            ];

            const arsenal = [
                { mat: 'HISTÓRIA', img: 'https://i.ibb.co/tPbpMN1z/capa-historia.jpg' },
                { mat: 'INGLÊS', img: 'https://i.ibb.co/rRGhQGv8/capa-ingles.jpg' },
                { mat: 'MATEMÁTICA', img: 'https://i.ibb.co/MD42sWr9/capa-matematica.jpg' },
                { mat: 'PORTUGUÊS', img: 'https://i.ibb.co/tTJPWYsH/capa-portugues.jpg' },
                { mat: 'QUÍMICA', img: 'https://i.ibb.co/gZ78ThkL/capa-quimica.jpg' },
                { mat: 'GEOGRAFIA', img: 'https://i.ibb.co/G4rdS7qT/capa-geografia.jpg' },
                { mat: 'BIOLOGIA', img: 'https://i.ibb.co/bgrXnP4z/capa-biologia.jpg' }
            ];

            if (status === 'login') {
                return (
                    <div className="min-h-screen flex items-center justify-center p-6 militar-gradient">
                        <div className="max-w-md w-full bg-black/60 p-10 rounded-2xl border-2 border-ouro text-center">
                            <img src={LOGO_BIZU_MILITAR} className="h-32 mx-auto mb-6" />
                            <div className="linha-vermelha mb-8"></div>
                            <div className="flex flex-col gap-4">
                                <input type="text" placeholder="MATRÍCULA" className="p-3 bg-white/5 border border-ouro/30 rounded text-white" />
                                <input type="password" placeholder="SENHA" className="p-3 bg-white/5 border border-ouro/30 rounded text-white" />
                                <button onClick={() => setStatus('qg')} className="bg-ouro text-black py-4 rounded font-black uppercase text-xs">Acessar</button>
                            </div>
                        </div>
                    </div>
                );
            }

            if (status === 'qg') {
                return (
                    <div className="min-h-screen">
                        <header className="bg-[#000814] border-b-2 border-ouro p-4 flex justify-between items-center px-8">
                            <img src={LOGO_ESQUADRAO_FENIX} className="h-12" />
                            <span className="font-black italic text-xl text-ouro">CENTRAL DE COMANDO</span>
                            <div className="text-right text-xs">Comandante Eufrásio</div>
                        </header>
                        
                        <main className="max-w-6xl mx-auto p-10">
                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 mb-16">
                                {escolas.map(e => (
                                    <button key={e.sigla} onClick={() => {setEscolaSel(e.sigla); setStatus('escola');}} 
                                            className="card-escola" style={{backgroundImage: `url(${e.img})`}}>
                                        <span className="sigla-txt">{e.sigla}</span>
                                        <span className="absolute bottom-2 z-10 text-[9px] font-black tracking-[0.2em] text-white opacity-80">{e.nome}</span>
                                    </button>
                                ))}
                            </div>
                            <div className="linha-vermelha mb-6"></div>
                            <div className="text-center italic text-slate-400 font-serif">
                                <p>"O treinamento difícil torna o combate bem mais fácil"</p>
                            </div>
                        </main>
                    </div>
                );
            }

            return (
                <div className="min-h-screen militar-gradient">
                    <header className="bg-[#000814] border-b-2 border-ouro p-4 flex justify-between items-center px-8">
                        <div className="flex items-center gap-4">
                            <img src={LOGO_ESQUADRAO_FENIX} className="h-10" />
                            <span className="font-black text-ouro uppercase">{escolaSel}</span>
                        </div>
                        <button onClick={() => setStatus('qg')} className="border border-ouro/30 px-4 py-2 rounded text-[10px] font-black">VOLTAR</button>
                    </header>

                    <main className="max-w-7xl mx-auto p-10">
                        <div className="grid grid-cols-4 md:grid-cols-8 gap-2 mb-10">
                            {['APOSTILAS', 'VÍDEOS', 'MOTIVAÇÃO', 'INSTITUC.', 'SIMULADOS', 'PROVAS', 'EDITAIS', 'GABARITOS'].map(m => (
                                <button key={m} className="bg-white/5 border border-ouro/20 p-2 rounded text-[8px] font-black hover:bg-ouro hover:text-black transition-all">{m}</button>
                            ))}
                        </div>

                        <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-6">
                            {arsenal.map((item, idx) => (
                                <div key={idx} className="bg-black/40 border border-ouro/20 rounded-lg overflow-hidden group shadow-xl">
                                    <img src={item.img} className="capa-apostila" />
                                    <div className="p-4 text-center">
                                        <h4 className="font-black text-[10px] text-ouro mb-3">{item.mat}</h4>
                                        <button className="w-full bg-ouro text-black font-black py-2 rounded text-[9px]">ACESSAR</button>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
