<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIZÚ MILITAR FÊNIX - PLATAFORMA DE ELITE</title>
    
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        :root { --azul-marinho: #050505; --dourado: #D4AF37; --laranja: #ea580c; }
        body { background-color: var(--azul-marinho); color: white; margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .militar-gradient { background: radial-gradient(circle at top, #1e293b 0%, #050505 100%); min-height: 100vh; }
        .btn-ouro { background: var(--dourado); color: black; font-weight: 900; transition: 0.3s; }
        .btn-ouro:hover { transform: scale(1.05); box-shadow: 0 0 20px rgba(212, 175, 55, 0.4); }
        .card-shadow { box-shadow: 0 0 15px rgba(234, 88, 12, 0.1); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;
        
        // ENDEREÇO DA SUA OPERAÇÃO NO GITHUB
        const BASE_URL = "https://ivespe-cpu.github.io/bizu-militar-fenix";

        const CONFIG_ESCOLAS = {
            "COLÉGIO NAVAL": { slug: "cn", materias: ["MATEMÁTICA", "PORTUGUÊS", "INGLÊS", "HISTÓRIA", "GEOGRAFIA", "FÍSICA", "QUÍMICA", "BIOLOGIA"] },
            "CMRJ": { slug: "cmrj", materias: ["MATEMÁTICA", "PORTUGUÊS"] },
            "EPCAR": { slug: "epcar", materias: ["MATEMÁTICA", "PORTUGUÊS", "INGLÊS"] },
            "EsPCEX": { slug: "espcex", materias: ["MATEMÁTICA", "PORTUGUÊS", "INGLÊS", "HISTÓRIA", "GEOGRAFIA", "FÍSICA", "QUÍMICA"] },
            "EEAR": { slug: "eear", materias: ["MATEMÁTICA", "PORTUGUÊS", "INGLÊS", "FÍSICA"] },
            "ESA": { slug: "esa", materias: ["MATEMÁTICA", "PORTUGUÊS", "INGLÊS", "HISTÓRIA", "GEOGRAFIA"] }
        };

        const ALUNOS_DB = [
            { m: "esp0815", p: "COMANDANTE", pts: "∞" },
            { m: "alm170", p: "SG. MOURA", pts: 1450 },
            { m: "jgm108", p: "SUB.TEN. MORAES", pts: 1950 },
            { m: "gfa109", p: "SUB.TEN. ARAUJO", pts: 1900 }
        ];

        function App() {
            const [status, setStatus] = useState('login'); 
            const [user, setUser] = useState(null);
            const [matricula, setMatricula] = useState('');
            const [escolaSel, setEscolaSel] = useState(null);

            const formatarMateria = (m) => m.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");

            const handleLogin = (e) => {
                if(e) e.preventDefault();
                const m = matricula.toLowerCase().trim();
                const aluno = ALUNOS_DB.find(a => a.m === m);
                if (aluno) {
                    setUser(aluno);
                    setStatus('qg');
                } else {
                    alert("MATRÍCULA NÃO ENCONTRADA NO PELOTÃO!");
                }
            };

            if (status === 'login') return (
                <div className="min-h-screen flex items-center justify-center p-4 militar-gradient">
                    <div className="max-w-md w-full bg-black/80 p-8 rounded-3xl border-2 border-orange-600/30 shadow-2xl text-center">
                        <video className="w-full rounded-2xl mb-6 border border-orange-600/20" autoPlay loop muted playsInline>
                            <source src={`${BASE_URL}/video/logo_bizu2.mp4`} type="video/mp4" />
                        </video>
                        <form onSubmit={handleLogin}>
                            <input 
                                type="text" 
                                value={matricula} 
                                onChange={(e) => setMatricula(e.target.value)}
                                className="w-full p-4 mb-4 bg-white/5 border border-white/10 rounded-xl text-white text-center text-xl outline-none focus:border-orange-600" 
                                placeholder="DIGITE SUA MATRÍCULA" 
                            />
                            <button type="submit" className="w-full py-4 rounded-xl btn-ouro text-lg">AUTENTICAR</button>
                        </form>
                    </div>
                </div>
            );

            if (status === 'qg') return (
                <div className="min-h-screen bg-[#050505]">
                    <header className="bg-[#0f172a] border-b-4 border-orange-600 p-5 flex items-center justify-between">
                        <h1 className="font-black italic text-xl text-orange-500">QG BIZÚ MILITAR</h1>
                        <div className="text-right">
                            <p className="text-white font-bold text-xs">BEM-VINDO, {user?.p}</p>
                            <button onClick={() => setStatus('login')} className="text-red-500 text-[10px] font-black uppercase">Sair</button>
                        </div>
                    </header>

                    <main className="p-6 max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-4 gap-8">
                        <div className="lg:col-span-3 grid grid-cols-1 md:grid-cols-2 gap-6">
                            {Object.entries(CONFIG_ESCOLAS).map(([nome, dados]) => (
                                <button 
                                    key={nome}
                                    onClick={() => { setEscolaSel(nome); setStatus('materiais'); }}
                                    className="relative h-48 rounded-3xl overflow-hidden group border-2 border-white/5 hover:border-orange-600 transition-all"
                                >
                                    <div className="absolute inset-0 bg-center bg-cover"
                                         style={{ backgroundImage: `url(${BASE_URL}/jpg/${dados.slug}.jpg)` }}>
                                        <div className="absolute inset-0 bg-black/60 group-hover:bg-black/40"></div>
                                    </div>
                                    <h2 className="relative z-10 text-2xl font-black text-white italic">{nome}</h2>
                                </button>
                            ))}
                        </div>
                        <div className="bg-[#0f172a] rounded-3xl p-6 h-fit border border-white/5">
                            <h3 className="text-orange-500 font-black text-center mb-4 uppercase">Ranking</h3>
                            {ALUNOS_DB.map((a, i) => (
                                <div key={i} className="flex justify-between p-2 text-[10px] border-b border-white/5">
                                    <span>{a.p}</span>
                                    <span className="text-orange-400 font-bold">{a.pts}</span>
                                </div>
                            ))}
                        </div>
                    </main>
                </div>
            );

            if (status === 'materiais') {
                const escola = CONFIG_ESCOLAS[escolaSel];
                return (
                    <div className="min-h-screen bg-[#050505]">
                        <header className="bg-[#0f172a] border-b-4 border-orange-600 p-5 flex items-center justify-between">
                            <h1 className="font-black italic text-orange-500 uppercase">{escolaSel}</h1>
                            <button onClick={() => setStatus('qg')} className="bg-white text-black px-4 py-1 rounded font-bold">VOLTAR</button>
                        </header>
                        <main className="p-8 max-w-7xl mx-auto">
                            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                                {escola.materias.map((materia) => (
                                    <div key={materia} className="bg-[#0f172a] rounded-3xl overflow-hidden border border-white/5 card-shadow transition-all hover:scale-105">
                                        <div className="h-48 bg-black">
                                            <img 
                                                src={`${BASE_URL}/png/card_${formatarMateria(materia)}_${escola.slug}.png`} 
                                                className="w-full h-full object-contain"
                                                alt={materia}
                                                onError={(e) => { e.target.src = "https://via.placeholder.com/300x400?text=CAPA+EM+BREVE"; }}
                                            />
                                        </div>
                                        <div className="p-4">
                                            <button 
                                                onClick={() => window.open(`${BASE_URL}/pdf/${formatarMateria(materia)}_${escola.slug}.pdf`, '_blank')}
                                                className="w-full bg-orange-600 text-black font-black py-2 rounded-xl text-sm"
                                            >
                                                LER APOSTILA
                                            </button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </main>
                    </div>
                );
            }
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
