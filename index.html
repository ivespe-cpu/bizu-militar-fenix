<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIZÚ MILITAR FÊNIX - V3.0 OPERACIONAL</title>
    
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        :root { --azul-marinho: #001233; --dourado-ouro: #D4AF37; --vermelho-tatico: #bc0000; }
        body { background-color: var(--azul-marinho); color: white; margin: 0; font-family: 'Segoe UI', sans-serif; overflow-x: hidden; }
        .militar-gradient { background: linear-gradient(135deg, #001233 0%, #000814 100%); min-height: 100vh; }
        .linha-vermelha { height: 4px; background: repeating-linear-gradient(45deg, var(--vermelho-tatico), var(--vermelho-tatico) 10px, #7b0000 10px, #7b0000 20px); width: 100%; }
        
        .btn-material { background-color: #D4AF37 !important; color: #000 !important; font-weight: 900 !important; text-transform: uppercase; padding: 12px; border-radius: 6px; transition: 0.3s; width: 100%; cursor: pointer; border: none; }
        .btn-material:hover { transform: scale(1.02); box-shadow: 0 0 15px rgba(212, 175, 55, 0.4); background-color: #fff !important; }
        
        .btn-voltar-fixo { background: #fff !important; color: #000 !important; font-weight: 900 !important; padding: 10px 20px !important; border: 3px solid #D4AF37 !important; text-transform: uppercase; cursor: pointer; border-radius: 4px; transition: 0.2s; }
        .btn-voltar-fixo:hover { background: #D4AF37 !important; color: #fff !important; }

        .card-escola { position: relative; height: 180px; border-radius: 12px; border-bottom: 4px solid #D4AF37; overflow: hidden; display: flex; align-items: center; justify-content: center; background-size: cover; background-position: center; cursor: pointer; transition: 0.4s; background-color: #000; }
        .card-escola::before { content: ""; position: absolute; inset: 0; background: rgba(0, 18, 51, 0.6); transition: 0.3s; }
        .card-escola:hover::before { background: rgba(0, 18, 51, 0.3); }
        
        .sigla-txt { position: relative; z-index: 10; font-size: 2.2rem; font-weight: 900; color: #D4AF37; font-style: italic; text-shadow: 2px 2px 10px black; }
        .frase-box { background: rgba(0,0,0,0.5); border-left: 4px solid var(--vermelho-tatico); padding: 20px; border-radius: 0 8px 8px 0; }
        
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #D4AF37; border-radius: 10px; }
        .video-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 8px; border: 1px solid rgba(212, 175, 55, 0.3); }
        .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const BASE_URL = "https://raw.githubusercontent.com/ivespe-cpu/bizufenix/main/";

        // CONFIGURAÇÕES E BANCO DE DADOS (Restaurados do seu código original)
        const CONFIG_ESCOLAS = {
            "COLÉGIO NAVAL": { materias: ["MATEMÁTICA", "PORTUGUÊS", "INGLÊS", "HISTÓRIA", "GEOGRAFIA", "FÍSICA", "QUÍMICA", "BIOLOGIA"], slug: "cn" },
            "EPCAR": { materias: ["MATEMÁTICA", "PORTUGUÊS", "INGLÊS", "REDAÇÃO"], slug: "epcar" },
            "CMRJ": { materias: ["MATEMÁTICA", "PORTUGUÊS", "REDAÇÃO", "MANUAL"], slug: "cmrj" },
            "EsPCEX": { materias: ["MATEMÁTICA", "PORTUGUÊS", "INGLÊS", "HISTÓRIA", "GEOGRAFIA", "FÍSICA", "QUÍMICA"], slug: "espcex" },
            "EEAR": { materias: ["MATEMÁTICA", "PORTUGUÊS", "INGLÊS", "FÍSICA"], slug: "eear" },
            "ESA": { materias: ["MATEMÁTICA", "PORTUGUÊS", "HISTÓRIA", "GEOGRAFIA", "INGLÊS"], slug: "esa" }
        };

        const ALUNOS_DB = [
            { m: "ags186", p: "SG.GASPARELLO", pts: 1500 }, { m: "alm170", p: "SG. MOURA", pts: 1450 },
            { m: "bsp223", p: "SD. PINHEIRO", pts: 1200 }, { m: "bab196", p: "CB. BRAYAN", pts: 1100 },
            { m: "jgm108", p: "SUB.TEN. MORAES", pts: 1950 }, { m: "jpj110", p: "ASP. JOÃO SAMUEL", pts: 2000 },
            { m: "vho129", p: "SG. VICTOR HUGO", pts: 1650 }, { m: "php105", p: "SUB.TEN. PAULO", pts: 1910 }
        ];

        const FRASES_COMANDO = [
            "A limitação está apenas na sua mente.",
            "Coragem não é não ter medo, e sim, seguir em frente.",
            "Grandes batalhas só são dadas a grandes guerreiros.",
            "Vencer na vida não é um destino, é a sua escolha.",
            "Os fortes agem, avançam e deixam um legado."
        ];

        const VIDEOS_DB = [
            { t: "FAB - EPCAR", id: "Vq_Z5KNmuks" }, { t: "MARINHA DO BRASIL", id: "zSSp5CQpg10" },
            { t: "INSTITUCIONAL", id: "H0Gssr6mZbw" }, { t: "MOTIVACIONAL", id: "Nc3WusSAIQI" }
        ];

        function App() {
            const [status, setStatus] = useState('login'); 
            const [user, setUser] = useState(null);
            const [senhaIn, setSenhaIn] = useState('');
            const [escolaSel, setEscolaSel] = useState('COLÉGIO NAVAL');
            const [fraseDia, setFraseDia] = useState('');
            const [pdfAtivo, setPdfAtivo] = useState(null);

            useEffect(() => {
                setFraseDia(FRASES_COMANDO[Math.floor(Math.random() * FRASES_COMANDO.length)]);
            }, [status]);

            const handleLogin = (e) => {
                if(e) e.preventDefault();
                const s = senhaIn.toLowerCase().trim();
                const aluno = ALUNOS_DB.find(a => a.m === s);
                if (s === "esp0815" || s === "admin") { setUser({ p: "COMANDANTE", pts: "∞" }); setStatus('qg'); } 
                else if (aluno) { setUser(aluno); setStatus('qg'); } 
                else { alert("ACESSO NEGADO! Verifique sua matrícula."); }
            };

            const getImgPath = (name, type="jpg") => {
                const clean = name.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\s+/g, '_');
                return `${BASE_URL}${clean}.${type}`;
            };

            const renderContent = () => {
                // TELA DE LOGIN
                if (status === 'login') return (
                    <div className="min-h-screen flex items-center justify-center p-6">
                        <div className="max-w-md w-full bg-black/80 p-8 rounded-2xl border-2 border-[#D4AF37]/30 shadow-2xl text-center">
                            <video className="w-full rounded mb-6 border border-[#D4AF37]/20" autoPlay loop muted playsInline>
                                <source src={BASE_URL + "bizu8.mp4"} type="video/mp4" />
                            </video>
                            <div className="linha-vermelha mb-8"></div>
                            <input type="password" value={senhaIn} onChange={(e) => setSenhaIn(e.target.value)}
                                className="w-full p-4 mb-4 bg-white/5 border border-[#D4AF37]/20 rounded text-white text-center text-xl font-mono focus:outline-none" placeholder="MATRÍCULA" />
                            <button onClick={handleLogin} className="btn-material">AUTENTICAR</button>
                        </div>
                    </div>
                );

                // QG PRINCIPAL (RANKING E FRASES VOLTARAM)
                if (status === 'qg') return (
                    <div className="min-h-screen">
                        <header className="bg-[#000814] border-b-2 border-[#D4AF37] p-4 flex items-center justify-between px-6 sticky top-0 z-50">
                            <h2 className="text-xl font-black text-[#D4AF37] italic">BEM-VINDO, {user?.p}</h2>
                            <button onClick={() => setStatus('login')} className="text-red-500 font-bold px-3 py-1 rounded border border-red-500/20">SAIR</button>
                        </header>
                        
                        <main className="max-w-7xl mx-auto p-6 grid grid-cols-1 lg:grid-cols-3 gap-8">
                            <div className="lg:col-span-2">
                                <div className="frase-box mb-8">
                                    <p className="text-[#D4AF37] text-xs font-black mb-2 tracking-widest">ORDEM DO DIA:</p>
                                    <p className="text-xl font-medium italic">"{fraseDia}"</p>
                                </div>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    {Object.keys(CONFIG_ESCOLAS).map(nome => (
                                        <div key={nome} onClick={() => {setEscolaSel(nome); setStatus('central');}} 
                                             className="card-escola" style={{backgroundImage: `url(${getImgPath(CONFIG_ESCOLAS[nome].slug)})`}}>
                                            <span className="sigla-txt">{nome}</span>
                                        </div>
                                    ))}
                                </div>
                            </div>
                            
                            {/* RANKING RESTAURADO */}
                            <div className="bg-black/40 p-5 rounded-xl border border-[#D4AF37]/20 h-fit">
                                <h3 className="text-[#D4AF37] font-black text-center mb-4 uppercase tracking-widest">Ranking Pelotão</h3>
                                <div className="space-y-2 max-h-[400px] overflow-y-auto custom-scroll">
                                    {ALUNOS_DB.sort((a,b) => b.pts - a.pts).map((a, i) => (
                                        <div key={i} className="flex justify-between p-3 bg-white/5 rounded text-[11px] border-l-4 border-[#D4AF37]">
                                            <span>{i+1}º {a.p}</span>
                                            <span className="text-[#D4AF37] font-black">{a.pts} PTS</span>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </main>
                    </div>
                );

                // CENTRAL DE INTELIGÊNCIA (MENU DE OPÇÕES)
                if (status === 'central') return (
                    <div className="min-h-screen flex flex-col items-center justify-center p-6 text-center">
                        <h1 className="text-3xl font-black text-[#D4AF37] mb-10 italic uppercase">CENTRAL DE INTELIGÊNCIA: {escolaSel}</h1>
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-8 w-full max-w-5xl">
                            <button onClick={() => setStatus('simulados')} className="bg-red-800/80 p-10 rounded-xl border-2 border-white/20 hover:scale-105 transition-all">
                                <span className="text-4xl">📝</span><br/><br/><strong>SIMULADOS</strong>
                            </button>
                            <button onClick={() => setStatus('materiais')} className="bg-blue-800/80 p-10 rounded-xl border-2 border-white/20 hover:scale-105 transition-all">
                                <span className="text-4xl">📚</span><br/><br/><strong>MATERIAIS</strong>
                            </button>
                            <button onClick={() => setStatus('videos')} className="bg-yellow-600/80 p-10 rounded-xl border-2 border-white/20 hover:scale-105 transition-all">
                                <span className="text-4xl">🎬</span><br/><br/><strong>CINE FÊNIX</strong>
                            </button>
                        </div>
                        <button onClick={() => setStatus('qg')} className="btn-voltar-fixo mt-12">VOLTAR AO QG</button>
                    </div>
                );

                // TELA DE MATERIAIS (APOSTILAS)
                if (status === 'materiais') return (
                    <div className="min-h-screen p-6">
                        <header className="flex justify-between items-center mb-10 border-b border-[#D4AF37] pb-4">
                            <h1 className="text-[#D4AF37] font-black text-2xl italic">{escolaSel} - MATERIAIS</h1>
                            <button onClick={() => setStatus('central')} className="btn-voltar-fixo">VOLTAR</button>
                        </header>
                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 max-w-7xl mx-auto">
                            {CONFIG_ESCOLAS[escolaSel].materias.map((mat, i) => (
                                <div key={i} className="bg-black/60 border border-[#D4AF37]/20 rounded-2xl overflow-hidden flex flex-col shadow-lg">
                                    <div className="h-[150px] bg-cover bg-center" style={{backgroundImage: `url(${getImgPath(mat, "png")})`, backgroundColor: '#111'}}>
                                    </div>
                                    <div className="p-4 text-center">
                                        <div className="text-[#D4AF37] font-black text-xs mb-3 uppercase">{mat}</div>
                                        <button onClick={() => setPdfAtivo({ url: `pdf/${mat.toLowerCase()}_${CONFIG_ESCOLAS[escolaSel].slug}.pdf`, nome: mat })} 
                                                className="btn-material text-[10px]">ESTUDAR</button>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                );

                // TELA DE VÍDEOS
                if (status === 'videos') return (
                    <div className="min-h-screen p-6">
                        <header className="flex justify-between items-center mb-10 border-b border-[#D4AF37] pb-4">
                            <h1 className="text-[#D4AF37] font-black text-2xl italic">CINE FÊNIX</h1>
                            <button onClick={() => setStatus('central')} className="btn-voltar-fixo">VOLTAR</button>
                        </header>
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-8 max-w-6xl mx-auto">
                            {VIDEOS_DB.map((v, i) => (
                                <div key={i} className="bg-black/40 p-4 rounded-xl border border-[#D4AF37]/20">
                                    <h3 className="text-[#D4AF37] font-bold mb-3 uppercase text-xs">{v.t}</h3>
                                    <div className="video-container">
                                        <iframe src={`https://www.youtube.com/embed/${v.id}`} allowFullScreen></iframe>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                );

                // TELA DE SIMULADOS
                if (status === 'simulados') return (
                    <div className="min-h-screen flex flex-col items-center justify-center p-10">
                        <h1 className="text-3xl font-black text-[#D4AF37] mb-6 italic">BANCO DE DADOS: SIMULADOS</h1>
                        <p className="bg-black/60 p-8 rounded border border-[#D4AF37]/30 text-xl">SISTEMA EM MANUTENÇÃO TÁTICA PARA CARREGAMENTO DE QUESTÕES.</p>
                        <button onClick={() => setStatus('central')} className="btn-voltar-fixo mt-10">VOLTAR</button>
                    </div>
                );
            };

            return (
                <div className="militar-gradient relative min-h-screen">
                    {renderContent()}
                    {pdfAtivo && (
                        <div className="fixed inset-0 z-[9999] bg-black flex flex-col p-4">
                            <div className="flex justify-between items-center mb-4">
                                <h2 className="text-[#D4AF37] font-black italic">{pdfAtivo.nome}</h2>
                                <button onClick={() => setPdfAtivo(null)} className="bg-red-600 px-6 py-2 rounded font-black text-white">FECHAR</button>
                            </div>
                            <iframe src={`https://docs.google.com/viewer?url=${encodeURIComponent(BASE_URL + pdfAtivo.url)}&embedded=true`} className="flex-1 w-full rounded border-0 bg-white" />
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
