<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIZÚ MILITAR FÊNIX - PLATAFORMA DE ELITE</title>

    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        :root { 
            --preto-operacional: #050505; 
            --verde-vibrante: #83E509; 
            --verde-musgo: #1a2f23;
            --dourado: #D4AF37; 
        }
        body { 
            background-color: var(--preto-operacional); 
            color: white; 
            margin: 0; 
            font-family: 'Segoe UI', sans-serif; 
            overflow-x: hidden;
        }
        
        /* Botão Dourado */
        .btn-ouro { 
            background: var(--dourado); 
            color: black; 
            font-weight: 900; 
            transition: 0.3s; 
            cursor: pointer; 
            border: none; 
        }
        .btn-ouro:hover { 
            transform: scale(1.05); 
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.4); 
        }
        
        .motion-header { 
            height: 60px; 
            width: 60px; 
            object-fit: cover; 
            border-radius: 50%; 
            border: 2px solid var(--dourado); 
        }

        /* Ajuste do Iframe do PDF */
        .leitor-pdf {
            width: 100%;
            height: 100%;
            border: none;
            background: white;
        }

        .capa-manual {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid #333;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const BASE_URL = "https://ivespe-cpu.github.io/bizu-militar-fenix";

        // --- BANCO DE DADOS ---
        const REPOSITORIO_PDFS = [
            "edital2020cn.pdf", "edital2021cn.pdf", "edital2022cn.pdf", "edital2023cn.pdf",
            "edital_cmrj.pdf", "gabarito2023cn.pdf", "gabarito2024cn.pdf", "gabarito2025cn.pdf",
            "prova2023cn_Port_Ciencias.pdf", "prova2023cn_mat_ingles.pdf",
            "prova2024cn_Port_Ciencias.pdf", "prova2024cn_mat_ingles.pdf",
            "prova2025cn_Port_Ciencias.pdf", "prova2025cn_mat_ingles.pdf"
        ];

        const CONFIG_ESCOLAS = {
            "COLÉGIO NAVAL": { slug: "cn", materias: ["MATEMÁTICA", "PORTUGUÊS", "INGLÊS", "HISTÓRIA", "GEOGRAFIA", "FÍSICA", "QUÍMICA", "BIOLOGIA"] },
            "EPCAR": { slug: "epcar", materias: ["MATEMÁTICA", "PORTUGUÊS", "INGLÊS"] },
            "CMRJ": { slug: "cmrj", materias: ["MATEMÁTICA", "PORTUGUÊS"] },
            "EsPCEX": { slug: "espcex", materias: ["MATEMÁTICA", "PORTUGUÊS", "INGLÊS", "HISTÓRIA", "GEOGRAFIA", "FÍSICA", "QUÍMICA"] },
            "EEAR": { slug: "eear1", materias: ["MATEMÁTICA", "PORTUGUÊS", "INGLÊS", "FÍSICA"] },
            "ESA": { slug: "esa", materias: ["MATEMÁTICA", "PORTUGUÊS", "INGLÊS", "HISTÓRIA", "GEOGRAFIA"] }
        };

        const ALUNOS_DB = [
            { m: "ags186", p: "SG.GASPARELLO" },
            { m: "gfa109", p: "SUB.TEN. ARAUJO" },
            { m: "jpj110", p: "ASP. JOÃO SAMUEL" },
            { m: "jgm108", p: "SUB.TEN. MORAES" }
        ];

        const FRASES = [
            "Coragem não é não ter medo, e sim, seguir em frente.",
            "Grandes batalhas só são dadas a grandes guerreiros.",
            "A limitação está apenas na sua mente."
        ];

        // --- COMPONENTES ---
        const HeaderPadrao = ({ titulo, acaoBotao, textoBotao, corBotao = "text-red-500" }) => (
            <header className="bg-[#0f172a] border-b-4 border-[#1a2f23] p-5 flex justify-between items-center sticky top-0 z-50">
                <div className="flex items-center gap-4">
                    <video className="motion-header" autoPlay loop muted playsInline>
                        <source src={`${BASE_URL}/video/logo_esquadrao.mp4`} type="video/mp4" />
                    </video>
                    <div className="hidden sm:block">
                        <h1 className="text-[#83E509] font-black italic uppercase leading-none text-lg">ESQUADRÃO FÊNIX</h1>
                        <p className="text-[10px] text-[#D4AF37] font-bold tracking-tighter">PRONTOS PARA O COMBATE</p>
                    </div>
                </div>
                <h2 className="text-sm font-black text-[#D4AF37] uppercase animate-pulse">{titulo}</h2>
                <button onClick={acaoBotao} className={`${corBotao} font-bold border border-white/10 px-4 py-1 rounded text-xs uppercase hover:bg-white/5`}>
                    {textoBotao}
                </button>
            </header>
        );

        const BannerFrases = () => {
            const [index, setIndex] = useState(0);
            useEffect(() => {
                const interval = setInterval(() => setIndex(prev => (prev + 1) % FRASES.length), 8000);
                return () => clearInterval(interval);
            }, []);
            return (
                <div className="w-full text-center py-2 bg-[#1a2f23] border-y border-[#83E509]/20 mb-4">
                    <p className="text-[#83E509] italic text-xs font-medium">{FRASES[index]}</p>
                </div>
            );
        };

        // --- APP PRINCIPAL ---
        function App() {
            const [status, setStatus] = useState('login');
            const [user, setUser] = useState(null);
            const [matricula, setMatricula] = useState('');
            const [escolaSel, setEscolaSel] = useState(null);
            const [tipoDoc, setTipoDoc] = useState('');
            const [pdfAtivo, setPdfAtivo] = useState(null);

            const formatar = (t) => t.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\s+/g, "_");

            const handleLogin = (e) => {
                if(e) e.preventDefault();
                const m = matricula.toLowerCase().trim();
                const aluno = ALUNOS_DB.find(a => a.m === m);

                if (m === 'esp0815' || m === 'militar') {
                    setUser({ p: m === 'militar' ? "INSTRUTOR" : "COMANDANTE IVESPE" });
                    setStatus('qg');
                } else if (aluno) {
                    setUser(aluno);
                    setStatus('qg');
                } else {
                    alert("MATRÍCULA NÃO ENCONTRADA!");
                }
            };

            // TELA: LOGIN
            if (status === 'login') return (
                <div className="min-h-screen flex items-center justify-center p-4">
                    <div className="max-w-md w-full bg-[#0f172a] p-8 rounded-3xl border-2 border-[#D4AF37]/20 text-center">
                        <video className="w-32 h-32 mx-auto rounded-full mb-6 border-2 border-[#D4AF37]" autoPlay loop muted playsInline>
                            <source src={`${BASE_URL}/video/logo_bizu2.mp4`} type="video/mp4" />
                        </video>
                        <h2 className="text-[#D4AF37] font-black mb-6 italic">ACESSO AO QG</h2>
                        <form onSubmit={handleLogin}>
                            <input type="text" value={matricula} onChange={(e) => setMatricula(e.target.value)}
                                className="w-full p-4 mb-4 bg-black border border-white/10 rounded-xl text-white text-center text-xl outline-none focus:border-[#D4AF37]" 
                                placeholder="MATRÍCULA" />
                            <button type="submit" className="w-full py-4 rounded-xl btn-ouro uppercase">Entrar em Formas</button>
                        </form>
                    </div>
                </div>
            );

            // TELA: QG
            if (status === 'qg') return (
                <div className="min-h-screen">
                    <HeaderPadrao titulo={`GUERREIRO: ${user?.p}`} acaoBotao={() => setStatus('login')} textoBotao="Sair" />
                    <BannerFrases />
                    <main className="p-4 max-w-6xl mx-auto grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
                        {Object.entries(CONFIG_ESCOLAS).map(([nome, d]) => (
                            <button key={nome} onClick={() => { setEscolaSel(nome); setStatus('menu_escola'); }}
                                className="relative h-44 rounded-2xl overflow-hidden group border border-white/5 hover:border-[#83E509] transition-all">
                                <div className="absolute inset-0 bg-center bg-cover" style={{ backgroundImage: `url(${BASE_URL}/jpg/${d.slug}.jpg)` }}>
                                    <div className="absolute inset-0 bg-black/60 group-hover:bg-black/30 transition-all"></div>
                                </div>
                                <span className="relative z-10 text-xl font-black italic text-[#D4AF37] uppercase">{nome}</span>
                            </button>
                        ))}
                    </main>
                </div>
            );

            // TELA: MENU DA ESCOLA
            if (status === 'menu_escola') return (
                <div className="min-h-screen">
                    <HeaderPadrao titulo={escolaSel} acaoBotao={() => setStatus('qg')} textoBotao="Voltar" corBotao="text-[#D4AF37]" />
                    <main className="p-8 max-w-4xl mx-auto text-center">
                        <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-12">
                            <button onClick={() => { setTipoDoc('EDITAL'); setStatus('documentos'); }} className="p-4 bg-yellow-600/10 border border-yellow-500/50 text-yellow-500 rounded-xl font-bold hover:bg-yellow-500 hover:text-black transition-all">📜 EDITAIS</button>
                            <button onClick={() => { setTipoDoc('PROVA'); setStatus('documentos'); }} className="p-4 bg-green-600/10 border border-green-500/50 text-green-500 rounded-xl font-bold hover:bg-green-500 hover:text-black transition-all">📝 PROVAS</button>
                            <button onClick={() => { setTipoDoc('GABARITO'); setStatus('documentos'); }} className="p-4 bg-blue-600/10 border border-blue-500/50 text-blue-500 rounded-xl font-bold hover:bg-blue-500 hover:text-black transition-all">✅ GABARITOS</button>
                        </div>
                        <div className="flex flex-col sm:flex-row justify-center gap-6">
                            <button onClick={() => alert("Simulados em manutenção")} className="flex-1 p-10 bg-[#0f172a] border-2 border-[#83E509]/30 rounded-3xl text-[#83E509] font-black hover:border-[#83E509]">SIMULADOS</button>
                            <button onClick={() => setStatus('materiais')} className="flex-1 p-10 bg-[#0f172a] border-2 border-[#D4AF37]/30 rounded-3xl text-[#D4AF37] font-black hover:border-[#D4AF37]">BIBLIOTECA</button>
                        </div>
                    </main>
                </div>
            );

            // TELA: LISTA DE DOCUMENTOS
            if (status === 'documentos') {
                const slug = CONFIG_ESCOLAS[escolaSel].slug.replace('1', '').toLowerCase();
                const listaFiltrada = REPOSITORIO_PDFS.filter(arq => 
                    arq.toLowerCase().includes(tipoDoc.toLowerCase()) && arq.toLowerCase().includes(slug)
                );
                return (
                    <div className="min-h-screen">
                        <HeaderPadrao titulo={`${tipoDoc}S - ${escolaSel}`} acaoBotao={() => setStatus('menu_escola')} textoBotao="Recuar" corBotao="text-white" />
                        <main className="max-w-3xl mx-auto p-6 space-y-3">
                            {listaFiltrada.length > 0 ? listaFiltrada.map((arq, idx) => (
                                <div key={idx} className="flex justify-between items-center p-4 bg-white/5 border-l-4 border-[#D4AF37] rounded-lg">
                                    <span className="text-xs font-bold uppercase text-gray-300">{arq.replace('.pdf', '').replace(/_/g, ' ')}</span>
                                    <button onClick={() => setPdfAtivo({ url: arq, nome: arq.toUpperCase() })}
                                        className="bg-[#D4AF37] text-black text-[10px] font-black px-6 py-2 rounded shadow-lg">VISUALIZAR</button>
                                </div>
                            )) : <p className="text-center text-white/30 py-10">Nenhum documento encontrado.</p>}
                        </main>

                        {pdfAtivo && (
                            <div className="fixed inset-0 z-[100] bg-black flex flex-col">
                                <div className="p-4 bg-[#000814] flex justify-between items-center border-b border-white/10">
                                    <span className="text-[#D4AF37] font-black text-xs uppercase">{pdfAtivo.nome}</span>
                                    <button onClick={() => setPdfAtivo(null)} className="bg-red-600 text-white px-6 py-1 rounded-full font-black text-xs">FECHAR</button>
                                </div>
                                <iframe 
                                    src={`https://docs.google.com/viewer?url=${encodeURIComponent(BASE_URL + "/pdf/" + pdfAtivo.url)}&embedded=true`} 
                                    className="flex-1 w-full bg-white" 
                                />
                            </div>
                        )}
                    </div>
                );
            }

            // TELA: BIBLIOTECA
            if (status === 'materiais') return (
                <div className="min-h-screen">
                    <HeaderPadrao titulo={`BIBLIOTECA: ${escolaSel}`} acaoBotao={() => setStatus('menu_escola')} textoBotao="Voltar" />
                    <main className="p-6 max-w-6xl mx-auto grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                        {CONFIG_ESCOLAS[escolaSel].materias.map((m) => (
                            <div key={m} className="bg-[#0f172a] border border-white/5 rounded-2xl p-4 text-center flex flex-col">
                                <div className="h-32 bg-black/40 rounded-lg mb-4 flex items-center justify-center">
                                    <span className="text-[#D4AF37] font-black text-4xl">PDF</span>
                                </div>
                                <h3 className="font-bold text-xs mb-4 text-gray-200 uppercase flex-1">{m}</h3>
                                <button onClick={() => window.open(`${BASE_URL}/pdf/${formatar(m)}_${CONFIG_ESCOLAS[escolaSel].slug.replace('1','')}.pdf`)} 
                                    className="w-full bg-[#83E509] text-black font-black py-2 rounded-lg text-[10px] uppercase">Abrir Material</button>
                            </div>
                        ))}
                    </main>
                </div>
            );

            return null;
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
