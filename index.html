<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIZÚ MILITAR FÊNIX - SISTEMA INTEGRADO</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --ouro: #D4AF37; --azul: #001233; }
        body { background: var(--azul); color: white; font-family: 'Segoe UI', sans-serif; margin: 0; }
        .militar-gradient { background: linear-gradient(135deg, #001233 0%, #000814 100%); }
        .linha-tática { height: 4px; background: repeating-linear-gradient(45deg, #bc0000, #bc0000 10px, #7b0000 10px, #7b0000 20px); }
        .glass { background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(212, 175, 55, 0.2); }
        .ranking-scroll { max-height: 400px; overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--ouro) transparent; }
        .card-missao { transition: 0.3s; cursor: pointer; border-bottom: 3px solid var(--ouro); }
        .card-missao:hover { transform: translateY(-5px); background: rgba(212, 175, 55, 0.1); }
        .video-bg { position: fixed; right: 0; bottom: 0; min-width: 100%; min-height: 100%; z-index: -1; object-fit: cover; opacity: 0.3; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        const BASE_GITHUB = "https://raw.githubusercontent.com/ivespe-cpu/bizufenix/main/";
        
        const ALUNOS_DB = [
            { m: "ags186", p: "SG.GASPARELLO", pts: 1500 }, { m: "alm170", p: "SG. MOURA", pts: 1450 },
            { m: "bsp223", p: "SD. PINHEIRO", pts: 1200 }, { m: "bab196", p: "CB. BRAYAN", pts: 1100 },
            { m: "bbs203", p: "SD. BERNARDO", pts: 900 }, { m: "cvs208", p: "CB. CAMILA", pts: 1050 },
            { m: "dva194", p: "CB. ALBUQUERQUE", pts: 1300 }, { m: "esp192", p: "SG. PEIXOTO", pts: 1250 },
            { m: "egc228", p: "CB. ENZO", pts: 850 }, { m: "gsp187", p: "SG. GABRIELLE PEREIRA", pts: 1400 },
            { m: "gac174", p: "SG. GABRIELLY COUTINHO", pts: 1350 }, { m: "gem240", p: "SD.MICAELA", pts: 950 },
            { m: "gfa109", p: "SUB.TEN. ARAUJO", pts: 1900 }, { m: "hls197", p: "CB. SALES", pts: 1150 },
            { m: "icg127", p: "SG. GRANADO", pts: 1600 }, { m: "iws159", p: "SG. LIMA", pts: 1550 },
            { m: "jgm108", p: "SUB.TEN. MORAES", pts: 1950 }, { m: "jpj110", p: "ASP. JOÃO SAMUEL", pts: 2000 },
            { m: "jva190", p: "SG. ANDRADE", pts: 1480 }, { m: "jhs198", p: "CB. JOSUÉ", pts: 1120 },
            { m: "jcm166", p: "SG. JUNIO", pts: 1420 }, { m: "kfs245", p: "CB. FONTES", pts: 1080 },
            { m: "lgb226", p: "CB. BELTRON", pts: 1190 }, { m: "lod225", p: "CB. FADINI", pts: 1170 },
            { m: "lse165", p: "SG. ELEUTHÉRIO", pts: 1510 }, { m: "lfs220", p: "CB. LUIZ FERNANDO", pts: 1030 },
            { m: "lmc184", p: "SG. COSTA", pts: 1800 }, { m: "mps144", p: "SG. PEÇANHA", pts: 1750 },
            { m: "mis133", p: "SG. IRENO", pts: 1320 }, { m: "nmp214", p: "CB. NATHAN", pts: 800 },
            { m: "nab161", p: "SG. NICOLLAS ARTHUR", pts: 1580 }, { m: "nvo148", p: "SG. NICOLY VICTORIA", pts: 1570 },
            { m: "php105", p: "SUB.TEN. PAULO", pts: 1910 }, { m: "pha219", p: "CB. PEDRO HENRIQUE", pts: 1180 },
            { m: "pho188", p: "SG. DE PAULA", pts: 1410 }, { m: "phm185", p: "SG. PEDRO RIBEIRO", pts: 1430 },
            { m: "phc232", p: "SD. PIETRO", pts: 920 }, { m: "rsb130", p: "SG. BARBOSA", pts: 1620 },
            { m: "scg216", p: "SD. SAMANTHA", pts: 940 }, { m: "tvo212", p: "SG. THAYANE", pts: 1390 },
            { m: "tgs164", p: "SG. GARCIA", pts: 1470 }, { m: "vho129", p: "SG. VICTOR HUGO", pts: 1650 }
        ];

        function App() {
            const [view, setView] = useState('login');
            const [user, setUser] = useState(null);
            const [modal, setModal] = useState(null);
            const [form, setForm] = useState({ mat: '', pass: '' });

            const handleLogin = () => {
                const aluno = ALUNOS_DB.find(a => a.m === form.mat.toLowerCase());
                if(aluno && form.pass === 'fenix123') {
                    setUser(aluno);
                    setView('home');
                } else { alert("Acesso Negado!"); }
            };

            if (view === 'login') return (
                <div className="min-h-screen flex items-center justify-center militar-gradient relative">
                    <video autoPlay muted loop className="video-bg">
                        <source src="https://assets.mixkit.co/videos/preview/mixkit-abstract-dark-blue-and-gold-background-32863-large.mp4" type="video/mp4" />
                    </video>
                    <div className="glass p-10 rounded-2xl border-2 border-ouro w-96 text-center">
                        <h1 className="text-ouro font-black text-2xl italic mb-6 uppercase tracking-tighter">Bizu Militar Fênix</h1>
                        <div className="linha-tática mb-6"></div>
                        <input onChange={e => setForm({...form, mat: e.target.value})} type="text" placeholder="MATRÍCULA" className="w-full p-3 mb-4 bg-white/10 rounded border border-ouro/30 outline-none" />
                        <input onChange={e => setForm({...form, pass: e.target.value})} type="password" placeholder="SENHA" className="w-full p-3 mb-6 bg-white/10 rounded border border-ouro/30 outline-none" />
                        <button onClick={handleLogin} className="w-full bg-ouro text-black font-black py-3 rounded hover:bg-white transition">Entrar no QG</button>
                    </div>
                </div>
            );

            return (
                <div className="min-h-screen militar-gradient">
                    <header className="glass p-6 flex justify-between items-center border-b-2 border-ouro sticky top-0 z-50">
                        <div>
                            <h2 className="text-ouro font-black italic uppercase text-lg">Grito de Guerra: {user?.p}</h2>
                            <p className="text-[10px] font-bold opacity-50 tracking-widest uppercase">Efetivo de Elite - {user?.pts} Pontos</p>
                        </div>
                        <button onClick={() => setView('login')} className="text-red-500 font-bold text-xs border border-red-500/30 px-3 py-1 rounded">DESLOGAR</button>
                    </header>

                    <main className="max-w-7xl mx-auto p-6">
                        {/* BOTÕES DAS ESCOLAS (AGORA FUNCIONANDO) */}
                        <div className="grid grid-cols-2 md:grid-cols-6 gap-4 mb-10">
                            {['CN', 'CMRJ', 'EEAR', 'EsPCEx', 'ESA', 'EPCAR'].map(escola => (
                                <div key={escola} onClick={() => setModal(escola)} className="card-missao glass p-6 text-center rounded-xl">
                                    <span className="text-ouro font-black text-xl italic">{escola}</span>
                                </div>
                            ))}
                        </div>

                        {/* CARROSSEL DE APOSTILAS (RESTURADO) */}
                        <div className="mb-10">
                            <h3 className="text-ouro font-black italic mb-4">📚 MATERIAL DIDÁTICO / APOSTILAS</h3>
                            <div className="flex gap-4 overflow-x-auto pb-4 scrollbar-hide">
                                {[1,2,3,4,5].map(i => (
                                    <div key={i} className="min-w-[180px] h-[250px] glass rounded-lg border border-ouro/20 flex flex-col items-center justify-center p-4">
                                        <div className="w-full h-40 bg-gray-800 rounded mb-2 flex items-center justify-center text-[10px] text-ouro font-black uppercase text-center">Capa Apostila {i}</div>
                                        <button className="text-[10px] bg-ouro text-black font-bold px-3 py-1 rounded">ABRIR PDF</button>
                                    </div>
                                ))}
                            </div>
                        </div>

                        {/* RANKING COMPLETO (42 ALUNOS) */}
                        <div className="glass rounded-xl p-6">
                            <h3 className="text-ouro font-black italic mb-4 flex justify-between">🏆 RANKING GERAL (ORDEM DE MÉRITO) <span className="text-[10px] opacity-40">TOTAL: 42 ALUNOS</span></h3>
                            <div className="ranking-scroll space-y-2">
                                {ALUNOS_DB.sort((a,b) => b.pts - a.pts).map((al, i) => (
                                    <div key={al.m} className={`flex justify-between items-center p-3 rounded border-l-4 ${al.m === user?.m ? 'bg-ouro/20 border-white' : 'bg-white/5 border-ouro/40'}`}>
                                        <div className="flex items-center gap-3">
                                            <span className="font-black opacity-30 w-6">#{i+1}</span>
                                            <span className="font-bold text-sm uppercase">{al.p}</span>
                                        </div>
                                        <span className="text-ouro font-bold">{al.pts} PTS</span>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </main>

                    {/* MODAL DE CONTEÚDO (PROVAS, GABARITOS, EDITAIS) */}
                    {modal && (
                        <div className="fixed inset-0 bg-black/95 z-[100] flex items-center justify-center p-4" onClick={() => setModal(null)}>
                            <div className="glass max-w-2xl w-full p-8 rounded-2xl border-2 border-ouro" onClick={e => e.stopPropagation()}>
                                <h2 className="text-ouro font-black text-3xl italic mb-8 text-center uppercase tracking-widest">{modal} - ARSENAL</h2>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <div className="space-y-3">
                                        <h4 className="text-ouro text-[10px] font-black uppercase tracking-widest border-b border-ouro/20 pb-1">📂 PROVAS ANTERIORES</h4>
                                        <button onClick={() => window.open(BASE_GITHUB+'prova2025CN-mat-ingles.pdf')} className="w-full text-left p-3 glass text-sm font-bold hover:bg-ouro/10">📄 PROVA 2025 (MAT/ING)</button>
                                        <button onClick={() => window.open(BASE_GITHUB+'prova2024CN-mat-ingles.pdf')} className="w-full text-left p-3 glass text-sm font-bold hover:bg-ouro/10">📄 PROVA 2024 (MAT/ING)</button>
                                    </div>
                                    <div className="space-y-3">
                                        <h4 className="text-ouro text-[10px] font-black uppercase tracking-widest border-b border-ouro/20 pb-1">📋 EDITAIS & GABARITOS</h4>
                                        <button onClick={() => window.open(BASE_GITHUB+'edital2023CN.pdf')} className="w-full text-left p-3 glass text-sm font-bold hover:bg-ouro/10 text-red-400">📜 EDITAL VIGENTE</button>
                                        <button className="w-full text-left p-3 glass text-sm font-bold hover:bg-ouro/10 opacity-50">📑 SIMULADOS (BLOQUEADO)</button>
                                    </div>
                                </div>
                                <button onClick={() => setModal(null)} className="w-full mt-10 py-3 text-red-500 font-black border border-red-500/20 rounded hover:bg-red-500/10">VOLTAR AO QG</button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
