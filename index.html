<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIZÚ MILITAR FÊNIX - SISTEMA ELITE</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --azul-marinho: #001233; --dourado-ouro: #D4AF37; --vermelho-tatico: #bc0000; }
        body { background-color: var(--azul-marinho); color: white; margin: 0; font-family: 'Segoe UI', sans-serif; overflow-x: hidden; }
        .militar-gradient { background: linear-gradient(135deg, #001233 0%, #000814 100%); }
        .linha-vermelha { height: 4px; background: repeating-linear-gradient(45deg, var(--vermelho-tatico), var(--vermelho-tatico) 10px, #7b0000 10px, #7b0000 20px); width: 100%; }
        .btn-combate { background-color: var(--dourado-ouro) !important; color: black !important; font-weight: 900; padding: 1.2rem; border-radius: 0.5rem; box-shadow: 0 0 20px rgba(212, 175, 55, 0.4); transition: 0.3s; width: 100%; text-transform: uppercase; cursor: pointer; border: none; }
        .card-escola { position: relative; height: 160px; border-radius: 12px; border-bottom: 4px solid var(--dourado-ouro); overflow: hidden; display: flex; align-items: center; justify-content: center; background-size: cover; background-position: center; transition: 0.4s; cursor: pointer; border: 1px solid rgba(212, 175, 55, 0.2); width: 100%; }
        .card-escola::before { content: ""; position: absolute; inset: 0; background: rgba(0, 18, 51, 0.7); }
        .card-escola:hover { transform: translateY(-5px); border-color: var(--dourado-ouro); }
        .sigla-txt { position: relative; z-index: 10; font-size: 2.2rem; font-weight: 900; color: var(--dourado-ouro); font-style: italic; text-shadow: 2px 2px 8px black; }
        .btn-voltar { background: white !important; color: black !important; font-weight: 900; padding: 10px 20px; border-radius: 4px; border: 2px solid var(--dourado-ouro); cursor: pointer; }
        .modal-overlay { background: rgba(0,0,0,0.95); position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .doc-link { background: rgba(255,255,255,0.05); border: 1px solid rgba(212, 175, 55, 0.3); padding: 12px; border-radius: 8px; width: 100%; text-align: left; font-weight: bold; margin-bottom: 8px; display: block; color: white; cursor: pointer; }
        .doc-link:hover { background: var(--dourado-ouro); color: black; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        const LOGO_BIZU = "https://i.ibb.co/BKLSQKT1/logo-bizu.jpg";
        const LOGO_FENIX = "https://i.ibb.co/Q31w6PLJ/logo-esquadrao.jpg";
        const BASE_GITHUB = "https://raw.githubusercontent.com/ivespe-cpu/bizufenix/main/";

        const ALUNOS_DB = [
            { m: "ags186", p: "SG.GASPARELLO", pts: 1500 }, { m: "alm170", p: "SG. MOURA", pts: 1450 },
            { m: "bsp223", p: "SD. PINHEIRO", pts: 1200 }, { m: "bab196", p: "CB. BRAYAN", pts: 1100 },
            { m: "bbs203", p: "SD. BERNARDO", pts: 900 }, { m: "cvs208", p: "CB. CAMILA", pts: 1050 },
            { m: "dva194", p: "CB. ALBUQUERQUE", pts: 1300 }, { m: "esp192", p: "SG. PEIXOTO", pts: 1250 },
            { m: "egc228", p: "CB. ENZO", pts: 850 }, { m: "gsp187", p: "SG. GABRIELLE PEREIRA", pts: 1400 },
            { m: "gac174", p: "SG. GABRIELLY COUTINHO", pts: 1350 }, { m: "gem240", p: "SD.MICAELA", pts: 950 },
            { m: "gfa109", p: "SUB.TEN. ARAUJO", pts: 1900 }, { m: "hls197", p: "CB. SALES", pts: 1150 },
            { m: "icg127", p: "SG. GRANADO", pts: 1600 }, { m: "iws159", p: "SG. LIMA", pts: 1550 },
            { m: "jgm108", p: "SUB.TEN. MORAES", pts: 1950 }, { m: "jpj110", p: "ASP. JOÃO SAMUEL", pts: 2000 },
            { m: "jva190", p: "SG. ANDRADE", pts: 1480 }, { m: "jhs198", p: "CB. JOSUÉ", pts: 1120 },
            { m: "jcm166", p: "SG. JUNIO", pts: 1420 }, { m: "kfs245", p: "CB. FONTES", pts: 1080 },
            { m: "lgb226", p: "CB. BELTRON", pts: 1190 }, { m: "lod225", p: "CB. FADINI", pts: 1170 },
            { m: "lse165", p: "SG. ELEUTHÉRIO", pts: 1510 }, { m: "lfs220", p: "CB. LUIZ FERNANDO", pts: 1030 },
            { m: "lmc184", p: "SG. COSTA", pts: 1800 }, { m: "mps144", p: "SG. PEÇANHA", pts: 1750 },
            { m: "mis133", p: "SG. IRENO", pts: 1320 }, { m: "nmp214", p: "CB. NATHAN", pts: 800 },
            { m: "nab161", p: "SG. NICOLLAS ARTHUR", pts: 1580 }, { m: "nvo148", p: "SG. NICOLY VICTORIA", pts: 1570 },
            { m: "php105", p: "SUB.TEN. PAULO", pts: 1910 }, { m: "pha219", p: "CB. PEDRO HENRIQUE", pts: 1180 },
            { m: "pho188", p: "SG. DE PAULA", pts: 1410 }, { m: "phm185", p: "SG. PEDRO RIBEIRO", pts: 1430 },
            { m: "phc232", p: "SD. PIETRO", pts: 920 }, { m: "rsb130", p: "SG. BARBOSA", pts: 1620 },
            { m: "scg216", p: "SD. SAMANTHA", pts: 940 }, { m: "tvo212", p: "SG. THAYANE", pts: 1390 },
            { m: "tgs164", p: "SG. GARCIA", pts: 1470 }, { m: "vho129", p: "SG. VICTOR HUGO", pts: 1650 }
        ];

        const ESCOLAS = [
            { s: 'CN', n: 'COLÉGIO NAVAL', bg: 'https://images.unsplash.com/photo-1590490360182-c33d57733427?w=400' },
            { s: 'CMRJ', n: 'COLÉGIO MILITAR - RJ', bg: 'https://upload.wikimedia.org/wikipedia/commons/thumb/5/5a/Col%C3%A9gio_Militar_do_Rio_de_Janeiro.jpg/400px-Col%C3%A9gio_Militar_do_Rio_de_Janeiro.jpg' },
            { s: 'EEAR', n: 'EEAR', bg: 'https://www2.fab.mil.br/eear/images/noticias/2023/06_JUNHO/23_eear/DSC_0137.jpg' },
            { s: 'EsPCEx', n: 'EsPCEx', bg: 'https://upload.wikimedia.org/wikipedia/commons/thumb/b/b3/Espcex-front.jpg/400px-Espcex-front.jpg' },
            { s: 'ESA', n: 'ESA', bg: 'https://www.eb.mil.br/documents/10138/10321350/ESA1.jpg/400px-ESA1.jpg' },
            { s: 'EXTRAS', n: 'CONCURSOS', bg: 'https://images.unsplash.com/photo-1524178232363-1fb2b075b655?w=400' }
        ];

        const MATERIAIS = [
            { t: "MATEMÁTICA", f: "matematica.png" }, { t: "PORTUGUÊS", f: "portugues.png" },
            { t: "INGLÊS", f: "ingles.png" }, { t: "HISTÓRIA", f: "historia.png" },
            { t: "GEOGRAFIA", f: "geografia.png" }, { t: "FÍSICA", f: "fisica.png" },
            { t: "QUÍMICA", f: "quimica.png" }, { t: "BIOLOGIA", f: "biologia.png" }
        ];

        function App() {
            const [status, setStatus] = useState('login');
            const [escolaSel, setEscolaSel] = useState('');
            const [modal, setModal] = useState(null);

            const abrirDoc = (file) => window.open(BASE_GITHUB + file, '_blank');

            if (status === 'login') return (
                <div className="min-h-screen flex items-center justify-center p-6 militar-gradient">
                    <div className="max-w-md w-full bg-black/70 p-10 rounded-2xl border-2 border-[#D4AF37]/50 shadow-2xl text-center">
                        <img src={LOGO_BIZU} className="h-24 mx-auto mb-6 rounded-lg" />
                        <div className="linha-vermelha mb-8"></div>
                        <div className="space-y-4 text-left">
                            <label className="text-[10px] font-black text-[#D4AF37] uppercase tracking-widest block">Matrícula</label>
                            <input type="text" placeholder="Insira sua matrícula" className="w-full p-4 bg-white/5 border border-[#D4AF37]/20 rounded text-white outline-none focus:border-[#D4AF37]" />
                            <label className="text-[10px] font-black text-[#D4AF37] uppercase tracking-widest block">Senha</label>
                            <input type="password" placeholder="******" className="w-full p-4 bg-white/5 border border-[#D4AF37]/20 rounded text-white outline-none focus:border-[#D4AF37]" />
                            <button onClick={() => setStatus('qg')} className="btn-combate mt-4">Entrar no Combate</button>
                        </div>
                    </div>
                </div>
            );

            if (status === 'qg') return (
                <div className="min-h-screen militar-gradient">
                    <header className="bg-[#000814] border-b-2 border-[#D4AF37] p-6 flex items-center justify-between">
                        <img src={LOGO_FENIX} className="h-12 rounded" />
                        <div className="text-center">
                            <h2 className="text-2xl font-black text-[#D4AF37] italic uppercase">Comandante Eufrásio</h2>
                            <p className="text-[10px] opacity-40 tracking-[0.3em]">CENTRAL DE INTELIGÊNCIA FÊNIX</p>
                        </div>
                        <button onClick={() => setStatus('login')} className="text-red-500 font-bold text-xs border border-red-500/30 px-3 py-1 rounded">SAIR</button>
                    </header>
                    
                    <main className="max-w-6xl mx-auto p-8">
                        {/* BOTÕES DAS ESCOLAS */}
                        <div className="grid grid-cols-2 md:grid-cols-3 gap-6 mb-12">
                            {ESCOLAS.map(e => (
                                <button key={e.s} onClick={() => {setEscolaSel(e.n); setStatus('escola');}} className="card-escola" style={{backgroundImage: `url(${e.bg})`}}>
                                    <span className="sigla-txt">{e.s}</span>
                                    <span className="absolute bottom-3 z-10 text-[10px] font-black text-white/80">{e.n}</span>
                                </button>
                            ))}
                        </div>

                        {/* RANKING DE ALUNOS */}
                        <div className="bg-black/40 border border-[#D4AF37]/30 rounded-xl p-6 shadow-2xl">
                            <h3 className="text-[#D4AF37] font-black italic mb-6 flex items-center gap-2">
                                🏆 RANKING DO EFETIVO (TOP 10)
                            </h3>
                            <div className="space-y-3">
                                {ALUNOS_DB.sort((a,b) => b.pts - a.pts).slice(0, 10).map((al, i) => (
                                    <div key={i} className="flex justify-between items-center p-3 bg-white/5 rounded border-l-4 border-[#D4AF37]">
                                        <span className="font-bold text-sm">#{i+1} {al.p}</span>
                                        <span className="text-[#D4AF37] font-black">{al.pts} PTS</span>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </main>
                </div>
            );

            return (
                <div className="min-h-screen militar-gradient">
                    <header className="bg-black/60 border-b-2 border-[#D4AF37] p-6 flex justify-between items-center sticky top-0 z-50 backdrop-blur-md">
                        <div className="flex items-center gap-4">
                            <img src={LOGO_FENIX} className="h-10 rounded" />
                            <h2 className="text-[#D4AF37] font-black italic text-xl">{escolaSel}</h2>
                        </div>
                        <button onClick={() => setStatus('qg')} className="btn-voltar">VOLTAR AO QG</button>
                    </header>

                    <main className="max-w-7xl mx-auto p-6">
                        <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-12">
                            <button onClick={() => setModal('editais')} className="bg-white/5 border border-[#D4AF37]/30 p-4 rounded-lg font-bold hover:bg-[#D4AF37] hover:text-black transition-all">EDITAIS</button>
                            <button onClick={() => setModal('provas')} className="bg-white/5 border border-[#D4AF37]/30 p-4 rounded-lg font-bold hover:bg-[#D4AF37] hover:text-black transition-all">PROVAS</button>
                            <button onClick={() => setModal('gabaritos')} className="bg-white/5 border border-[#D4AF37]/30 p-4 rounded-lg font-bold hover:bg-[#D4AF37] hover:text-black transition-all">GABARITOS</button>
                            <button className="opacity-40 bg-white/5 p-4 rounded-lg font-bold cursor-not-allowed">SIMULADOS</button>
                        </div>

                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8">
                            {MATERIAIS.map((m, i) => (
                                <div key={i} className="bg-black/40 border border-[#D4AF37]/20 rounded-2xl overflow-hidden shadow-2xl flex flex-col">
                                    <div className="h-64 bg-black flex items-center justify-center p-4">
                                        <img src={BASE_GITHUB + m.f} className="max-h-full" onError={(e) => e.target.src="https://via.placeholder.com/300x400?text=CAPA+FISICA"} />
                                    </div>
                                    <div className="p-5 text-center bg-white/5">
                                        <div className="text-[#D4AF37] font-black mb-4 tracking-widest text-sm">{m.t}</div>
                                        <button className="btn-combate py-2 text-xs">Acessar</button>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </main>

                    {/* MODAL DE ARQUIVOS */}
                    {modal && (
                        <div className="modal-overlay" onClick={() => setModal(null)}>
                            <div className="bg-[#001233] border-2 border-[#D4AF37] p-8 rounded-3xl max-w-xl w-full shadow-2xl" onClick={e => e.stopPropagation()}>
                                <h3 className="text-[#D4AF37] font-black text-2xl mb-8 italic text-center uppercase border-b border-[#D4AF37]/20 pb-4">{modal}</h3>
                                <div className="max-h-96 overflow-y-auto pr-2">
                                    {modal === 'editais' && ['2023', '2022', '2021', '2020'].map(ano => (
                                        <button key={ano} onClick={() => abrirDoc(`edital${ano}CN.pdf`)} className="doc-link">📄 Edital {ano}</button>
                                    ))}
                                    {modal === 'gabaritos' && ['2025', '2024', '2023', '2022', '2021', '2020'].map(ano => (
                                        <button key={ano} onClick={() => abrirDoc(`gabarito${ano}CN.pdf`)} className="doc-link">✅ Gabarito {ano}</button>
                                    ))}
                                    {modal === 'provas' && (
                                        <>
                                            <button onClick={() => abrirDoc('prova2025CN-mat-ingles.pdf')} className="doc-link">📝 Prova 2025 - Mat/Ing</button>
                                            <button onClick={() => abrirDoc('prova2024CN-mat-ingles.pdf')} className="doc-link">📝 Prova 2024 - Mat/Ing</button>
                                            <button onClick={() => abrirDoc('prova2023CN-mat-ingles.pdf')} className="doc-link">📝 Prova 2023 - Mat/Ing</button>
                                        </>
                                    )}
                                </div>
                                <button onClick={() => setModal(null)} className="mt-8 w-full py-3 text-red-500 font-black border border-red-500/20 rounded-lg">FECHAR</button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
