<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIZÚ MILITAR FÊNIX - PLATAFORMA DE ELITE</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --azul-marinho: #050505; --dourado: #D4AF37; --laranja: #ea580c; }
        body { background-color: var(--azul-marinho); color: white; margin: 0; font-family: 'Segoe UI', sans-serif; }
        .militar-gradient { background: radial-gradient(circle at top, #1e293b 0%, #050505 100%); min-height: 100vh; }
        
        .btn-ouro { background: transparent; border: 2px solid var(--dourado); color: var(--dourado); font-weight: 900; transition: 0.3s; cursor: pointer; }
        .btn-ouro:hover { background: var(--dourado); color: black; transform: scale(1.05); box-shadow: 0 0 20px rgba(212, 175, 55, 0.4); }
        
        .btn-ouro-solido { background: var(--dourado); color: black; font-weight: 900; transition: 0.3s; cursor: pointer; }
        .btn-ouro-solido:hover { transform: scale(1.05); box-shadow: 0 0 20px rgba(212, 175, 55, 0.4); }

        .btn-material { background: var(--laranja); color: white; font-weight: 900; padding: 12px; border-radius: 8px; width: 100%; transition: 0.3s; }
        .btn-material:hover { background: #c2410c; transform: translateY(-2px); }

        .card-escola { 
            height: 200px; border-radius: 15px; background-size: cover; background-position: center;
            position: relative; overflow: hidden; cursor: pointer; border: 2px solid rgba(255,255,255,0.1);
        }
        .card-escola::before { content: ""; position: absolute; inset: 0; background: rgba(0,0,0,0.6); transition: 0.3s; }
        .card-escola:hover::before { background: rgba(0,0,0,0.3); }
        .sigla-txt { position: relative; z-index: 10; font-size: 1.5rem; font-weight: 900; italic: true; display: flex; align-items: center; justify-content: center; h-full; height: 100%; text-shadow: 2px 2px 10px black; }

        .card-operacional { background: #0f172a; border: 1px solid rgba(255,255,255,0.05); transition: 0.3s; }
        .video-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 12px; }
        .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
        .motion-header { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; border: 2px solid var(--laranja); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const BASE_URL = "https://ivespe-cpu.github.io/bizu-militar-fenix";

        const CONFIG_ESCOLAS = {
            "COLÉGIO NAVAL": { slug: "cn", materias: ["MATEMÁTICA", "PORTUGUÊS", "INGLÊS", "HISTÓRIA", "GEOGRAFIA", "FÍSICA", "QUÍMICA", "BIOLOGIA"] },
            "EPCAR": { slug: "epcar", materias: ["MATEMÁTICA", "PORTUGUÊS", "INGLÊS"] },
            "CMRJ": { slug: "cmrj", materias: ["MATEMÁTICA", "PORTUGUÊS"], possuiManual: true },
            "EsPCEX": { slug: "espcex", materias: ["MATEMÁTICA", "PORTUGUÊS", "INGLÊS", "HISTÓRIA", "GEOGRAFIA", "FÍSICA", "QUÍMICA"] },
            "EEAR": { slug: "eear1", materias: ["MATEMÁTICA", "PORTUGUÊS", "INGLÊS", "FÍSICA"] },
            "ESA": { slug: "esa", materias: ["MATEMÁTICA", "PORTUGUÊS", "INGLÊS", "HISTÓRIA", "GEOGRAFIA"] }
        };

        const ALUNOS_DB = [
            { m: "ags186", p: "SG.GASPARELLO", pts: 1500 }, { m: "alm170", p: "SG. MOURA", pts: 1450 },
            { m: "gfa109", p: "SUB.TEN. ARAUJO", pts: 1900 }, { m: "jgm108", p: "SUB.TEN. MORAES", pts: 1950 },
            { m: "jpj110", p: "ASP. JOÃO SAMUEL", pts: 2000 }
        ];

        const QUESTOES_DB = {
            "COLÉGIO NAVAL": [
                { q: "Se x + 1/x = 5, determine o valor de x² + 1/x².", opts: ["23", "25", "27", "30"], correta: 0, bizu: "Eleve (x + 1/x)² = 25. O termo central é 2. Logo, 25 - 2 = 23." }
            ]
        };

        const VIDEOS_DB = [{ t: "MARINHA DO BRASIL", id: "zSSp5CQpg10" }, { t: "ESPCEX AMAN", id: "WKMS3LfGERo" }];
        const FRASES = ["Coragem não é não ter medo, e sim, seguir em frente.", "Os fortes agem, avançam e deixam um legado."];

        function App() {
            const [status, setStatus] = useState('login'); 
            const [user, setUser] = useState(null);
            const [senhaIn, setSenhaIn] = useState('');
            const [escolaSel, setEscolaSel] = useState('COLÉGIO NAVAL');
            const [fraseDia, setFraseDia] = useState('');
            const [pdfAtivo, setPdfAtivo] = useState(null);

            useEffect(() => {
                setFraseDia(FRASES[Math.floor(Math.random() * FRASES.length)]);
            }, [status]);

            const formatar = (t) => t.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\s+/g, "_");

            const handleLogin = (e) => {
                if(e) e.preventDefault();
                const s = senhaIn.toLowerCase().trim();
                const aluno = ALUNOS_DB.find(a => a.m === s);
                if (s === "esp0815" || aluno) { 
                    setUser(aluno || { p: "COMANDANTE", n: "Chefe" }); 
                    setStatus('qg'); 
                } else { alert("ACESSO NEGADO!"); }
            };

            const renderContent = () => {
                if (status === 'login') return (
                    <div className="min-h-screen flex items-center justify-center p-6">
                        <div className="max-w-md w-full bg-black/80 p-8 rounded-2xl border-2 border-[#D4AF37]/30 text-center">
                            <h1 className="text-2xl font-black text-orange-500 mb-6 italic">BIZÚ MILITAR FÊNIX</h1>
                            <form onSubmit={handleLogin}>
                                <input type="password" value={senhaIn} onChange={(e) => setSenhaIn(e.target.value)}
                                    className="w-full p-4 mb-4 bg-white/5 border border-[#D4AF37]/20 rounded text-white text-center text-xl" 
                                    placeholder="MATRÍCULA" />
                                <button type="submit" className="btn-material">AUTENTICAR</button>
                            </form>
                        </div>
                    </div>
                );

                if (status === 'qg') return (
                    <div className="min-h-screen">
                        <header className="bg-[#000814] border-b-2 border-[#D4AF37] p-4 flex items-center justify-between px-6">
                            <h2 className="text-orange-500 font-black italic">ESQUADRÃO FÊNIX</h2>
                            <button onClick={() => setStatus('login')} className="text-red-500 font-bold text-xs">SAIR</button>
                        </header>
                        <main className="max-w-7xl mx-auto p-6 grid grid-cols-1 lg:grid-cols-3 gap-8">
                            <div className="lg:col-span-2">
                                <div className="bg-black/40 border-l-4 border-red-600 p-6 mb-8 rounded-r-lg">
                                    <p className="text-xl font-medium italic">"{fraseDia}"</p>
                                </div>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    {Object.keys(CONFIG_ESCOLAS).map(escolaNome => (
                                        <div key={escolaNome} onClick={() => {setEscolaSel(escolaNome); setStatus('menu_escola');}} 
                                            className="card-escola" 
                                            style={{backgroundImage: `url(${BASE_URL}/jpg/${CONFIG_ESCOLAS[escolaNome].slug}.jpg)`}}>
                                            <span className="sigla-txt">{escolaNome}</span>
                                        </div>
                                    ))}
                                </div>
                            </div>
                            <div className="bg-black/40 p-5 rounded-xl border border-[#D4AF37]/20 h-fit">
                                <h3 className="text-[#D4AF37] font-black text-center mb-4 uppercase">Ranking Pelotão</h3>
                                <div className="space-y-2">
                                    {ALUNOS_DB.sort((a,b) => b.pts - a.pts).slice(0,5).map((a, i) => (
                                        <div key={i} className="flex justify-between p-3 bg-white/5 rounded text-[11px] border-l-4 border-[#D4AF37]">
                                            <span>{i+1}º {a.p}</span><span className="text-[#D4AF37] font-black">{a.pts} PTS</span>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </main>
                    </div>
                );

                if (status === 'menu_escola') return (
                    <div className="min-h-screen flex flex-col">
                        <header className="bg-[#0f172a] border-b-4 border-orange-600 p-5 flex justify-between items-center">
                            <h1 className="font-black italic text-orange-500 uppercase">{escolaSel}</h1>
                            <button onClick={() => setStatus('qg')} className="btn-ouro-solido px-6 py-2 rounded-lg text-[10px]">VOLTAR AO QG</button>
                        </header>
                        <main className="flex-1 flex items-center justify-center p-6">
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-8 w-full max-w-5xl">
                                <button onClick={() => setStatus('simulado')} className="p-10 bg-gradient-to-br from-red-600 to-red-900 rounded-3xl text-center hover:scale-105 transition-all">
                                    <span className="block text-4xl mb-4">📝</span><span className="font-black text-xl">SIMULADOS</span>
                                </button>
                                <button onClick={() => setStatus('materiais')} className="p-10 bg-gradient-to-br from-blue-600 to-blue-900 rounded-3xl text-center hover:scale-105 transition-all">
                                    <span className="block text-4xl mb-4">📚</span><span className="font-black text-xl">BIBLIOTECA</span>
                                </button>
                                <button onClick={() => setStatus('videos')} className="p-10 bg-gradient-to-br from-orange-500 to-orange-700 rounded-3xl text-center hover:scale-105 transition-all">
                                    <span className="block text-4xl mb-4">🎬</span><span className="font-black text-xl">CINE FÊNIX</span>
                                </button>
                            </div>
                        </main>
                    </div>
                );

                if (status === 'materiais') {
                    const escola = CONFIG_ESCOLAS[escolaSel];
                    const slugLimpo = escola.slug.replace('1','');
                    return (
                        <div className="min-h-screen">
                            <header className="bg-[#0f172a] border-b-4 border-orange-600 p-5 flex justify-between items-center">
                                <h1 className="font-black italic text-orange-500 uppercase">BIBLIOTECA: {escolaSel}</h1>
                                <button onClick={() => setStatus('menu_escola')} className="btn-ouro-solido px-6 py-2 rounded-lg text-[10px]">RECUAR</button>
                            </header>
                            <main className="p-8 max-w-7xl mx-auto">
                                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8">
                                    {escola.materias.map((m) => (
                                        <div key={m} className="card-operacional rounded-3xl overflow-hidden p-5">
                                            <h3 className="font-black text-[11px] mb-4 uppercase text-orange-100">{m}</h3>
                                            <button onClick={() => window.open(`${BASE_URL}/pdf/${formatar(m)}_${slugLimpo}.pdf`)}
                                                className="w-full bg-orange-600 text-black font-black py-3 rounded-xl text-xs">LER APOSTILA</button>
                                        </div>
                                    ))}
                                </div>
                            </main>
                        </div>
                    );
                }

                if (status === 'videos') return (
                    <div className="min-h-screen">
                        <header className="bg-[#0f172a] border-b-4 border-orange-600 p-5 flex justify-between items-center">
                            <h1 className="font-black italic text-orange-500">CINE FÊNIX</h1>
                            <button onClick={() => setStatus('menu_escola')} className="btn-ouro-solido px-6 py-2 rounded-lg text-[10px]">VOLTAR</button>
                        </header>
                        <main className="max-w-7xl mx-auto p-6 grid grid-cols-1 md:grid-cols-2 gap-8">
                            {VIDEOS_DB.map((v, i) => (
                                <div key={i} className="bg-black/40 p-6 rounded-3xl border border-white/5">
                                    <h3 className="text-orange-500 font-black mb-4 uppercase text-xs">{v.t}</h3>
                                    <div className="video-container">
                                        <iframe src={`https://www.youtube.com/embed/${v.id}`} allowFullScreen></iframe>
                                    </div>
                                </div>
                            ))}
                        </main>
                    </div>
                );
                
                return null;
            }

            return (
                <div className="militar-gradient relative min-h-screen">
                    {renderContent()}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
