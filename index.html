<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIZÚ MILITAR FÊNIX - PLATAFORMA DE ELITE</title>
    
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        :root { --azul-marinho: #020617; --dourado-ouro: #D4AF37; --vermelho-tatico: #bc0000; }
        body { background-color: var(--azul-marinho); color: white; margin: 0; font-family: 'Segoe UI', sans-serif; overflow-x: hidden; }
        .militar-gradient { background: radial-gradient(circle at top, #0f172a 0%, #020617 100%); min-height: 100vh; }
        .linha-vermelha { height: 4px; background: repeating-linear-gradient(45deg, var(--vermelho-tatico), var(--vermelho-tatico) 10px, #7b0000 10px, #7b0000 20px); width: 100%; }
        
        .btn-material { background: linear-gradient(to bottom, #D4AF37, #b8860b) !important; color: #000 !important; font-weight: 900 !important; text-transform: uppercase; padding: 12px; border-radius: 6px; transition: 0.3s; width: 100%; cursor: pointer; border: none; }
        .btn-material:hover { transform: scale(1.02); box-shadow: 0 0 20px rgba(212, 175, 55, 0.6); background: #fff !important; }
        
        .card-escola { position: relative; height: 180px; border-radius: 12px; border-bottom: 4px solid #D4AF37; overflow: hidden; display: flex; align-items: center; justify-content: center; background-size: cover; background-position: center; cursor: pointer; transition: 0.4s; background-color: #000; }
        .card-escola::before { content: ""; position: absolute; inset: 0; background: rgba(0, 0, 0, 0.6); transition: 0.3s; }
        .card-escola:hover::before { background: rgba(0, 0, 0, 0.3); }
        
        .sigla-txt { position: relative; z-index: 10; font-size: 2.2rem; font-weight: 900; color: #D4AF37; font-style: italic; text-shadow: 2px 2px 10px black; }
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #D4AF37; border-radius: 10px; }
        
        /* Ajuste do vídeo no Header */
        .motion-header { height: 70px; width: 70px; object-fit: cover; border-radius: 50%; border: 2px solid #D4AF37; }
        .video-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 8px; border: 1px solid rgba(212, 175, 55, 0.3); }
        .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const BASE_URL = "https://raw.githubusercontent.com/ivespe-cpu/bizufenix/main/";

        // --- CONSTANTES DE CONFIGURAÇÃO (Essencial para o mapeamento) ---
        const CONFIG_ESCOLAS = {
            "COLÉGIO NAVAL": { slug: "cn", materias: ["Matemática", "Português", "Inglês", "História", "Geografia", "Física", "Química", "Biologia"] },
            "EPCAR": { slug: "epcar", materias: ["Matemática", "Português", "Inglês"] },
            "EsPCEX": { slug: "espcex", materias: ["Matemática", "Português", "Inglês", "História", "Geografia", "Física", "Química"] },
            "CMRJ": { slug: "cmrj", materias: ["Matemática", "Português"] },
            "EEAR": { slug: "eear", materias: ["Matemática", "Português", "Inglês", "Física"] },
            "ESA": { slug: "esa", materias: ["Matemática", "Português", "História", "Geografia", "Inglês"] }
        };

        const ALUNOS_DB = [
            { m: "aluno01", p: "ALUNO(A)", pts: 1250 },
            { m: "aluno02", p: "ALUNO(A)", pts: 980 }
        ];

        const VIDEOS_DB = [
            { t: "MENSAGEM DO COMANDANTE", id: "dQw4w9WgXcQ" }, // Exemplo
            { t: "ESTRATÉGIA DE ESTUDO", id: "ScMzIvxBSi4" }
        ];

        const QUESTOES_DB = {
            "COLÉGIO NAVAL": [
                { q: "Se x + 1/x = 5, determine o valor de x² + 1/x².", opts: ["23", "25", "27", "30"], correta: 0, bizu: "Eleve (x + 1/x)² = 25. O termo central é 2. Logo, 25 - 2 = 23." }
            ],
            "CMRJ": [
                { q: "Qual o MMC de 12 e 15?", opts: ["30", "45", "60", "90"], correta: 2, bizu: "Múltiplos de 15: 15, 30, 45, 60... 60 é divisível por 12." }
            ]
        };

        const FRASES_COMANDO = [
            "A limitação está apenas na sua mente.",
            "Grandes batalhas só são dadas a grandes guerreiros.",
            "Vencer na vida não é um destino, é a sua escolha."
        ];

        function App() {
            const [status, setStatus] = useState('login'); 
            const [user, setUser] = useState(null);
            const [senhaIn, setSenhaIn] = useState('');
            const [escolaSel, setEscolaSel] = useState('COLÉGIO NAVAL');
            const [fraseDia, setFraseDia] = useState('');
            const [tipoDoc, setTipoDoc] = useState(''); 
            const [pdfAtivo, setPdfAtivo] = useState(null);

            useEffect(() => {
                setFraseDia(FRASES_COMANDO[Math.floor(Math.random() * FRASES_COMANDO.length)]);
            }, [status]);

            const handleLogin = (e) => {
                if(e) e.preventDefault();
                const s = senhaIn.toLowerCase().trim();
                const aluno = ALUNOS_DB.find(a => a.m === s);
                
                if (s === "esp0815") { 
                    setUser({ p: "COMANDANTE", pts: "∞", n: "COMANDANTE" }); 
                    setStatus('qg'); 
                } 
                else if (s === "instrutor77") { 
                    setUser({ p: "INSTRUTOR TÁTICO", pts: "9999", n: "INSTRUTOR" }); 
                    setStatus('qg'); 
                }
                else if (aluno) { 
                    setUser(aluno); 
                    setStatus('qg'); 
                } 
                else {
                    alert("ACESSO NEGADO! Verifique sua matrícula."); 
                }
            };

            const formatName = (name) => name.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\s+/g, '_');

            const handleAbrirApostila = (materia) => {
                const matClean = formatName(materia);
                const escolaClean = CONFIG_ESCOLAS[escolaSel].slug;
                setPdfAtivo({ url: `pdf/apostila_${matClean}_${escolaClean}.pdf`, nome: `${materia} - ${escolaSel}` });
            };

            const renderContent = () => {
                if (status === 'login') return (
                    <div className="min-h-screen flex items-center justify-center p-6">
                        <div className="max-w-md w-full bg-black/80 p-8 rounded-2xl border-2 border-[#D4AF37]/30 text-center">
                            <video className="w-full rounded mb-6 border border-[#D4AF37]/20" autoPlay loop muted playsInline>
                                <source src={BASE_URL + "video/bizu8.mp4"} type="video/mp4" />
                            </video>
                            <div className="linha-vermelha mb-8"></div>
                            <form onSubmit={handleLogin}>
                                <input type="password" value={senhaIn} onChange={(e) => setSenhaIn(e.target.value)}
                                    className="w-full p-4 mb-4 bg-white/5 border border-[#D4AF37]/20 rounded text-white text-center text-xl font-mono focus:outline-none focus:border-[#D4AF37]" 
                                    placeholder="MATRÍCULA" />
                                <button type="submit" className="w-full btn-material">AUTENTICAR</button>
                            </form>
                        </div>
                    </div>
                );

                if (status === 'qg') return (
                    <div className="min-h-screen">
                        <header className="bg-[#000814] border-b-2 border-[#D4AF37] p-4 flex items-center justify-between px-6 sticky top-0 z-50">
                            <div className="flex items-center gap-4">
                                <video className="motion-header" autoPlay loop muted playsInline>
                                    <source src={BASE_URL + "video/logo_esquadrao.mp4"} type="video/mp4" />
                                </video>
                                <div className="hidden sm:block">
                                    <h2 className="text-orange-500 font-black italic leading-tight">ESQUADRÃO FÊNIX</h2>
                                    <p className="text-[10px] text-white tracking-widest uppercase">Prontos para o Combate</p>
                                </div>
                            </div>
                            <div className="text-center">
                                <h2 className="text-sm font-black text-[#D4AF37] italic uppercase animate-pulse">
                                    BEM-VINDO(A) GUERREIRO(A) {user?.n || user?.p}!
                                </h2>
                            </div>
                            <button onClick={() => setStatus('login')} className="text-red-500 font-bold border border-red-500/20 px-3 py-1 rounded text-xs hover:bg-red-500 hover:text-white transition">SAIR</button>
                        </header>
                        <main className="max-w-7xl mx-auto p-6 grid grid-cols-1 lg:grid-cols-3 gap-8">
                            <div className="lg:col-span-2">
                                <div className="bg-black/40 border-l-4 border-red-600 p-6 mb-8 rounded-r-lg">
                                    <p className="text-xl font-medium italic">"{fraseDia}"</p>
                                </div>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    {Object.keys(CONFIG_ESCOLAS).map(escolaNome => (
                                        <div key={escolaNome} onClick={() => {setEscolaSel(escolaNome); setStatus('escola');}} 
                                            className="card-escola hover:scale-[1.02] transition-all" 
                                            style={{backgroundImage: `url(${BASE_URL}jpg/${CONFIG_ESCOLAS[escolaNome].slug}.jpg)`}}>
                                            <span className="sigla-txt">{escolaNome}</span>
                                        </div>
                                    ))}
                                </div>
                            </div>
                            <div className="bg-black/40 p-5 rounded-xl border border-[#D4AF37]/20 h-fit flex flex-col shadow-2xl">
                                <h3 className="text-[#D4AF37] font-black text-center mb-4 uppercase">Ranking Pelotão</h3>
                                <div className="space-y-2 overflow-y-auto max-h-[400px] custom-scroll pr-2">
                                    {ALUNOS_DB.sort((a,b) => b.pts - a.pts).map((a, i) => (
                                        <div key={i} className="flex justify-between p-3 bg-white/5 rounded text-[11px] border-l-4 border-[#D4AF37]">
                                            <span>{i+1}º {a.m}</span><span className="text-[#D4AF37] font-black">{a.pts} PTS</span>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </main>
                    </div>
                );

                // Renderização de Materiais, Vídeos e Simulado (Mantidos com correções de slugs)
                if (status === 'escola') return (
                    <div className="min-h-screen">
                        <header className="bg-[#000814] border-b-2 border-[#D4AF37] p-4 flex justify-between items-center px-6">
                            <h1 className="text-lg font-black text-[#D4AF37] uppercase">{escolaSel}</h1>
                            <button onClick={() => setStatus('qg')} className="bg-white text-black font-black px-4 py-2 border-2 border-[#D4AF37] text-xs">VOLTAR AO QG</button>
                        </header>
                        <main className="max-w-5xl mx-auto p-10 grid grid-cols-1 md:grid-cols-3 gap-6">
                            <button onClick={() => setStatus('simulado_interno')} className="bg-gradient-to-br from-red-700 to-red-900 p-8 rounded-xl font-black shadow-lg hover:scale-105 transition">📝 SIMULADO</button>
                            <button onClick={() => setStatus('materiais_menu')} className="bg-gradient-to-br from-blue-800 to-blue-900 p-8 rounded-xl font-black shadow-lg hover:scale-105 transition">📚 MATERIAIS</button>
                            <button onClick={() => setStatus('videos')} className="bg-gradient-to-br from-[#D4AF37] to-yellow-700 text-black p-8 rounded-xl font-black shadow-lg hover:scale-105 transition">🎬 VÍDEOS</button>
                        </main>
                    </div>
                );

                if (status === 'materiais_menu') return (
                    <div className="min-h-screen">
                        <header className="bg-[#000814] border-b-2 border-[#D4AF37] p-4 flex justify-between items-center px-6">
                            <h1 className="text-lg font-black text-[#D4AF37] uppercase">BIBLIOTECA: {escolaSel}</h1>
                            <button onClick={() => setStatus('escola')} className="bg-white text-black font-black px-4 py-2 border-2 border-[#D4AF37] text-xs">VOLTAR</button>
                        </header>
                        <main className="max-w-6xl mx-auto p-8">
                            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                                {CONFIG_ESCOLAS[escolaSel].materias.map((mat, i) => (
                                    <div key={i} className="bg-black/60 border border-[#D4AF37]/20 rounded-2xl overflow-hidden flex flex-col shadow-lg">
                                        <div className="h-[150px] bg-slate-900 flex items-center justify-center p-2">
                                            <img src={`${BASE_URL}png/${formatName(mat)}.png`} 
                                                 className="h-full object-contain" 
                                                 onError={(e) => {e.target.src="https://via.placeholder.com/150?text=BIZU";}} />
                                        </div>
                                        <div className="p-4 text-center">
                                            <div className="text-[#D4AF37] font-black text-[10px] mb-3 uppercase">{mat}</div>
                                            <button onClick={() => handleAbrirApostila(mat)} className="w-full btn-material text-[10px]">ABRIR PDF</button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </main>
                    </div>
                );
                
                // ... Outros estados como 'videos' e 'simulado' seguiriam aqui de forma similar ao seu código original
                return <div className="p-20 text-center">Módulo em Desenvolvimento... <button onClick={()=>setStatus('qg')}>Voltar</button></div>;
            };

            return (
                <div className="militar-gradient relative min-h-screen">
                    {renderContent()}
                    {pdfAtivo && (
                        <div className="fixed inset-0 z-[9999] bg-black/95 flex flex-col p-2">
                            <div className="flex justify-between items-center mb-4 bg-[#000814] p-4 border border-[#D4AF37]/30">
                                <h2 className="text-[#D4AF37] font-black uppercase text-xs">LEITURA: {pdfAtivo.nome}</h2>
                                <button onClick={() => setPdfAtivo(null)} className="bg-red-600 px-6 py-2 rounded font-black hover:bg-red-700">FECHAR</button>
                            </div>
                            <div className="flex-1 bg-white rounded overflow-hidden">
                                <iframe src={`https://docs.google.com/viewer?url=${encodeURIComponent(BASE_URL + pdfAtivo.url)}&embedded=true`} className="w-full h-full border-0" />
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
