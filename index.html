<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIZÚ MILITAR FÊNIX - COMANDO GERAL</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --azul-marinho: #001233; --dourado-ouro: #D4AF37; }
        body { background-color: var(--azul-marinho); color: white; font-family: 'Segoe UI', sans-serif; margin: 0; }
        .militar-gradient { background: linear-gradient(135deg, #001233 0%, #000814 100%); }
        .btn-material { background-color: var(--dourado-ouro) !important; color: #000 !important; font-weight: 900; text-transform: uppercase; padding: 12px; border-radius: 6px; transition: 0.3s; width: 100%; cursor: pointer; border: none; }
        .btn-material:hover { background-color: white !important; transform: scale(1.02); }
        .btn-voltar-fixo { background-color: #fff !important; color: #000 !important; font-weight: 900; padding: 12px 28px; border: 3px solid var(--dourado-ouro); font-size: 16px; text-transform: uppercase; cursor: pointer; border-radius: 4px; }
        .modal-overlay { background: rgba(0,0,0,0.95); position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .doc-link { background: rgba(255,255,255,0.05); border: 1px solid rgba(212, 175, 55, 0.3); padding: 12px; border-radius: 8px; width: 100%; text-align: left; font-weight: bold; transition: 0.2s; margin-bottom: 8px; display: block; color: white; text-decoration: none; }
        .doc-link:hover { background: var(--dourado-ouro); color: black; }
        .scroll-militar::-webkit-scrollbar { width: 6px; }
        .scroll-militar::-webkit-scrollbar-thumb { background: var(--dourado-ouro); border-radius: 10px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;
        const BASE_GITHUB = "https://raw.githubusercontent.com/ivespe-cpu/bizufenix/main/";

        const MATERIAIS = [
            { t: "MATEMÁTICA", f: "matematica.png" }, { t: "PORTUGUÊS", f: "portugues.png" },
            { t: "INGLÊS", f: "ingles.png" }, { t: "HISTÓRIA", f: "historia.png" },
            { t: "GEOGRAFIA", f: "geografia.png" }, { t: "FÍSICA", f: "fisica.png" },
            { t: "QUÍMICA", f: "quimica.png" }, { t: "BIOLOGIA", f: "biologia.png" }
        ];

        function App() {
            const [status, setStatus] = useState('qg'); 
            const [escolaSel, setEscolaSel] = useState('');
            const [modal, setModal] = useState(null);

            const abrirDoc = (file) => window.open(BASE_GITHUB + file, '_blank');

            const ESCOLAS = [
                { s: 'COLÉGIO NAVAL', i: 'https://images.unsplash.com/photo-1590490360182-c33d57733427?w=500' },
                { s: 'EPCAR', i: 'https://www2.fab.mil.br/epcar/images/noticias/2023/fab_em_destaque_2.jpg' },
                { s: 'EsPCEX', i: 'https://www.eb.mil.br/documents/10138/10321350/ESA1.jpg' }
            ];

            if (status === 'qg') return (
                <div className="min-h-screen p-8 militar-gradient text-center">
                    <img src="https://i.ibb.co/BKLSQKT1/logo-bizu.jpg" className="h-24 mx-auto mb-10 rounded-lg border border-white/10 shadow-xl" />
                    <h1 className="text-ouro text-4xl font-black mb-12 italic uppercase tracking-tighter" style={{color: '#D4AF37'}}>QG BIZÚ MILITAR</h1>
                    <div className="max-w-5xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-8">
                        {ESCOLAS.map(e => (
                            <div key={e.s} onClick={() => {setEscolaSel(e.s); setStatus('escola');}} 
                                 className="h-48 bg-cover bg-center rounded-2xl flex items-center justify-center cursor-pointer border-2 border-ouro/20 hover:border-ouro hover:scale-105 transition-all shadow-2xl"
                                 style={{backgroundImage: `linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url(${e.i})`}}>
                                <span className="text-2xl font-black text-ouro italic">{e.s}</span>
                            </div>
                        ))}
                    </div>
                </div>
            );

            return (
                <div className="min-h-screen militar-gradient">
                    <header className="p-6 border-b-2 border-ouro flex justify-between items-center bg-black/40 sticky top-0 z-50">
                        <div className="flex items-center gap-4">
                            <img src="https://i.ibb.co/Q31w6PLJ/logo-esquadrao.jpg" className="h-10 rounded" />
                            <h2 className="text-ouro font-black italic text-xl uppercase">{escolaSel}</h2>
                        </div>
                        <button onClick={() => setStatus('qg')} className="btn-voltar-fixo">VOLTAR AO QG</button>
                    </header>

                    <main className="max-w-7xl mx-auto p-6">
                        <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-12">
                            <button onClick={() => setModal('editais')} className="bg-white/5 border border-ouro/30 p-4 rounded-lg font-bold hover:bg-ouro hover:text-black transition-all">EDITAIS</button>
                            <button onClick={() => setModal('provas')} className="bg-white/5 border border-ouro/30 p-4 rounded-lg font-bold hover:bg-ouro hover:text-black transition-all">PROVAS</button>
                            <button onClick={() => setModal('gabaritos')} className="bg-white/5 border border-ouro/30 p-4 rounded-lg font-bold hover:bg-ouro hover:text-black transition-all uppercase">Gabaritos</button>
                            <button onClick={() => alert("Em manutenção")} className="opacity-40 bg-white/5 p-4 rounded-lg font-bold cursor-not-allowed uppercase">Simulados</button>
                        </div>

                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8">
                            {MATERIAIS.map((m, i) => (
                                <div key={i} className="bg-black/40 border border-ouro/20 rounded-2xl overflow-hidden shadow-2xl flex flex-col">
                                    <div className="h-72 bg-black flex items-center justify-center p-4">
                                        <img src={BASE_GITHUB + m.f} className="max-h-full shadow-lg" onError={(e) => e.target.src="https://via.placeholder.com/300x400?text=CAPA+FISICA"} />
                                    </div>
                                    <div className="p-5 text-center bg-white/5 border-t border-ouro/10">
                                        <div className="text-ouro font-black mb-4 tracking-widest text-sm uppercase">{m.t}</div>
                                        <button className="btn-material">ACESSAR MATERIAL</button>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </main>

                    {modal && (
                        <div className="modal-overlay" onClick={() => setModal(null)}>
                            <div className="bg-[#001233] border-2 border-ouro p-8 rounded-3xl max-w-xl w-full shadow-2xl" onClick={e => e.stopPropagation()}>
                                <h3 className="text-ouro font-black text-2xl mb-8 italic uppercase text-center border-b border-ouro/20 pb-4">{modal} - {escolaSel}</h3>
                                <div className="max-h-96 overflow-y-auto pr-2 scroll-militar">
                                    {modal === 'editais' && (
                                        ['2023', '2022', '2021', '2020'].map(ano => (
                                            <button key={ano} className="doc-link" onClick={() => abrirDoc(`edital${ano}CN.pdf`)}>📄 Edital CN {ano}</button>
                                        ))
                                    )}
                                    {modal === 'provas' && (
                                        <>
                                            <div className="text-xs text-white/40 mb-2 uppercase font-bold tracking-widest">Ano 2025</div>
                                            <button className="doc-link" onClick={() => abrirDoc('prova2025CN-mat-ingles.pdf')}>📝 Prova 2025 - Mat/Inglês</button>
                                            <div className="text-xs text-white/40 mt-4 mb-2 uppercase font-bold tracking-widest">Ano 2024</div>
                                            <button className="doc-link" onClick={() => abrirDoc('prova2024CN-mat-ingles.pdf')}>📝 Prova 2024 - Mat/Inglês</button>
                                            <button className="doc-link" onClick={() => abrirDoc('prova2024CN-Port-Ciencias.pdf')}>📝 Prova 2024 - Port/Ciências</button>
                                            <div className="text-xs text-white/40 mt-4 mb-2 uppercase font-bold tracking-widest">Ano 2023</div>
                                            <button className="doc-link" onClick={() => abrirDoc('prova2023CN-mat-ingles.pdf')}>📝 Prova 2023 - Mat/Inglês</button>
                                            <button className="doc-link" onClick={() => abrirDoc('prova2023CN-Port-Ciencias.pdf')}>📝 Prova 2023 - Port/Ciências</button>
                                        </>
                                    )}
                                    {modal === 'gabaritos' && (
                                        ['2025', '2024', '2023', '2022', '2021', '2020'].map(ano => (
                                            <button key={ano} className="doc-link" onClick={() => abrirDoc(`gabarito${ano}CN.pdf`)}>✅ Gabarito Oficial {ano}</button>
                                        ))
                                    )}
                                </div>
                                <button onClick={() => setModal(null)} className="mt-8 w-full py-3 bg-red-600/20 text-red-500 font-black rounded-lg hover:bg-red-600 hover:text-white transition-all">FECHAR</button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
