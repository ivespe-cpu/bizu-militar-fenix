                            {questoes.map((q, idx) => (
                                <div key={idx} className="bg-[#0f172a] p-8 rounded-3xl border border-white/5 shadow-2xl">
                                    <p className="text-xl font-bold mb-6 text-white/90">QUESTÃO {idx + 1}: {q.q}</p>
                                    <div className="grid gap-3">
                                        {q.opts.map((opt, i) => (
                                            <button key={i} onClick={() => {
                                                if(i === q.correta) alert("✅ NA MOSCA, GUERREIRO!");
                                                else alert(`❌ NEGATIVO! \n\n💡 BIZU: ${q.bizu}`);
                                            }} className="text-left p-4 bg-white/5 border border-white/10 hover:border-orange-500 rounded-xl transition-all">
                                                <span className="text-orange-500 font-black mr-4">{String.fromCharCode(65 + i)})</span> {opt}
                                            </button>
                                        ))}
                                    </div>
                                </div>
                            ))}
                        </main>
                    </div>
                );
            }

            if (status === 'videos') return (
                <div className="min-h-screen">
                    <header className="bg-[#0f172a] border-b-4 border-orange-600 p-5 flex justify-between items-center">
                        <h1 className="font-black italic text-orange-500 uppercase">CINE FÊNIX</h1>
                        <button onClick={() => setStatus('menu_escola')} className="btn-ouro px-6 py-2 rounded-xl text-xs">VOLTAR</button>
                    </header>
                    <main className="max-w-7xl mx-auto p-6 grid grid-cols-1 md:grid-cols-2 gap-8">
                        {VIDEOS_DB.map((v, i) => (
                            <div key={i} className="bg-black/40 p-6 rounded-3xl border border-white/5">
                                <h3 className="text-orange-500 font-black mb-4 uppercase text-xs tracking-widest">{v.t}</h3>
                                <div className="video-container">
                                    <iframe src={`https://www.youtube.com/embed/${v.id}`} allowFullScreen></iframe>
                                </div>
                            </div>
                        ))}
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
