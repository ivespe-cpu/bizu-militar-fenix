<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIZÚ MILITAR FÊNIX - SISTEMA ELITE</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --azul-marinho: #001233; --dourado-ouro: #D4AF37; --vermelho-tatico: #bc0000; }
        body { background-color: var(--azul-marinho); color: white; margin: 0; font-family: 'Segoe UI', sans-serif; }
        .militar-gradient { background: linear-gradient(135deg, #001233 0%, #000814 100%); }
        .linha-vermelha { height: 4px; background: repeating-linear-gradient(45deg, var(--vermelho-tatico), var(--vermelho-tatico) 10px, #7b0000 10px, #7b0000 20px); width: 100%; }
        .btn-combate { background-color: var(--dourado-ouro) !important; color: black !important; font-weight: 900; padding: 1.2rem; border-radius: 0.5rem; box-shadow: 0 0 20px rgba(212, 175, 55, 0.4); transition: 0.3s; width: 100%; }
        .btn-combate:hover { background-color: white !important; transform: scale(1.02); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        // --- CONFIGURAÇÃO DE ACESSO ---
        // COMANDANTE: Altere o valor abaixo para a sua senha de 7 caracteres (3 letras e 4 números)
        const SENHA_MESTRA_ADMIN = "ABC1234"; // <--- ESCREVA SUA SENHA AQUI ENTRE AS ASPAS

        const ALUNOS_DB = [
            { m: "ags186", s: "ags186", p: "SG. GASPARELLO" },
            { m: "alm170", s: "alm170", p: "SG. MOURA" },
            { m: "lmc184", s: "lmc184", p: "SG. COSTA" },
            { m: "mps144", s: "mps144", p: "SG. PEÇANHA" }
            // O sistema usa a matrícula como senha padrão para os alunos.
        ];

        function App() {
            const [status, setStatus] = useState('login'); 
            const [user, setUser] = useState(null);
            const [loginInput, setLoginInput] = useState('');
            const [senhaInput, setSenhaInput] = useState('');

            const handleLogin = (e) => {
                e.preventDefault();
                const log = loginInput.toLowerCase().trim();
                
                // Validação Admin
                if (log === 'admin' && senhaInput === SENHA_MESTRA_ADMIN) {
                    setUser({ p: "COMANDANTE", n: "EUFRÁSIO" });
                    setStatus('qg');
                    return;
                }

                // Validação Aluno
                const aluno = ALUNOS_DB.find(a => a.m === log && a.s === senhaInput);
                if (aluno) {
                    setUser(aluno);
                    setStatus('qg');
                } else {
                    alert("ACESSO NEGADO! Matrícula ou Senha incorretas.");
                }
            };

            if (status === 'login') {
                return (
                    <div className="min-h-screen flex items-center justify-center p-6 militar-gradient">
                        <div className="max-w-md w-full bg-black/70 p-10 rounded-2xl border-2 border-ouro/30 text-center shadow-2xl">
                            <img src="https://i.ibb.co/BKLSQKT1/logo-bizu.jpg" className="w-full mb-4 rounded-lg" />
                            <div className="linha-vermelha mb-8"></div>
                            
                            <form onSubmit={handleLogin} className="flex flex-col gap-4 text-left">
                                <div>
                                    <label className="text-[10px] font-black text-ouro uppercase tracking-widest">Matrícula</label>
                                    <input type="text" value={loginInput} onChange={(e) => setLoginInput(e.target.value)}
                                           className="w-full p-4 bg-white/5 border border-ouro/20 rounded text-white outline-none focus:border-ouro" placeholder="admin ou matrícula" />
                                </div>
                                <div>
                                    <label className="text-[10px] font-black text-ouro uppercase tracking-widest">Senha Operacional</label>
                                    <input type="password" value={senhaInput} onChange={(e) => setSenhaInput(e.target.value)}
                                           className="w-full p-4 bg-white/5 border border-ouro/20 rounded text-white outline-none focus:border-ouro" placeholder="******" />
                                </div>
                                <button type="submit" className="btn-combate mt-4">AUTENTICAR ACESSO</button>
                            </form>
                        </div>
                    </div>
                );
            }

            // ... (Restante do código do QG e Arsenal permanece igual)
            return (
                <div className="min-h-screen">
                    <header className="bg-[#000814] border-b-2 border-ouro p-6 flex items-center justify-between px-10 shadow-xl">
                        <img src="https://i.ibb.co/Q31w6PLJ/logo-esquadrao.jpg" className="h-20 rounded" />
                        <div className="text-center">
                            <h2 className="text-3xl font-black text-ouro italic uppercase tracking-tighter text-center">BEM-VINDO, {user.p}</h2>
                        </div>
                        <button onClick={() => setStatus('login')} className="text-red-500 font-black text-[10px] border border-red-500/30 px-3 py-1 rounded">SAIR</button>
                    </header>
                    <main className="max-w-6xl mx-auto p-12 text-center">
                         <h3 className="text-ouro font-black mb-10 tracking-widest uppercase italic">Painel de Instrução Liberado</h3>
                         <p className="opacity-50">Selecione o módulo de estudo no menu superior para iniciar.</p>
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
