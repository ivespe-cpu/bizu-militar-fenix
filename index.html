<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIZÚ MILITAR FÊNIX - PLATAFORMA DE ELITE</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --azul-marinho: #001233; --dourado-ouro: #D4AF37; --vermelho-tatico: #bc0000; }
        body { background-color: var(--azul-marinho); color: white; margin: 0; font-family: 'Segoe UI', sans-serif; }
        .militar-gradient { background: linear-gradient(135deg, #001233 0%, #000814 100%); }
        .linha-vermelha { height: 4px; background: repeating-linear-gradient(45deg, var(--vermelho-tatico), var(--vermelho-tatico) 10px, #7b0000 10px, #7b0000 20px); width: 100%; }
        .btn-combate { background-color: var(--dourado-ouro) !important; color: black !important; font-weight: 900; padding: 1.2rem; border-radius: 0.5rem; box-shadow: 0 0 20px rgba(212, 175, 55, 0.4); transition: 0.3s; }
        .btn-combate:hover { background-color: white !important; transform: scale(1.02); }
        .card-escola { position: relative; height: 160px; border-radius: 12px; border-bottom: 4px solid var(--dourado-ouro); overflow: hidden; display: flex; align-items: center; justify-content: center; background-size: cover; background-position: center; transition: 0.4s; cursor: pointer; }
        .card-escola::before { content: ""; position: absolute; inset: 0; background: rgba(0, 18, 51, 0.75); }
        .sigla-txt { position: relative; z-index: 10; font-size: 2rem; font-weight: 900; color: var(--dourado-ouro); font-style: italic; text-shadow: 2px 2px 8px black; }
        .capa-doc { width: 100%; height: 260px; object-fit: cover; border-bottom: 2px solid var(--dourado-ouro); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        // --- BANCO DE DATOS INTEGRADO (PLANILHA) ---
        const ALUNOS_DB = [
            { id: 1, nome: "GASPARELLO", matricula: "ags186", patente: "SG. GASPARELLO", pontos: 1500 },
            { id: 2, nome: "MOURA", matricula: "alm170", patente: "SG. MOURA", pontos: 1450 },
            { id: 3, nome: "PINHEIRO", matricula: "bsp223", patente: "SD. PINHEIRO", pontos: 1200 },
            { id: 4, nome: "BRAYAN", matricula: "bab196", patente: "CB. BRAYAN", pontos: 1100 },
            { id: 5, nome: "BERNARDO", matricula: "bbs203", patente: "SD. BERNARDO", pontos: 900 },
            { id: 6, nome: "COSTA", matricula: "lmc184", patente: "SG. COSTA", pontos: 1800 },
            { id: 7, nome: "PEÇANHA", matricula: "mps144", patente: "SG. PEÇANHA", pontos: 1750 },
            { id: 8, nome: "IRENO", matricula: "mis133", patente: "SG. IRENO", pontos: 1300 },
            { id: 9, nome: "GRANADO", matricula: "icg127", patente: "SG. GRANADO", pontos: 1600 },
            { id: 10, nome: "LIMA", matricula: "iws159", patente: "SG. LIMA", pontos: 1150 }
            // ... Sistema preparado para todos os demais alunos
        ];

        const LOGO_BIZU = "https://i.ibb.co/BKLSQKT1/logo-bizu.jpg"; 
        const LOGO_FENIX = "https://i.ibb.co/Q31w6PLJ/logo-esquadrao.jpg"; 

        function App() {
            const [status, setStatus] = useState('login'); 
            const [user, setUser] = useState(null);
            const [escolaSel, setEscolaSel] = useState('');
            const [matriculaInput, setMatriculaInput] = useState('');

            const handleLogin = (e) => {
                e.preventDefault();
                const encontrado = ALUNOS_DB.find(a => a.matricula === matriculaInput.toLowerCase());
                if (encontrado || matriculaInput === 'admin') {
                    setUser(encontrado || { nome: "EUFRÁSIO", patente: "COMANDANTE", pontos: 9999 });
                    setStatus('qg');
                } else {
                    alert("MATRÍCULA NÃO ENCONTRADA NO PELOTÃO!");
                }
            };

            if (status === 'login') {
                return (
                    <div className="min-h-screen flex items-center justify-center p-6 militar-gradient">
                        <div className="max-w-md w-full bg-black/70 p-10 rounded-2xl border-2 border-ouro/30 text-center shadow-2xl">
                            <img src={LOGO_BIZU} className="w-full mb-4 rounded-lg" />
                            <div className="linha-vermelha mb-8"></div>
                            <form onSubmit={handleLogin} className="flex flex-col gap-4 text-left">
                                <label className="text-[10px] font-black text-ouro uppercase">Matrícula Operacional</label>
                                <input type="text" value={matriculaInput} onChange={(e) => setMatriculaInput(e.target.value)}
                                       className="p-4 bg-white/5 border border-ouro/20 rounded text-white outline-none focus:border-ouro" placeholder="Ex: lmc184" />
                                <button type="submit" className="btn-combate mt-4">ENTRAR NO SISTEMA</button>
                            </form>
                        </div>
                    </div>
                );
            }

            if (status === 'qg') {
                const ranking = [...ALUNOS_DB].sort((a, b) => b.pontos - a.pontos);
                return (
                    <div className="min-h-screen">
                        <header className="bg-[#000814] border-b-2 border-ouro p-6 flex items-center justify-between px-10">
                            <img src={LOGO_FENIX} className="h-20 rounded" />
                            <div className="text-center">
                                <h2 className="text-3xl font-black text-ouro italic uppercase tracking-tighter">Bem-vindo, {user.patente}</h2>
                                <p className="text-[10px] tracking-[0.4em] opacity-40 uppercase">Central de Comando Fênix</p>
                            </div>
                            <button onClick={() => setStatus('login')} className="text-red-500 font-black text-xs">SAIR</button>
                        </header>
                        
                        <main className="max-w-7xl mx-auto p-10 grid grid-cols-1 lg:grid-cols-3 gap-10">
                            <div className="lg:col-span-2">
                                <h3 className="text-ouro font-black mb-6 uppercase tracking-widest border-l-4 border-red-600 pl-4">Instituições</h3>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    {['CN', 'CMRJ', 'EEAR', 'EsPCEx', 'ESA', 'EXTRAS'].map(s => (
                                        <div key={s} onClick={() => {setEscolaSel(s); setStatus('escola');}} className="card-escola group">
                                            <span className="sigla-txt">{s}</span>
                                        </div>
                                    ))}
                                </div>
                            </div>

                            <div className="bg-black/40 p-6 rounded-xl border border-ouro/20 shadow-2xl h-fit">
                                <h3 className="text-ouro font-black mb-6 text-center uppercase tracking-widest italic">🏆 Ranking do Pelotão</h3>
                                <div className="space-y-3">
                                    {ranking.slice(0, 5).map((aluno, idx) => (
                                        <div key={aluno.id} className="flex justify-between items-center p-3 bg-white/5 rounded border-l-2 border-ouro">
                                            <span className="text-xs font-bold">{idx+1}º {aluno.patente}</span>
                                            <span className="text-ouro font-mono">{aluno.pontos} pts</span>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </main>
                    </div>
                );
            }

            return (
                <div className="min-h-screen militar-gradient">
                    <header className="bg-[#000814] border-b-2 border-ouro p-6 flex items-center justify-between px-10">
                        <div className="flex items-center gap-6">
                            <img src={LOGO_FENIX} className="h-16 rounded" />
                            <h1 className="text-2xl font-black text-ouro uppercase">{escolaSel} | ARSENAL</h1>
                        </div>
                        <button onClick={() => setStatus('qg')} className="bg-ouro text-black px-6 py-2 rounded text-xs font-black">VOLTAR AO QG</button>
                    </header>
                    <main className="max-w-7xl mx-auto p-10">
                        <div className="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-8 gap-3 mb-10">
                            {['APOSTILAS', 'VÍDEOS', 'SIMULADOS', 'PROVAS', 'EDITAIS', 'GABARITOS'].map(m => (
                                <button key={m} className="bg-white/5 border border-ouro/10 p-3 rounded text-[9px] font-black hover:bg-ouro hover:text-black transition-all">{m}</button>
                            ))}
                        </div>
                        <div className="grid grid-cols-1 md:grid-cols-4 gap-6">
                            {/* Aqui entram as capas das apostilas já configuradas */}
                            <p className="col-span-4 text-center opacity-40 py-20 italic">Selecione o módulo para carregar o material de {escolaSel}...</p>
                        </div>
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
