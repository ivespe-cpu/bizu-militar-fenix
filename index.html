<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIZÚ MILITAR FÊNIX - PLATAFORMA DE ELITE</title>
    
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        :root { --azul-marinho: #001233; --dourado-ouro: #D4AF37; --vermelho-tatico: #bc0000; }
        body { background-color: var(--azul-marinho); color: white; margin: 0; font-family: 'Segoe UI', sans-serif; overflow-x: hidden; }
        .militar-gradient { background: linear-gradient(135deg, #001233 0%, #000814 100%); min-height: 100vh; }
        .linha-vermelha { height: 4px; background: repeating-linear-gradient(45deg, var(--vermelho-tatico), var(--vermelho-tatico) 10px, #7b0000 10px, #7b0000 20px); width: 100%; }
        
        /* BOTÕES */
        .btn-material { background-color: #D4AF37 !important; color: #000 !important; font-weight: 900 !important; text-transform: uppercase; padding: 12px; border-radius: 6px; transition: 0.3s; width: 100%; cursor: pointer; border: none; }
        .btn-material:hover { transform: scale(1.02); box-shadow: 0 0 15px rgba(212, 175, 55, 0.4); background-color: #fff !important; }
        .btn-voltar-fixo { background-color: #fff !important; color: #000 !important; font-weight: 900 !important; padding: 8px 16px !important; border: 3px solid #D4AF37 !important; text-transform: uppercase; cursor: pointer; }
        
        /* CARDS */
        .card-escola { position: relative; height: 180px; border-radius: 12px; border-bottom: 4px solid #D4AF37; overflow: hidden; display: flex; align-items: center; justify-content: center; background-size: cover; background-position: center; cursor: pointer; transition: 0.4s; background-color: #000; }
        .card-escola:hover { transform: translateY(-5px); border-bottom-color: #fff; }
        .card-escola::before { content: ""; position: absolute; inset: 0; background: rgba(0, 18, 51, 0.7); transition: 0.3s; }
        .card-escola:hover::before { background: rgba(0, 18, 51, 0.4); }
        
        .sigla-txt { position: relative; z-index: 10; font-size: 2.2rem; font-weight: 900; color: #D4AF37; font-style: italic; text-shadow: 2px 2px 10px black; }
        .frase-box { background: rgba(0,0,0,0.5); border-left: 4px solid var(--vermelho-tatico); padding: 20px; border-radius: 0 8px 8px 0; }
        
        /* SCROLL E VIDEO */
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #D4AF37; border-radius: 10px; }
        .motion-header { height: 60px; filter: drop-shadow(0 0 5px #D4AF37); }
        .video-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 8px; border: 1px solid rgba(212, 175, 55, 0.3); }
        .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const BASE_URL = "https://raw.githubusercontent.com/ivespe-cpu/bizufenix/main/";

        // ==========================================
        // ARSENAL DE CONFIGURAÇÃO (MATÉRIAS POR ESCOLA)
        // ==========================================
        const CONFIG_ESCOLAS = {
            "COLÉGIO NAVAL": { materias: ["MATEMÁTICA", "PORTUGUÊS", "INGLÊS", "HISTÓRIA", "GEOGRAFIA", "FÍSICA", "QUÍMICA", "BIOLOGIA"], slug: "cn" },
            "EPCAR": { materias: ["MATEMÁTICA", "PORTUGUÊS", "INGLÊS"], slug: "epcar" },
            "CMRJ": { materias: ["MATEMÁTICA", "PORTUGUÊS", "REDAÇÃO"], slug: "cmrj" },
            "EsPCEX": { materias: ["MATEMÁTICA", "PORTUGUÊS", "INGLÊS", "HISTÓRIA", "GEOGRAFIA", "FÍSICA", "QUÍMICA"], slug: "espcex" },
            "EEAR": { materias: ["MATEMÁTICA", "PORTUGUÊS", "INGLÊS", "FÍSICA"], slug: "eear" },
            "ESA": { materias: ["MATEMÁTICA", "PORTUGUÊS", "HISTÓRIA", "GEOGRAFIA", "INGLÊS"], slug: "esa" }
        };

        const QUESTOES_DB = {
            "COLÉGIO NAVAL": [
                { q: "Se x + 1/x = 5, determine o valor de x² + 1/x².", opts: ["23", "25", "27", "30"], correta: 0, bizu: "Eleve (x + 1/x)² = 25. O termo central é 2. Logo, 25 - 2 = 23." },
                { q: "Qual o resto da divisão de 38 por 7?", opts: ["1", "2", "3", "5"], correta: 2, bizu: "38 = 7*5 + 3. Resto é 3." }
            ],
            "CMRJ": [
                { q: "Em uma turma de 30 alunos, 18 gostam de Matemática. Qual a porcentagem?", opts: ["50%", "55%", "60%", "65%"], correta: 2, bizu: "(18/30) * 100 = 0,6 * 100 = 60%." }
            ]
            // ... (Demais questões simplificadas para o exemplo, mantenha as suas no original)
        };

        const ALUNOS_DB = [
            { m: "ags186", p: "SG.GASPARELLO", pts: 1500 }, { m: "alm170", p: "SG. MOURA", pts: 1450 },
            { m: "jgm108", p: "SUB.TEN. MORAES", pts: 1950 }, { m: "jpj110", p: "ASP. JOÃO SAMUEL", pts: 2000 }
            // ... (Mantenha sua lista completa aqui)
        ];

        const FRASES_COMANDO = ["A limitação está apenas na sua mente.", "Grandes batalhas só são dadas a grandes guerreiros.", "Os fortes agem, avançam e deixam um legado."];

        const VIDEOS_DB = [
            { t: "MARINHA DO BRASIL", id: "zSSp5CQpg10" }, { t: "ESPCEX AMAN", id: "WKMS3LfGERo" }
        ];

        function App() {
            const [status, setStatus] = useState('login'); 
            const [user, setUser] = useState(null);
            const [senhaIn, setSenhaIn] = useState('');
            const [escolaSel, setEscolaSel] = useState('COLÉGIO NAVAL');
            const [fraseDia, setFraseDia] = useState('');
            const [tipoDoc, setTipoDoc] = useState(''); 
            const [pdfAtivo, setPdfAtivo] = useState(null);

            useEffect(() => {
                setFraseDia(FRASES_COMANDO[Math.floor(Math.random() * FRASES_COMANDO.length)]);
            }, [status]);

const handleLogin = (e) => {
    if(e) e.preventDefault();
    const s = senhaIn.toLowerCase().trim();
    const aluno = ALUNOS_DB.find(a => a.m === s);

    // LOGICA DE ACESSO POR HIERARQUIA
    if (s === "esp0815" || s === "admin") { 
        setUser({ p: "COMANDANTE", pts: "∞" }); 
        setStatus('qg'); 
    } 
    else if (s === "instrutor77") { // NOVO LOGIN INSTRUTOR
        setUser({ p: "INSTRUTOR DE ELITE", pts: "9999" }); 
        setStatus('qg'); 
    }
    else if (aluno) { 
        setUser(aluno); 
        setStatus('qg'); 
    } 
    else { 
        alert("ACESSO NEGADO! Verifique sua matrícula."); 
    }
};
            // GATILHO PARA ABRIR PDF DINÂMICO
            const handleAbrirApostila = (materia) => {
                const matClean = materia.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\s+/g, '_');
                const escolaClean = CONFIG_ESCOLAS[escolaSel].slug;
                const nomeArquivo = `${matClean}_${escolaClean}.pdf`;
                
                setPdfAtivo({ url: `pdf/${nomeArquivo}`, nome: `${materia} - ${escolaSel}` });
            };

            const renderContent = () => {
                if (status === 'login') return (
                    <div className="min-h-screen flex items-center justify-center p-6">
                        <div className="max-w-md w-full bg-black/80 p-8 rounded-2xl border-2 border-[#D4AF37]/30 shadow-2xl text-center">
                            <video className="w-full rounded mb-6 border border-[#D4AF37]/20" autoPlay loop muted playsInline>
                                <source src={BASE_URL + "bizu8.mp4"} type="video/mp4" />
                            </video>
                            <div className="linha-vermelha mb-8"></div>
                            <input type="password" value={senhaIn} onChange={(e) => setSenhaIn(e.target.value)}
                                   className="w-full p-4 mb-4 bg-white/5 border border-[#D4AF37]/20 rounded text-white text-center text-xl font-mono focus:outline-none focus:border-[#D4AF37]" placeholder="MATRÍCULA" />
                            <button onClick={handleLogin} className="w-full btn-material">AUTENTICAR</button>
                        </div>
                    </div>
                );

                if (status === 'qg') return (
                    <div className="min-h-screen">
                        <header className="bg-[#000814] border-b-2 border-[#D4AF37] p-4 flex items-center justify-between px-6 sticky top-0 z-50">
                            <video className="motion-header" autoPlay loop muted playsInline>
                                <source src={BASE_URL + "esquadrao2.mp4"} type="video/mp4" />
                            </video>
                            <div className="text-center hidden md:block">
                                <h2 className="text-xl font-black text-[#D4AF37] italic uppercase">BEM-VINDO, {user?.p}</h2>
                                <p className="text-[10px] text-white/60 tracking-widest mt-1 uppercase">PLATAFORMA OPERACIONAL FÊNIX</p>
                            </div>
                            <button onClick={() => setStatus('login')} className="text-red-500 font-bold border border-red-500/20 px-3 py-1 rounded text-xs">SAIR</button>
                        </header>
                        <main className="max-w-7xl mx-auto p-6 grid grid-cols-1 lg:grid-cols-3 gap-8">
                            <div className="lg:col-span-2">
                                <div className="frase-box mb-8">
                                    <p className="text-[#D4AF37] text-xs font-black mb-2 tracking-[0.3em]">ORDEM DO DIA:</p>
                                    <p className="text-xl font-medium italic">"{fraseDia}"</p>
                                </div>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    {Object.keys(CONFIG_ESCOLAS).map(escolaNome => (
                                        <div key={escolaNome} onClick={() => {setEscolaSel(escolaNome); setStatus('escola');}} 
                                             className="card-escola hover:scale-[1.02] transition-all" 
                                             style={{backgroundImage: `url(${BASE_URL}${CONFIG_ESCOLAS[escolaNome].slug}.jpg)`}}>
                                            <span className="sigla-txt">{escolaNome}</span>
                                        </div>
                                    ))}
                                </div>
                            </div>
                            <div className="bg-black/40 p-5 rounded-xl border border-[#D4AF37]/20 h-[550px] flex flex-col shadow-2xl">
                                <h3 className="text-[#D4AF37] font-black text-center mb-4 uppercase tracking-widest border-b border-[#D4AF37]/10 pb-2">Ranking Pelotão</h3>
                                <div className="space-y-2 overflow-y-auto custom-scroll pr-2">
                                    {ALUNOS_DB.sort((a,b) => b.pts - a.pts).map((a, i) => (
                                        <div key={i} className="flex justify-between p-3 bg-white/5 rounded text-[11px] border-l-4 border-[#D4AF37]">
                                            <span>{i+1}º {a.p}</span>
                                            <span className="text-[#D4AF37] font-black">{a.pts} PTS</span>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </main>
                    </div>
                );

                if (status === 'escola') return (
                    <div className="min-h-screen">
                        <header className="bg-[#000814] border-b-2 border-[#D4AF37] p-4 flex justify-between items-center px-6 sticky top-0 z-40">
                            <h1 className="text-lg font-black text-[#D4AF37] uppercase italic">{escolaSel}</h1>
                            <button onClick={() => setStatus('qg')} className="btn-voltar-fixo">VOLTAR AO QG</button>
                        </header>
                        <main className="max-w-5xl mx-auto p-10 text-center">
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-6 mb-12">
                                <button onClick={() => setStatus('simulado_interno')} className="bg-gradient-to-br from-red-700 to-red-900 p-8 rounded-xl font-black text-xl hover:scale-105 transition-all border-2 border-white/20 shadow-lg">
                                    📝 <br/>SIMULADO<br/>INTERATIVO
                                </button>
                                <button onClick={() => setStatus('materiais_menu')} className="bg-gradient-to-br from-blue-800 to-blue-900 p-8 rounded-xl font-black text-xl hover:scale-105 transition-all border-2 border-white/20 shadow-lg">
                                    📚 <br/>CENTRAL DE<br/>INTELIGÊNCIA
                                </button>
                                <button onClick={() => setStatus('videos')} className="bg-gradient-to-br from-[#D4AF37] to-yellow-700 text-black p-8 rounded-xl font-black text-xl hover:scale-105 transition-all border-2 border-black/20 shadow-lg">
                                    🎬 <br/>CINE<br/>FÊNIX
                                </button>
                            </div>
                        </main>
                    </div>
                );

                if (status === 'materiais_menu') return (
                     <div className="min-h-screen">
                        <header className="bg-[#000814] border-b-2 border-[#D4AF37] p-4 flex justify-between items-center px-6 sticky top-0 z-40">
                            <h1 className="text-lg font-black text-[#D4AF37] uppercase italic">MATERIAIS: {escolaSel}</h1>
                            <button onClick={() => setStatus('escola')} className="btn-voltar-fixo">VOLTAR</button>
                        </header>
                        <main className="max-w-6xl mx-auto p-8">
                            <div className="flex flex-wrap gap-4 justify-center mb-10">
                                <button onClick={() => { setTipoDoc('PROVAS ANTERIORES'); setStatus('documentos'); }} className="bg-white/10 border border-[#D4AF37]/40 px-6 py-3 rounded hover:bg-[#D4AF37] hover:text-black transition font-black text-[#D4AF37] uppercase">📜 Provas Anteriores</button>
                                <button onClick={() => { setTipoDoc('EDITAIS'); setStatus('documentos'); }} className="bg-white/10 border border-[#D4AF37]/40 px-6 py-3 rounded hover:bg-[#D4AF37] hover:text-black transition font-black text-[#D4AF37] uppercase">📢 Editais</button>
                            </div>
                            
                            <h3 className="text-center text-white mb-6 border-b border-gray-700 pb-2 font-black tracking-widest">APOSTILAS OPERACIONAIS - {escolaSel}</h3>
                            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                                {CONFIG_ESCOLAS[escolaSel].materias.map((mat, i) => (
                                    <div key={i} className="bg-black/60 border border-[#D4AF37]/20 rounded-2xl overflow-hidden flex flex-col shadow-lg hover:shadow-[#D4AF37]/20 transition">
                                        <div className="h-[120px] bg-slate-900 flex items-center justify-center p-2 border-b border-[#D4AF37]/10">
                                            <span className="text-4xl">📚</span>
                                        </div>
                                        <div className="p-4 text-center bg-white/5 flex-grow flex flex-col justify-between">
                                            <div className="text-[#D4AF37] font-black text-xs mb-3 uppercase tracking-wider h-8 flex items-center justify-center">{mat}</div>
                                            <button onClick={() => handleAbrirApostila(mat)} className="w-full btn-material text-[10px] py-2">ESTUDAR AGORA</button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </main>
                    </div>
                );

                if (status === 'simulado_interno') {
                    const questoes = QUESTOES_DB[escolaSel] || [];
                    return (
                        <div className="min-h-screen militar-gradient p-6">
                            <header className="flex justify-between items-center max-w-4xl mx-auto mb-10 border-b border-[#D4AF37] pb-4 sticky top-0 bg-[#001233] z-50 pt-2">
                                <h1 className="text-[#D4AF37] font-black text-xl italic">COMBATE: {escolaSel}</h1>
                                <button onClick={() => setStatus('escola')} className="btn-voltar-fixo text-xs">RECUAR</button>
                            </header>
                            <div className="max-w-4xl mx-auto space-y-8 pb-20">
                                {questoes.length > 0 ? questoes.map((item, index) => (
                                    <div key={index} className="bg-black/60 p-6 rounded-2xl border border-[#D4AF37]/20 shadow-xl">
                                        <p className="text-lg font-bold mb-6 text-white/90"> QUESTÃO {index + 1}: {item.q}</p>
                                        <div className="grid gap-3">
                                            {item.opts.map((opt, i) => (
                                                <button key={i} onClick={() => {
                                                    if(i === item.correta) alert("✅ NA MOSCA, GUERREIRO!");
                                                    else alert(`❌ ERRADO! \n\n💡 BIZU: ${item.bizu}`);
                                                }} className="text-left p-4 bg-white/5 border border-white/10 hover:border-[#D4AF37] hover:bg-[#D4AF37]/20 rounded-lg transition-all">
                                                    <span className="text-[#D4AF37] font-bold mr-2">{String.fromCharCode(65 + i)})</span> {opt}
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                )) : <p className="text-center text-xl text-gray-400 uppercase font-black">Missões em breve para esta unidade.</p>}
                            </div>
                        </div>
                    );
                }

                if (status === 'documentos') {
                    const arquivos = [`edital_${CONFIG_ESCOLAS[escolaSel].slug}.pdf`, `prova_anterior_${CONFIG_ESCOLAS[escolaSel].slug}.pdf` ];
                    return (
                        <div className="min-h-screen">
                            <header className="bg-[#000814] border-b-2 border-[#D4AF37] p-4 flex justify-between items-center px-10">
                                <h1 className="text-xl font-black text-[#D4AF37] italic uppercase">{tipoDoc}</h1>
                                <button onClick={() => setStatus('materiais_menu')} className="btn-voltar-fixo">VOLTAR</button>
                            </header>
                            <main className="max-w-4xl mx-auto p-6">
                                <div className="space-y-3">
                                    {arquivos.map((arq, idx) => (
                                        <div key={idx} className="flex justify-between items-center p-4 bg-black/40 border-l-4 border-[#D4AF37] rounded hover:bg-white/5 transition">
                                            <span className="text-xs font-bold uppercase text-gray-300">{arq.replace(/_/g, ' ')}</span>
                                            <button onClick={() => setPdfAtivo({ url: `pdf/${arq}`, nome: arq.toUpperCase() })}
                                                    className="bg-[#D4AF37] text-black text-[10px] font-black px-6 py-2 rounded hover:scale-105 transition">VISUALIZAR</button>
                                        </div>
                                    ))}
                                </div>
                            </main>
                        </div>
                    );
                }

                if (status === 'videos') return (
                    <div className="min-h-screen">
                        <header className="bg-[#000814] border-b-2 border-[#D4AF37] p-4 flex justify-between items-center px-6 sticky top-0 z-50">
                            <h1 className="text-xl font-black text-[#D4AF37] italic uppercase">🎬 CINE FÊNIX</h1>
                            <button onClick={() => setStatus('escola')} className="btn-voltar-fixo">VOLTAR</button>
                        </header>
                        <main className="max-w-7xl mx-auto p-6 grid grid-cols-1 md:grid-cols-2 gap-8">
                            {VIDEOS_DB.map((v, i) => (
                                <div key={i} className="bg-black/60 p-4 rounded-xl border border-[#D4AF37]/20">
                                    <h3 className="text-[#D4AF37] font-bold mb-3 uppercase text-xs">{v.t}</h3>
                                    <div className="video-container">
                                        <iframe src={`https://www.youtube.com/embed/${v.id}`} allowFullScreen></iframe>
                                    </div>
                                </div>
                            ))}
                        </main>
                    </div>
                );
            };

            return (
                <div className="militar-gradient relative min-h-screen">
                    {renderContent()}

                    {/* MODAL DE PDF (GATILHO DE ELITE) */}
                    {pdfAtivo && (
                        <div className="fixed inset-0 z-[9999] bg-black/95 flex flex-col p-2 md:p-6">
                            <div className="flex justify-between items-center mb-4 bg-[#000814] p-4 border border-[#D4AF37]/30 rounded">
                                <h2 className="text-[#D4AF37] font-black uppercase text-xs italic tracking-widest">
                                    LEITURA: {pdfAtivo.nome}
                                </h2>
                                <button onClick={() => setPdfAtivo(null)} 
                                        className="bg-red-600 text-white px-6 py-2 rounded font-black hover:bg-red-700 shadow-[0_0_15px_rgba(220,38,38,0.5)]">
                                    FECHAR
                                </button>
                            </div>
                            <div className="flex-1 bg-white rounded overflow-hidden border-2 border-[#D4AF37]/20 shadow-2xl">
                                <iframe src={`https://docs.google.com/viewer?url=${encodeURIComponent(BASE_URL + pdfAtivo.url)}&embedded=true`} 
                                        className="w-full h-full border-0" />
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
