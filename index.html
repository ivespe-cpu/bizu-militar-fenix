<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIZÚ MILITAR FÊNIX - PLATAFORMA DE ELITE</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --azul-marinho: #001233; --dourado-ouro: #D4AF37; --vermelho-tatico: #bc0000; }
        body { background-color: var(--azul-marinho); color: white; margin: 0; font-family: 'Segoe UI', sans-serif; overflow-x: hidden; }
        .militar-gradient { background: linear-gradient(135deg, #001233 0%, #000814 100%); }
        .linha-vermelha { height: 4px; background: repeating-linear-gradient(45deg, var(--vermelho-tatico), var(--vermelho-tatico) 10px, #7b0000 10px, #7b0000 20px); width: 100%; }
        .btn-combate { background-color: var(--dourado-ouro) !important; color: black !important; font-weight: 900; padding: 1.2rem; border-radius: 0.5rem; box-shadow: 0 0 20px rgba(212, 175, 55, 0.4); transition: 0.3s; width: 100%; text-transform: uppercase; }
        .card-escola { position: relative; height: 180px; border-radius: 12px; border-bottom: 4px solid var(--dourado-ouro); overflow: hidden; display: flex; align-items: center; justify-content: center; background-size: cover; background-position: center; transition: 0.4s; cursor: pointer; border: 1px solid rgba(212, 175, 55, 0.2); }
        .card-escola::before { content: ""; position: absolute; inset: 0; background: rgba(0, 18, 51, 0.75); transition: 0.3s; }
        .card-escola:hover::before { background: rgba(0, 18, 51, 0.4); }
        .sigla-txt { position: relative; z-index: 10; font-size: 2rem; font-weight: 900; color: var(--dourado-ouro); font-style: italic; text-shadow: 2px 2px 10px black; text-align: center; line-height: 1; }
        .capa-doc { width: 100%; height: 280px; object-fit: contain; background: #000; border-bottom: 1px solid var(--dourado-ouro); }
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: var(--dourado-ouro); border-radius: 10px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const ALUNOS_DB = [
            { m: "ags186", p: "SG.GASPARELLO", pts: 1500 }, { m: "alm170", p: "SG. MOURA", pts: 1450 },
            { m: "bsp223", p: "SD. PINHEIRO", pts: 1200 }, { m: "bab196", p: "CB. BRAYAN", pts: 1100 },
            { m: "bbs203", p: "SD. BERNARDO", pts: 900 }, { m: "cvs208", p: "CB. CAMILA", pts: 1050 },
            { m: "dva194", p: "CB. ALBUQUERQUE", pts: 1300 }, { m: "esp192", p: "SG. PEIXOTO", pts: 1250 },
            { m: "egc228", p: "CB. ENZO", pts: 850 }, { m: "gsp187", p: "SG. GABRIELLE PEREIRA", pts: 1400 },
            { m: "gac174", p: "SG. GABRIELLY COUTINHO", pts: 1350 }, { m: "gem240", p: "SD.MICAELA", pts: 950 },
            { m: "gfa109", p: "SUB.TEN. ARAUJO", pts: 1900 }, { m: "hls197", p: "CB. SALES", pts: 1150 },
            { m: "icg127", p: "SG. GRANADO", pts: 1600 }, { m: "iws159", p: "SG. LIMA", pts: 1550 },
            { m: "jgm108", p: "SUB.TEN. MORAES", pts: 1950 }, { m: "jpj110", p: "ASP. JOÃO SAMUEL", pts: 2000 },
            { m: "jva190", p: "SG. ANDRADE", pts: 1480 }, { m: "jhs198", p: "CB. JOSUÉ", pts: 1120 },
            { m: "jcm166", p: "SG. JUNIO", pts: 1420 }, { m: "kfs245", p: "CB. FONTES", pts: 1080 },
            { m: "lgb226", p: "CB. BELTRON", pts: 1190 }, { m: "lod225", p: "CB. FADINI", pts: 1170 },
            { m: "lse165", p: "SG. ELEUTHÉRIO", pts: 1510 }, { m: "lfs220", p: "CB. LUIZ FERNANDO", pts: 1030 },
            { m: "lmc184", p: "SG. COSTA", pts: 1800 }, { m: "mps144", p: "SG. PEÇANHA", pts: 1750 },
            { m: "mis133", p: "SG. IRENO", pts: 1320 }, { m: "nmp214", p: "CB. NATHAN", pts: 800 },
            { m: "nab161", p: "SG. NICOLLAS ARTHUR", pts: 1580 }, { m: "nvo148", p: "SG. NICOLY VICTORIA", pts: 1570 },
            { m: "php105", p: "SUB.TEN. PAULO", pts: 1910 }, { m: "pha219", p: "CB. PEDRO HENRIQUE", pts: 1180 },
            { m: "pho188", p: "SG. DE PAULA", pts: 1410 }, { m: "phm185", p: "SG. PEDRO RIBEIRO", pts: 1430 },
            { m: "phc232", p: "SD. PIETRO", pts: 920 }, { m: "rsb130", p: "SG. BARBOSA", pts: 1620 },
            { m: "scg216", p: "SD. SAMANTHA", pts: 940 }, { m: "tvo212", p: "SG. THAYANE", pts: 1390 },
            { m: "tgs164", p: "SG. GARCIA", pts: 1470 }, { m: "vho129", p: "SG. VICTOR HUGO", pts: 1650 }
        ];

        const FRASES = [
            "O QUE VOCÊ FAZ NO QUARTEL, FICA NO QUARTEL. O QUE VOCÊ FAZ NO BIZÚ, TE LEVA À APROVAÇÃO!",
            "TREINAMENTO DIFÍCIL, COMBATE FÁCIL. ESTUDE AGORA, COMANDE DEPOIS.",
            "A DOR É TEMPORÁRIA, O NOME NO DIÁRIO OFICIAL É PARA SEMPRE.",
            "NÃO PARE QUANDO ESTIVER CANSADO, PARE QUANDO TIVER CONCLUÍDO A MISSÃO."
        ];

        const ESCOLAS = [
            { s: 'COLÉGIO NAVAL', i: 'https://images.unsplash.com/photo-1590490360182-c33d57733427?w=800' },
            { s: 'EPCAR', i: 'https://i.ibb.co/mFmP8qM/epcar-bg.png' }, 
            { s: 'CMRJ', i: 'https://upload.wikimedia.org/wikipedia/commons/thumb/5/5a/Col%C3%A9gio_Militar_do_Rio_de_Janeiro.jpg/800px-Col%C3%A9gio_Militar_do_Rio_de_Janeiro.jpg' },
            { s: 'EsPCEX', i: 'https://i.ibb.co/Yy0b1X0/espcex-bg.png' },
            { s: 'EEAR', i: 'https://www2.fab.mil.br/eear/images/noticias/2023/06_JUNHO/23_eear/DSC_0137.jpg' },
            { s: 'ESA', i: 'https://upload.wikimedia.org/wikipedia/commons/0/0e/Escola_de_Sargentos_das_Armas.jpg' }
        ];

        const MATERIAIS = [
            { t: "MATEMÁTICA", img: "https://i.ibb.co/MD42sWr9/capa-matematica.png" },
            { t: "PORTUGUÊS", img: "https://i.ibb.co/tTJPWYsH/capa-portugues.png" },
            { t: "INGLÊS", img: "https://i.ibb.co/rRGhQGv8/capa-ingles.png" },
            { t: "HISTÓRIA", img: "https://i.ibb.co/tPbpMN1z/capa-historia.png" },
            { t: "GEOGRAFIA", img: "https://i.ibb.co/L6Vv6yF/capa-geografia.png" },
            { t: "FÍSICA", img: "https://i.ibb.co/9vB4Zf8/capa-fisica.png" },
            { t: "QUÍMICA", img: "https://i.ibb.co/K2N2XvH/capa-quimica.png" },
            { t: "BIOLOGIA", img: "https://i.ibb.co/wL4N6Gk/capa-biologia.png" }
        ];

        function App() {
            const [status, setStatus] = useState('login'); 
            const [user, setUser] = useState(null);
            const [senhaIn, setSenhaIn] = useState('');
            const [escolaSel, setEscolaSel] = useState('');
            const [frase, setFrase] = useState("");

            useEffect(() => {
                setFrase(FRASES[Math.floor(Math.random() * FRASES.length)]);
            }, [status]);

            const handleLogin = (e) => {
                e.preventDefault();
                const s = senhaIn.toLowerCase().trim();
                if (s === "esp0815" || s === "admin") {
                    setUser({ p: "COMANDANTE", n: "EUFRÁSIO" });
                    setStatus('qg');
                } else {
                    const aluno = ALUNOS_DB.find(a => a.m === s);
                    if (aluno) { setUser(aluno); setStatus('qg'); }
                    else { alert("ACESSO NEGADO! Verifique sua matrícula."); }
                }
            };

            if (status === 'login') {
                return (
                    <div className="min-h-screen flex items-center justify-center p-6 militar-gradient">
                        <div className="max-w-md w-full bg-black/80 p-10 rounded-2xl border-2 border-ouro/30 shadow-2xl text-center">
                            <img src="https://i.ibb.co/BKLSQKT1/logo-bizu.jpg" className="w-full mb-6 rounded-lg shadow-lg border border-ouro/10" />
                            <div className="linha-vermelha mb-8"></div>
                            <form onSubmit={handleLogin} className="flex flex-col gap-4">
                                <label className="text-[10px] font-black text-ouro uppercase tracking-widest text-left">Acesso do Operacional</label>
                                <input type="password" value={senhaIn} onChange={(e) => setSenhaIn(e.target.value)}
                                       className="p-4 bg-white/5 border border-ouro/20 rounded text-white outline-none focus:border-ouro text-center text-xl font-mono" placeholder="DIGITE SUA SENHA" />
                                <button type="submit" className="btn-combate mt-2">ENTRAR NO QG</button>
                            </form>
                        </div>
                    </div>
                );
            }

            if (status === 'qg') {
                const ranking = [...ALUNOS_DB].sort((a, b) => b.pts - a.pts);
                return (
                    <div className="min-h-screen">
                        <header className="bg-[#000814] border-b-2 border-ouro p-6 flex items-center justify-between px-10 shadow-xl sticky top-0 z-50">
                            <img src="https://i.ibb.co/Q31w6PLJ/logo-esquadrao.jpg" className="h-16 rounded" />
                            <div className="text-center hidden md:block">
                                <h2 className="text-2xl font-black text-ouro italic uppercase leading-none">Bem-vindo, {user.p}</h2>
                                <p className="text-[10px] text-white/50 tracking-[0.2em] mt-1 font-bold">MISSÃO DADA É MISSÃO CUMPRIDA</p>
                            </div>
                            <button onClick={() => setStatus('login')} className="bg-red-600/20 text-red-500 font-black text-[10px] border border-red-500/30 px-4 py-2 rounded hover:bg-red-600 hover:text-white transition-all uppercase">Encerrar Turno</button>
                        </header>
                        
                        <div className="bg-white/5 border-b border-ouro/10 p-3 text-center">
                            <p className="text-ouro font-bold text-xs italic tracking-wide">" {frase} "</p>
                        </div>

                        <main className="max-w-7xl mx-auto p-6 lg:p-10 grid grid-cols-1 lg:grid-cols-3 gap-10">
                            <div className="lg:col-span-2 grid grid-cols-1 md:grid-cols-2 gap-6">
                                {ESCOLAS.map(item => (
                                    <div key={item.s} onClick={() => {setEscolaSel(item.s); setStatus('escola');}} 
                                         className="card-escola hover:scale-[1.02] active:scale-95" style={{backgroundImage: `url(${item.i})`}}>
                                        <span className="sigla-txt">{item.s}</span>
                                    </div>
                                ))}
                            </div>
                            
                            <div className="bg-black/40 p-6 rounded-xl border border-ouro/20 shadow-2xl h-[600px] flex flex-col">
                                <h3 className="text-ouro font-black mb-6 text-center uppercase italic border-b border-ouro/20 pb-2">🏆 Ranking do Pelotão</h3>
                                <div className="space-y-2 overflow-y-auto custom-scroll pr-2">
                                    {ranking.map((aluno, idx) => (
                                        <div key={idx} className={`flex justify-between p-3 rounded border-l-4 ${idx < 3 ? 'bg-ouro/10 border-ouro' : 'bg-white/5 border-white/20'} text-[11px] transition-all hover:bg-white/10`}>
                                            <span className="font-bold">{idx+1}º {aluno.p}</span>
                                            <span className="text-ouro font-black">{aluno.pts} PTS</span>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </main>
                    </div>
                );
            }

            return (
                <div className="min-h-screen militar-gradient">
                    <header className="bg-[#000814] border-b-2 border-ouro p-6 flex justify-between items-center px-10 sticky top-0 z-50">
                        <div className="flex items-center gap-4">
                            <img src="https://i.ibb.co/Q31w6PLJ/logo-esquadrao.jpg" className="h-12 rounded" />
                            <h1 className="text-xl font-black text-ouro uppercase italic tracking-tighter">{escolaSel} | Arsenal</h1>
                        </div>
                        <button onClick={() => setStatus('qg')} className="bg-white text-black px-8 py-3 rounded shadow-2xl font-black text-sm hover:bg-ouro hover:scale-105 active:scale-95 transition-all">
                            VOLTAR AO QG
                        </button>
                    </header>

                    <main className="max-w-7xl mx-auto p-6 lg:p-10">
                        <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-3 mb-12">
                            {['APOSTILAS', 'VÍDEOS', 'SIMULADOS', 'PROVAS', 'EDITAIS', 'GABARITOS'].map(m => (
                                <button key={m} onClick={() => alert(`Sistema de ${m} em manutenção. Disponível em breve.`)}
                                        className="bg-white/5 border border-ouro/20 p-3 rounded text-[10px] font-black hover:bg-ouro hover:text-black transition-all uppercase tracking-widest shadow-lg">
                                    {m}
                                </button>
                            ))}
                        </div>

                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8">
                            {MATERIAIS.map((m, i) => (
                                <div key={i} className="bg-black/60 border border-ouro/20 rounded-2xl overflow-hidden hover:border-ouro transition-all shadow-2xl group flex flex-col">
                                    <div className="h-[300px] bg-black flex items-center justify-center p-2">
                                        <img src={m.img} className="capa-doc group-hover:scale-105 transition-all duration-500" />
                                    </div>
                                    <div className="p-5 text-center bg-white/5 flex-grow border-t border-ouro/10">
                                        <div className="text-ouro font-black text-sm mb-4 tracking-widest uppercase">{m.t}</div>
                                        <button className="w-full bg-ouro text-black text-[11px] py-3 rounded-lg hover:bg-white transition-all font-black uppercase shadow-lg">
                                            Baixar Material
                                        </button>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
