<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIZÚ MILITAR FÊNIX - V3.7 ELITE</title>
    
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        :root { --dourado: #D4AF37; --azul: #001233; }
        body { background-color: var(--azul); color: white; margin: 0; font-family: 'Segoe UI', sans-serif; overflow-x: hidden; }
        .militar-gradient { background: linear-gradient(180deg, #001233 0%, #000814 100%); min-height: 100vh; }
        
        /* HOVER NOS CARDS DAS ESCOLAS */
        .card-escola { 
            position: relative; height: 160px; border-radius: 12px; border: 2px solid rgba(212, 175, 55, 0.2); 
            overflow: hidden; display: flex; align-items: center; justify-content: center; 
            background-size: cover; background-position: center; cursor: pointer; 
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .card-escola:hover { transform: translateY(-8px); border-color: var(--dourado); box-shadow: 0 10px 30px rgba(212, 175, 55, 0.4); }
        .card-escola::before { content: ""; position: absolute; inset: 0; background: rgba(0, 18, 51, 0.65); transition: 0.3s; }
        .card-escola:hover::before { background: rgba(0, 18, 51, 0.3); }

        /* BOTÕES DO HUB */
        .btn-hub-master {
            height: 120px; font-size: 1.2rem; font-weight: 900; border-radius: 15px;
            text-transform: uppercase; border: 2px solid rgba(255,255,255,0.1);
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; transition: 0.3s;
        }
        .btn-hub-master:hover { transform: scale(1.05); border-color: var(--dourado); box-shadow: 0 0 20px rgba(0,0,0,0.5); }

        .logo-header-top { width: 140px; height: auto; filter: drop-shadow(0 0 8px var(--dourado)); }
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: var(--dourado); border-radius: 10px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        // --- CONFIGURAÇÃO DE CAMINHOS TÁTICOS (PASTAS DO REPOSITÓRIO) ---
        const BASE_URL = "https://raw.githubusercontent.com/ivespe-cpu/bizufenix/main/";
        const VIDEO_URL = BASE_URL + "video/";
        const PNG_URL   = BASE_URL + "png/"; 
        const PDF_URL   = BASE_URL + "pdf/";

        const CONFIG_ESCOLAS = {
            "COLÉGIO NAVAL": { materias: ["MATEMÁTICA", "PORTUGUÊS", "INGLÊS", "HISTÓRIA", "GEOGRAFIA", "FÍSICA", "QUÍMICA", "BIOLOGIA"], slug: "cn" },
            "EPCAR": { materias: ["MATEMÁTICA", "PORTUGUÊS", "INGLÊS", "REDAÇÃO"], slug: "epcar" },
            "CMRJ": { materias: ["MATEMÁTICA", "PORTUGUÊS", "REDAÇÃO", "MANUAL"], slug: "cmrj" },
            "EsPCEX": { materias: ["MATEMÁTICA", "PORTUGUÊS", "INGLÊS", "HISTÓRIA", "GEOGRAFIA", "FÍSICA", "QUÍMICA"], slug: "espcex" },
            "EEAR": { materias: ["MATEMÁTICA", "PORTUGUÊS", "INGLÊS", "FÍSICA"], slug: "eear" },
            "ESA": { materias: ["MATEMÁTICA", "PORTUGUÊS", "HISTÓRIA", "GEOGRAFIA", "INGLÊS"], slug: "esa" }
        };

        const ALUNOS_DB = [
            { m: "ags186", p: "SG.GASPARELLO", pts: 1500 }, { m: "alm170", p: "SG. MOURA", pts: 1450 },
            { m: "bsp223", p: "SD. PINHEIRO", pts: 1200 }, { m: "bab196", p: "CB. BRAYAN", pts: 1100 },
            { m: "bbs203", p: "SD. BERNARDO", pts: 900 }, { m: "cvs208", p: "CB. CAMILA", pts: 1050 },
            { m: "dva194", p: "CB. ALBUQUERQUE", pts: 1300 }, { m: "esp192", p: "SG. PEIXOTO", pts: 1250 },
            { m: "egc228", p: "CB. ENZO", pts: 850 }, { m: "gsp187", p: "SG. GABRIELLE PEREIRA", pts: 1400 },
            { m: "gac174", p: "SG. GABRIELLY COUTINHO", pts: 1350 }, { m: "gem240", p: "SD.MICAELA", pts: 950 },
            { m: "gfa109", p: "SUB.TEN. ARAUJO", pts: 1900 }, { m: "hls197", p: "CB. SALES", pts: 1150 },
            { m: "icg127", p: "SG. GRANADO", pts: 1600 }, { m: "iws159", p: "SG. LIMA", pts: 1550 },
            { m: "jgm108", p: "SUB.TEN. MORAES", pts: 1950 }, { m: "jpj110", p: "ASP. JOÃO SAMUEL", pts: 2000 },
            { m: "jva190", p: "SG. ANDRADE", pts: 1480 }, { m: "jhs198", p: "CB. JOSUÉ", pts: 1120 },
            { m: "jcm166", p: "SG. JUNIO", pts: 1420 }, { m: "kfs245", p: "CB. FONTES", pts: 1080 },
            { m: "lgb226", p: "CB. BELTRON", pts: 1190 }, { m: "lod225", p: "CB. FADINI", pts: 1170 },
            { m: "lse165", p: "SG. ELEUTHÉRIO", pts: 1510 }, { m: "lfs220", p: "CB. LUIZ FERNANDO", pts: 1030 },
            { m: "lmc184", p: "SG. COSTA", pts: 1800 }, { m: "mps144", p: "SG. PEÇANHA", pts: 1750 },
            { m: "mis133", p: "SG. IRENO", pts: 1320 }, { m: "nmp214", p: "CB. NATHAN", pts: 800 },
            { m: "nab161", p: "SG. NICOLLAS ARTHUR", pts: 1580 }, { m: "nvo148", p: "SG. NICOLY VICTORIA", pts: 1570 },
            { m: "php105", p: "SUB.TEN. PAULO", pts: 1910 }, { m: "pha219", p: "CB. PEDRO HENRIQUE", pts: 1180 },
            { m: "pho188", p: "SG. DE PAULA", pts: 1410 }, { m: "phm185", p: "SG. PEDRO RIBEIRO", pts: 1430 },
            { m: "phc232", p: "SD. PIETRO", pts: 920 }, { m: "rsb130", p: "SG. BARBOSA", pts: 1620 },
            { m: "scg216", p: "SD. SAMANTHA", pts: 940 }, { m: "tvo212", p: "SG. THAYANE", pts: 1390 },
            { m: "tgs164", p: "SG. GARCIA", pts: 1470 }, { m: "vho129", p: "SG. VICTOR HUGO", pts: 1650 }
        ];
        function App() {
            const [status, setStatus] = useState('login'); 
            const [user, setUser] = useState(null);
            const [senhaIn, setSenhaIn] = useState('');
            const [escolaSel, setEscolaSel] = useState('COLÉGIO NAVAL');
            const [pdfAtivo, setPdfAtivo] = useState(null);

            const handleLogin = (e) => {
    if(e) e.preventDefault();
    const s = senhaIn.toLowerCase().trim();
    const aluno = ALUNOS_DB.find(a => a.m === s);

    // LOGICA DE ACESSO POR HIERARQUIA
    if (s === "esp0815" || s === "admin") { 
        setUser({ p: "COMANDANTE", pts: "∞" }); 
        setStatus('qg'); 
    } 
    else if (s === "instrutor77") { // NOVO LOGIN INSTRUTOR
        setUser({ p: "INSTRUTOR DE ELITE", pts: "9999" }); 
        setStatus('qg'); 
    }
    else if (aluno) { 
        setUser(aluno); 
        setStatus('qg'); 
    } 
    else { 
        alert("ACESSO NEGADO! Verifique sua matrícula."); 
    }
};
            const HeaderFenix = () => (
                <div className="w-full flex justify-center py-6 bg-black/40 border-b border-[#D4AF37]/30">
                    <video className="logo-header-top" autoPlay loop muted playsInline>
                        <source src={VIDEO_URL + "logo_esquadrao.mp4"} type="video/mp4" />
                    </video>
                </div>
            );

            if (status === 'login') return (
                <div className="militar-gradient flex items-center justify-center p-6">
                    <div className="max-w-md w-full bg-black/80 p-8 rounded-2xl border-2 border-[#D4AF37]/30 text-center shadow-2xl">
                        <video className="w-full rounded mb-6 border border-[#D4AF37]/20" autoPlay loop muted playsInline>
                            <source src={VIDEO_URL + "logo_bizu2.mp4"} type="video/mp4" />
                        </video>
                        <input type="password" value={senhaIn} onChange={(e) => setSenhaIn(e.target.value)}
                            className="w-full p-4 mb-4 bg-white/5 border border-[#D4AF37]/20 rounded text-white text-center font-mono focus:border-[#D4AF37] outline-none transition-all" placeholder="MATRÍCULA" />
                        <button onClick={handleLogin} className="w-full bg-[#D4AF37] text-black font-black p-4 rounded hover:bg-white transition-all uppercase">AUTENTICAR</button>
                    </div>
                </div>
            );

            if (status === 'qg') return (
                <div className="militar-gradient flex flex-col min-h-screen">
                    <HeaderFenix />
                    <div className="text-center mt-8 px-4">
                        <h2 className="text-[#D4AF37] text-2xl font-black italic uppercase tracking-tighter">
                            {user?.cargo === 'instrutor' ? `ORDENS DO DIA, ${user?.p}!` : `BEM-VINDO AO COMBATE, ${user?.p}!`}
                        </h2>
                        <p className="text-white/40 italic text-xs mt-2">"O treinamento difícil torna o combate fácil."</p>
                    </div>
                    <main className="max-w-7xl mx-auto p-6 grid grid-cols-1 lg:grid-cols-3 gap-10 mt-6">
                        <div className="lg:col-span-2 grid grid-cols-1 md:grid-cols-2 gap-6">
                            {Object.keys(CONFIG_ESCOLAS).map(nome => (
                                <div key={nome} onClick={() => {setEscolaSel(nome); setStatus('central');}} 
                                     className="card-escola" style={{backgroundImage: `url(${BASE_URL}${CONFIG_ESCOLAS[nome].slug}.jpg)`}}>
                                    <span className="relative z-10 text-2xl font-black text-[#D4AF37] italic uppercase">{nome}</span>
                                </div>
                            ))}
                        </div>
                        <div className="bg-black/40 p-5 rounded-xl border border-[#D4AF37]/20 h-fit">
                            <h3 className="text-[#D4AF37] font-black text-center mb-4 uppercase text-xs border-b border-[#D4AF37]/20 pb-2">Top Pelotão</h3>
                            <div className="space-y-2 max-h-[400px] overflow-y-auto custom-scroll pr-2">
                                {ALUNOS_DB.sort((a,b) => b.pts - a.pts).map((a, i) => (
                                    <div key={i} className={`flex justify-between p-3 rounded text-[11px] border-l-4 ${a.m === user?.m ? 'bg-[#D4AF37]/20 border-white' : 'bg-white/5 border-[#D4AF37]'}`}>
                                        <span>{i+1}º {a.p}</span>
                                        <span className="text-[#D4AF37] font-black">{a.pts} PTS</span>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </main>
                    <button onClick={() => setStatus('login')} className="mx-auto my-10 text-red-500 font-bold uppercase text-[10px] hover:text-white transition-all">Encerrar Sessão</button>
                </div>
            );

            if (status === 'central') return (
                <div className="militar-gradient min-h-screen flex flex-col">
                    <HeaderFenix />
                    <div className="flex-1 flex flex-col items-center justify-center p-6">
                        <h1 className="text-4xl font-black text-[#D4AF37] mb-12 italic uppercase">{escolaSel}</h1>
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-8 w-full max-w-5xl">
                            <button onClick={() => setStatus('simulados')} className="btn-hub-master bg-red-950/40 text-red-500 border-red-500/20">
                                <span className="text-4xl">📝</span> SIMULADOS
                            </button>
                            <button onClick={() => setStatus('materiais')} className="btn-hub-master bg-blue-950/40 text-blue-400 border-blue-400/20">
                                <span className="text-4xl">📚</span> MATERIAIS
                            </button>
                            <button onClick={() => setStatus('videos')} className="btn-hub-master bg-amber-900/30 text-amber-500 border-amber-500/20">
                                <span className="text-4xl">🎬</span> CINE FÊNIX
                            </button>
                        </div>
                        <button onClick={() => setStatus('qg')} className="mt-16 px-10 py-3 border-2 border-white text-white font-black rounded hover:bg-[#D4AF37] hover:border-[#D4AF37] hover:text-black transition-all uppercase italic">Voltar ao QG</button>
                    </div>
                </div>
            );

            if (status === 'materiais') return (
                <div className="militar-gradient min-h-screen flex flex-col">
                    <HeaderFenix />
                    <div className="p-6">
                        <header className="flex justify-between items-center mb-10 max-w-7xl mx-auto">
                            <h1 className="text-[#D4AF37] font-black text-2xl italic uppercase">{escolaSel} - Materiais</h1>
                            <button onClick={() => setStatus('central')} className="bg-white text-black px-6 py-2 font-black rounded text-xs">VOLTAR</button>
                        </header>
                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8 max-w-7xl mx-auto">
                            {CONFIG_ESCOLAS[escolaSel].materias.map((mat, i) => {
                                const slugEscola = CONFIG_ESCOLAS[escolaSel].slug;
                                const nomeMateria = mat.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\s+/g, '_');

                                let thumb;
                                if (mat === "MANUAL") {
                                    thumb = "capa_manual_cmrj.png";
                                } else {
                                    thumb = `card_${nomeMateria}_${slugEscola}.png`;
                                }

                                const pdf = (mat === "MANUAL") ? 'manual_cmrj.pdf' : `${nomeMateria}_${slugEscola}.pdf`;
                                
                                return (
                                    <div key={i} className="bg-black/60 border border-[#D4AF37]/20 rounded-2xl overflow-hidden flex flex-col group hover:border-[#D4AF37] transition-all">
                                        <div className="h-[200px] bg-cover bg-center transition-transform group-hover:scale-105" 
                                             style={{backgroundImage: `url(${PNG_URL}${thumb})`, backgroundColor: '#111'}}></div>
                                        <div className="p-5 text-center bg-black/80">
                                            <div className="text-[#D4AF37] font-black text-[10px] mb-4 uppercase h-8 flex items-center justify-center">{mat}</div>
                                            <button onClick={() => setPdfAtivo({ nome: mat, url: `pdf/${pdf}` })} 
                                                    className="w-full bg-[#D4AF37] text-black font-black py-3 rounded text-[10px] hover:bg-white transition-all uppercase">Estudar PDF</button>
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                </div>
            );

            if (status === 'videos') return (
                <div className="militar-gradient min-h-screen flex flex-col">
                    <HeaderFenix />
                    <div className="p-6 max-w-6xl mx-auto">
                        <header className="flex justify-between items-center mb-10">
                            <h1 className="text-[#D4AF37] font-black text-2xl italic uppercase">🎬 CINE FÊNIX</h1>
                            <button onClick={() => setStatus('central')} className="bg-white text-black px-6 py-2 font-black rounded text-xs">VOLTAR</button>
                        </header>
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                            {[
                                { t: "MARINHA DO BRASIL", id: "zSSp5CQpg10" },
                                    { t: "FAB - EPCAR", id: "Vq_Z5KNmuks" },
                                    { t: "MOTIVACIONAL", id: "Nc3WusSAIQI" },
                                    { t: "ESPCEX AMAN", id: "WKMS3LfGERo" },
                                    { t: "EXÉRCITO BRASILEIRO", id: "H0Gssr6mZbw" },
                                    { t: "QUEM DISSE QUE SERIA FÁCIL", id: "dOV_Dum7t58" }
                                ].map((v, i) => (

                                <div key={i} className="bg-black/40 p-4 rounded-xl border border-[#D4AF37]/20">
                                    <h3 className="text-[#D4AF37] font-bold mb-3 uppercase text-[10px]">{v.t}</h3>
                                    <div className="aspect-video">
                                        <iframe className="w-full h-full rounded" src={`https://www.youtube.com/embed/${v.id}`} allowFullScreen></iframe>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );

            return null;
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(
            <div className="relative min-h-screen">
                <App />
                {/* MODAL GLOBAL PARA PDF */}
                <PdfViewer pdf={pdfAtivo} setPdfAtivo={setPdfAtivo} />
            </div>
        );

        function PdfViewer({ pdf, setPdfAtivo }) {
            if (!pdf) return null;
            const urlCompleta = `https://docs.google.com/viewer?url=${encodeURIComponent(BASE_URL + pdf.url)}&embedded=true`;
            return (
                <div className="fixed inset-0 z-[9999] bg-black/95 flex flex-col p-4">
                    <div className="flex justify-between items-center mb-4 bg-[#000814] p-4 border border-[#D4AF37]/30 rounded">
                        <h2 className="text-[#D4AF37] font-black uppercase text-xs">VISUALIZANDO: {pdf.nome}</h2>
                        <button onClick={() => setPdfAtivo(null)} className="bg-red-600 text-white px-8 py-2 rounded font-black uppercase text-xs">FECHAR</button>
                    </div>
                    <iframe src={urlCompleta} className="flex-1 w-full bg-white rounded" />
                </div>
            );
        }
    </script>
</body>
</html>
