<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIZÚ MILITAR FÊNIX - SISTEMA DE GESTÃO</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --azul-marinho: #001233; --dourado: #D4AF37; --vermelho: #bc0000; }
        body { background-color: var(--azul-marinho); color: white; margin: 0; font-family: sans-serif; }
        .militar-gradient { background: linear-gradient(135deg, #001233 0%, #000814 100%); }
        .border-dourada { border: 2px solid var(--dourado); }
        .linha-vermelha { height: 4px; background: repeating-linear-gradient(45deg, var(--vermelho), var(--vermelho) 10px, #8b0000 10px, #8b0000 20px); }
        .fenix-input { background: rgba(255,255,255,0.05); border: 1px solid var(--dourado); padding: 12px; border-radius: 5px; color: white; width: 100%; outline: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- BANCO DE DADOS INTEGRADO (BASEADO NO SEU BACKEND) ---
        const USUARIOS_BASE = [
            { matricula: "AdminFenix", senha: "123", nome: "Eufrásio", patente: "Comandante", perfil: "ADMIN" },
            { matricula: "184LMC", senha: "123", nome: "Costa", patente: "2º SG.", perfil: "ALUNO" },
            { matricula: "144MPS", senha: "123", nome: "Peçanha", patente: "1º SG.", perfil: "ALUNO" },
            { matricula: "INSTR_SILVA", senha: "123", nome: "Silva", patente: "Instrutor", perfil: "INSTRUTOR" }
        ];

        function App() {
            const [userLogado, setUserLogado] = useState(null);
            const [form, setForm] = useState({ matricula: '', senha: '' });
            const [erro, setErro] = useState('');
            const [escolaSel, setEscolaSel] = useState('');
            const [status, setStatus] = useState('login'); 

            const frases = [
                "O treinamento difícil torna o combate bem mais fácil",
                "A disciplina é a alma de um exército",
                "Só o que é bom dura o tempo suficiente para se tornar inesquecível.",
                "A limitação está apenas na sua mente e não no seu corpo",
                "A jornada mais longa começa com o primeiro passo.",
                "Se você pode sonhar, pode realizar."
            ];

            const handleLogin = () => {
                const encontrou = USUARIOS_BASE.find(u => u.matricula === form.matricula && u.senha === form.senha);
                if (encontrou) {
                    setUserLogado(encontrou);
                    setStatus('qg');
                    setErro('');
                } else {
                    setErro('ACESSO NEGADO: Credenciais Inválidas');
                }
            };

            // TELA DE LOGIN TÁTICA
            if (status === 'login') {
                return (
                    <div className="min-h-screen flex items-center justify-center p-6 militar-gradient">
                        <div className="max-w-md w-full bg-black/60 p-10 rounded-lg border-2 border-[#D4AF37] text-center shadow-2xl">
                            <h1 className="text-2xl font-black text-[#D4AF37] mb-2 uppercase italic">Bizu Militar Fênix</h1>
                            <p className="text-[10px] tracking-[0.3em] mb-6">SISTEMA DE ACESSO RESTRITO</p>
                            <div className="linha-vermelha mb-8"></div>
                            
                            <div className="flex flex-col gap-4 text-left">
                                <label className="text-[10px] font-bold text-dourado">MATRÍCULA</label>
                                <input className="fenix-input" type="text" onChange={e => setForm({...form, matricula: e.target.value})} />
                                
                                <label className="text-[10px] font-bold text-dourado">SENHA</label>
                                <input className="fenix-input" type="password" onChange={e => setForm({...form, senha: e.target.value})} />
                                
                                {erro && <p className="text-red-500 text-[10px] font-bold text-center">{erro}</p>}
                                
                                <button onClick={handleLogin} className="mt-4 bg-[#D4AF37] text-black py-4 rounded font-black hover:bg-white transition-all uppercase text-xs">Iniciar Operação</button>
                            </div>
                        </div>
                    </div>
                );
            }

            // CENTRAL DE COMANDO
            if (status === 'qg') {
                const dia = new Date().getDay();
                const fraseDoDia = frases[dia === 0 ? 0 : dia - 1];

                return (
                    <div className="min-h-screen">
                        <header className="bg-[#000814] border-b-2 border-dourado p-4 flex justify-between items-center px-8 shadow-xl">
                            <div className="flex items-center gap-4">
                                <span className="text-dourado font-black italic">ESQUADRÃO FÊNIX</span>
                            </div>
                            <div className="text-right">
                                <p className="text-[10px] font-bold">Logado como:</p>
                                <p className="text-xs text-dourado font-black uppercase">{userLogado.patente} {userLogado.nome}</p>
                            </div>
                        </header>
                        
                        <main className="max-w-6xl mx-auto p-10">
                            <div className="bg-white/5 p-6 rounded-lg border-l-8 border-red-600 mb-10">
                                <h2 className="text-2xl font-black text-dourado uppercase italic mb-2">
                                    {userLogado.perfil === 'ADMIN' ? 'Painel do Comandante' : 'Central de Comando'}
                                </h2>
                                <p className="text-white italic">"Bem-vindo, {userLogado.patente} {userLogado.nome}. {fraseDoDia}"</p>
                            </div>
                            
                            {/* GRADE DE ESCOLAS */}
                            <div className="grid grid-cols-2 md:grid-cols-3 gap-6">
                                {['Colégio Naval', 'Escola Militar-RJ', 'EEAR', 'EsPCEx', 'ESA', 'CONCURSOS'].map(escola => (
                                    <button key={escola} onClick={() => {setEscolaSel(escola); setStatus('escola');}} 
                                            className="bg-white/5 p-8 rounded border-b-4 border-dourado hover:bg-dourado/10 transition-all flex flex-col items-center gap-2">
                                        <div className="w-12 h-12 bg-dourado rounded-full flex items-center justify-center text-black font-black">HQ</div>
                                        <span className="font-black text-xs uppercase text-dourado">{escola}</span>
                                    </button>
                                ))}
                            </div>

                            {userLogado.perfil === 'ADMIN' && (
                                <div className="mt-10 p-4 border border-dashed border-dourado/30 rounded text-center">
                                    <p className="text-[10px] text-dourado font-black">ACESSO DE COMANDANTE LIBERADO: GESTÃO DE ALUNOS ATIVA</p>
                                </div>
                            )}
                        </main>
                    </div>
                );
            }

            // PÁGINA INTERNA (EX: COLÉGIO NAVAL)
            return (
                <div className="min-h-screen militar-gradient">
                    <header className="bg-[#000814] border-b-2 border-dourado p-4 flex justify-between items-center px-8">
                        <span className="font-black italic text-dourado uppercase">{escolaSel}</span>
                        <button onClick={() => setStatus('qg')} className="text-xs font-black border border-dourado p-2 rounded">VOLTAR AO QG</button>
                    </header>
                    <main className="max-w-6xl mx-auto p-10 text-center">
                        <div className="grid grid-cols-3 md:grid-cols-6 gap-2 mb-10">
                            {['APOSTILAS', 'VIDEOAULAS', 'MOTIVACIONAIS', 'INSTITUCIONAIS', 'PROVAS', 'EDITAIS'].map(m => (
                                <div key={m} className="bg-white/5 p-4 border border-dourado/20 rounded text-[9px] font-black">{m}</div>
                            ))}
                        </div>
                        <h3 className="text-dourado font-black italic">CONTEÚDO DISPONÍVEL PARA O {userLogado.patente.toUpperCase()} {userLogado.nome.toUpperCase()}</h3>
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
